PMC4835621_01_D3|PMC4835621_01_T11": [[32, 47, 67, 7, 22, "NONE", "TREATED_BY", 0.993]], "PMC4835621_01_E9|PMC4835621_01_D4": [[34, 8, 14, 45, 54, "NONE", "REVEALS", 0.994]]}, "sentences": {"9": "The patient's vital signs were normal, without fever.", "11": "Upon physical examination scattered petechiae were observed over the upper extremities.", "12": "The rest of the patient's physical examination was within normal limits including heart, lungs, and abdomen.", "16": "Laboratory diagnostic tests revealed a white blood cell count of 6100 per microliter with 73% neutrophils, hemoglobin of 11.3 g/dL with a mean corpuscular volume (MVC) 94 femtoliters, and a reticulocyte count of 2.4%.", "20": "Blood chemistry revealed normal creatinine and liver function tests.", "25": "Bone marrow biopsy demonstrated slightly hypercellular marrow for the patient's age, with no other significant changes.", "29": "In order to rule out underling malignancy a computed tomography (CT) scan of the chest and abdomen was performed and showed an intraluminal thickening of 3.5 cm size in the stomach (Figure 1).", "32": "During hospitalization the patient developed a deep vein thrombosis and treatment with low molecular weight heparin (LMWH) was initiated.", "33": "Further investigation with gastroduodenoscopy demonstrated normal esophagus with a few erosions in the antrum of the stomach and was consistent with gastritis.", "34": "Gastric biopsy found moderate active chronic gastritis and was positive for H. pylori and negative for dysplasia."}}, "PMC5137649_01": {"patient": "age=44.0; gender=Female", "text": "A 44-year-old woman presented with a 3-day history of right flank and lower quadrant abdominal pain associated with nausea and constipation. Her past medical, family and medication history were otherwise non-contributory and her physical examination was unremarkable. She underwent contrast enhanced computed tomography, demonstrating a 6cm cystic lesion between the stomach and body/tail of the pancreas (Fig 1). She subsequently underwent EUS-FNA, which revealed normal pancreatic echotexture and a cyst measuring 6cm x 9cm that was free of internal septations or associated masses (Fig 2) but compressed the stomach. FNA of the cyst demonstrated no evidence of malignancy but did show the presence of extracellular mucin as well as a carcinoembryonic antigen (CEA) level of 12,476.5ng/ml and a carbohydrate antigen (CA) 19-9 level of 6iu/ml, suggesting the diagnosis of a mucinous pancreatic cystic neoplasm. The patient was therefore referred for surgical resection.   \r\nA laparoscopic distal pancreatectomy was planned. At the time of the laparoscopic exploration, entrance to the lesser sac was first obtained and, on mobilising the posterior wall of the stomach, the lesion was noted to be tightly adherent to both the stomach and pancreas. The pancreas was mobilised free of the cyst and it was evident that the lesion originated from the stomach. Intraoperative endoscopy was performed and no mucosal abnormalities of the stomach were noted.\r\nOn further mobilisation, the cyst was adherent to the coeliac axis and the procedure was converted to an open resection. The stomach was fully mobilised and the gastric duplication cyst was noted to be arising from the posterior wall. It was dissected off the coeliac vessels and an enbloc resection of the cyst along with a portion of the posterior wall of the stomach with a surgical stapler was performed. Repeat oesophagogastroduodenoscopy revealed the presence of an intact staple line on the posterior stomach wall and no evidence of bleeding or leak. The gross margins were uninvolved.\r\nFinal pathology revealed a 9.5cm x 4.5cm x 2.0cm cyst with a smooth internal cyst wall consistent with a GDC (Figs 3-5). The patient was discharged home on postoperative day 4, doing well and tolerating a regular diet without any complications. On follow-up, she had complete resolution of her pain and nausea, and a return to regular bowel function and activity.", "nodes": [{"id": "PMC5137649_01_AS1", "label": "Stomach", "type": "AnatomicalSite", "attributes": "match=exact; distance=0"}, {"id": "PMC5137649_01_AS2", "label": "Tail", "type": "AnatomicalSite", "attributes": "match=exact; distance=0"}, {"id": "PMC5137649_01_AS3", "label": "Pancreas", "type": "AnatomicalSite", "attributes": "match=exact; distance=0"}, {"id": "PMC5137649_01_AS4", "label": "Peritoneal Cavity", "type": "AnatomicalSite", "attributes": "match=exact; distance=0"}, {"id": "PMC5137649_01_E1", "label": "Physical Examination", "type": "Exam", "attributes": "match=exact; distance=0"}, {"id": "PMC5137649_01_E2", "label": "Tomography", "type": "Exam", "attributes": "match=exact; distance=0"}, {"id": "PMC5137649_01_E3", "label": "Carcinoembryonic Antigen", "type": "Exam", "attributes": "match=exact; distance=0"}, {"id": "PMC5137649_01_E4", "label": "Endoscopy", "type": "Exam", "attributes": "match=exact; distance=0"}, {"id": "PMC5137649_01_E5", "label": "Endoscopy, Digestive System", "type": "Exam", "attributes": "match=fuzzy; distance=1"}, {"id": "PMC5137649_01_F1", "label": "the presence of an intact staple line on the posterior stom", "type": "Finding", "attributes": ""}, {"id": "PMC5137649_01_H1", "label": "Abdominal Pain", "type": "History", "attributes": "category=symptom"}, {"id": "PMC5137649_01_H2", "label": "Nausea", "type": "History", "attributes": "category=symptom"}, {"id": "PMC5137649_01_H3", "label": "Constipation", "type": "History", "attributes": "category=symptom"}, {"id": "PMC5137649_01_P1", "label": "case PMC5137649_01", "type": "Patient", "attributes": "age=44.0; gender=Female"}, {"id": "PMC5137649_01_R1", "label": "6 cm", "type": "ExamResult", "attributes": "value=6"}, {"id": "PMC5137649_01_R2", "label": "12,476.5 ng/ml", "type": "ExamResult", "attributes": "value=12,476.5"}, {"id": "PMC5137649_01_S1", "label": "Pain", "type": "Symptom", "attributes": "match=exact; distance=0"}, {"id": "PMC5137649_01_S2", "label":  "ent": true}, {"s": "PMC5137649_01_P1", "t": "PMC5137649_01_E5", "r1": ["UNDERWENT_EXAM"], "r2": ["UNDERWENT_EXAM"], "p": null, "ent": false}, {"s": "PMC5137649_01_E5", "t": "PMC5137649_01_AS1", "r1": ["PERFORMED_ON"], "r2": [], "p": null, "ent": true}, {"s": "PMC5137649_01_E5", "t": "PMC5137649_01_F1", "r1": ["REVEALS"], "r2": ["REVEALS"], "p": null, "ent": false}, {"s": "PMC5137649_01_F1", "t": "PMC5137649_01_AS1", "r1": ["LOCATED_IN"], "r2": ["LOCATED_IN"], "p": null, "ent": false}, {"s": "PMC5137649_01_P1", "t": "PMC5137649_01_S1", "r1": ["PRESENTS_WITH"], "r2": ["PRESENTS_WITH"], "p": null, "ent": false}, {"s": "PMC5137649_01_P1", "t": "PMC5137649_01_S2", "r1": ["PRESENTS_WITH"], "r2": ["PRESENTS_WITH"], "p": null, "ent": false}], "mentions": {"PMC5137649_01_E2|PMC5137649_01_AS1": [[2, 41, 51, 99, 106, "PERFORMED_ON", "NONE", 0.145]], "PMC5137649_01_E2|PMC5137649_01_AS2": [[2, 41, 51, 116, 120, "PERFORMED_ON", "NONE", 0.04]], "PMC5137649_01_E2|PMC5137649_01_AS3": [[2, 41, 51, 128, 136, "PERFORMED_ON", "NONE", 0.027]], "PMC5137649_01_E4|PMC5137649_01_AS1": [[9, 15, 24, 75, 82, "PERFORMED_ON", "NONE", 0.301]], "PMC5137649_01_E5|PMC5137649_01_AS1": [[13, 7, 34, 99, 106, "PERFORMED_ON", "NONE", 0.051]]}, "sentences": {"2": "She underwent contrast enhanced computed tomography, demonstrating a 6cm cystic lesion between the stomach and body/tail of the pancreas (Fig 1).", "9": "Intraoperative endoscopy was performed and no mucosal abnormalities of the stomach were noted.", "13": "Repeat oesophagogastroduodenoscopy revealed the presence of an intact staple line on the posterior stomach wall and no evidence of bleeding or leak."}}, "PMC5804616_01": {"patient": "age=77.0; gender=Male", "text": "Esophageal bypass surgery with gastric tube was planned for a 77-year-old man with esophagobronchial fistulae. He had undergone chemotherapy and radiotherapy for esophageal cancer with possible invasions to the descending aorta and left main bronchus at another hospital, resulting in the formation of fistulae. Since clip plication was unsuccessful and the fistulae remained, he was referred to our hospital for surgical treatment.\r\nThe patient had a past history of hypertension, diabetes mellitus, bladder cancer, and cerebral infarction. Preoperative arterial blood gas analysis showed a partial oxygen tension (PaO2) of 80.5 mmHg, partial carbon dioxide tension (PaCO2) of 38.8 mmHg, and pH of 7.44. Preoperative computed tomography showed two esophagobronchial fistulae, with diameters of 7 and 3 mm, located in the proximal part of the left main bronchus, and also demonstrated pleural effusion in the left thoracic cavity (Fig. 1). No bullae were evident in the lungs. \r\nAfter the patient entered the operating room, an epidural catheter was inserted at the eighth and ninth thoracic interspace. Because no endoscopic images were available, we confirmed the exact location of the esophagobronchial fistulae at the proximal part of the left main bronchus using bronchoscopy after intravenously administering 35 mg of pethidine. Tracheal intubation was performed nasally under bronchoscopic guidance using a long spiral tube with a short cuff (6.0 mm internal diameter, 400 mm length; Phycon, Tokyo, Japan) to a depth of 26 cm. The tip of the tracheal tube was confirmed to be above the carina on bronchoscopy. One-lung ventilation with this tube was planned as an emergency backup by advancing the tube into the right main bronchus in case spontaneous respiration ceased. We chose respiratory management with spontaneous respiration rather than one-lung ventilation in this case since we believed that further damage to the tissue around the fistulae should be avoided. Thus, we decided not to attempt to insert a double-lumen tube into the right main bronchus as a first-line therapy but only for backup plan. We assumed that the tissue around the fistulae may be very fragile after radiotherapy. We also had a jet ventilator and bronchoscope on hand in case hypoxemia developed during one-lung ventilation, so that high-frequency jet ventilation could be performed selectively to the distal part of the left main bronchus beyond the esophagobronchial fistulae. Cardiac surgeons were ready to apply a veno-venous extracorporeal membrane oxygenator in case of severe pulmonary insufficiency as one of the backup plans. After tracheal intubation, anesthesia was induced with 4% sevoflurane and maintained with 1.5-2% sevoflurane. Spontaneous respiration was maintained and was assisted with 3 cmH2O of pressure support. Tidal volume and respiratory rate were around 250-400 ml and 10-20 breaths per minute throughout surgery, respectively. Before the abdominal incision was made, 6 ml of 1% lidocaine was injected epidurally, followed by continuous infusion of 0.3% ropivacaine at a rate of 4-6 ml/h to obtain abdominal muscle relaxation. Arterial blood gas analysis showed a PaO2 of 252.4 mmHg, a PaCO2 of 36.9 mmHg, and a pH of 7.424 with an inspiratory fraction of oxygen (FiO2) of 0.6. With an FiO2 of 0.4, percutaneous arterial oxygen saturation (SpO2) was maintained above 98% during the former part of the surgical procedure.\r\nApproximately 60 min into the surgery, SpO2 suddenly dropped from 98 to 89% with an FiO2 of 0.4. We assumed that lung atelectasis associated with airway secretion or pulmonary soiling through the fistulae was the most likely reason for the impaired oxygenation. Bronchofiberscopic examination showed obstruction of the orifice of the left main bronchus with secretion. This secretion was suctioned, and FiO2 was increased to 0.6, and pressure support level was increased to 5 cmH2O. However, oxygenation only improved partially and arterial blood gas analysis showed a PaO2 of 101.7 mmHg with an FiO2 of 0.6. After the completion of surgery, chest X-ray revealed right pneumothorax (Fig. 2). After a chest drainage tube was inserted, right pneumothorax was ameliorated, and then SpO2 returned to the baseline (99%) with an FiO2 of 0.4. The patient was extubated uneventfully in the operating room. The postoperative course was mostly uneventful, except that 650 ml of pleural effusion in the left thoracic cavity was aspirated on postoperative day (POD) 1. The chest tube in the right thoracic cavity was withdrawn on POD 1, and the patient was discharged from hospital on POD 18. \r\nOur management plan, comprising combination of general and epidural anesthesia and maintenance of spontaneous respiration during the surgical procedure, according to our previous report, went relatively well except for the unexpected hypoxemia due to intraoperative pneumothorax. The collapse of the right lung may have been facilitated by the spontaneous respiration strategy resulting in impaired oxygenation. Since no bullae were evident on preoperative computed tomography, spontaneous pneumothorax was considered unlikely to have occurred. We believe that this represents the first case report to describe an adverse event associated with maintaining spontaneous respiration in a case of esophagobronchial fistulae.\r\nOptimal respiratory management may differ depending on the site and size of the fistulae between the digestive and respiratory tracts. For example, PPV may be possible with a tracheal fistula with sufficient distance between the fistula and carina, because a tube cuff can easily block the fistula. In a patient with a giant fistula at the carina, one-lung ventilation with a small tracheal tube, independent ventilation of each lung with two tracheal tubes, or high-frequency jet ventilation may be useful. A veno-venous extracorporeal membrane oxygenator can also be used to improve oxygenation in patients with a fistula between the respiratory and digestive tracts. In this case, we chose respiratory management with spontaneous respiration since we believed that tissues close to the esophagobronchial fistula should not be damaged. Thus, we decided not to attempt to insert a double-lumen tube into the right main bronchus as a first-line therapy but only for backup plan. We assumed that the tissue around the fistulae may be very fragile after radiotherapy. If the fistula had been located in the distal part of the left main bronchus, far from the carina, we may have chosen using a right-sided double-lumen tube.\r\nMaintaining spontaneous respiration is one of the methods of respiratory management chosen in patients with esophagobronchial fistulae during general anesthesia. In the present case, arterial oxygenation and gas exchange were well maintained during the first 60 min with spontaneous respiration. We assume that right pneumothorax occurred during the surgical procedure when SpO2 suddenly dropped from 98 to 89%. The collapse of the right lung may have been facilitated with the occurrence of pneumothorax due to spontaneous respiration, while the atelectasis may have been less severe if the lungs had been ventilated with PPV. One of the lessons we learned from this case was that while spontaneous respiration may be useful in a patient with esophagobronchial fistulae, patients may be at higher risk of impaired oxygenation in the event of injury to the parietal pleura during surgery.\r\nAlthough the exact mechanisms underlying the pneumothorax that occurred in this case during esophageal bypass surgery have not been proven, we assume that the parietal pleura was injured while surgical manipulations were being performed close to the thoracic cavity. Before the present case, our university hospital had treated 48 cases of esophageal bypass surgery and postoperative pneumothorax was encountered in only one case (2.1%) (personal communication with Dr. Nakajima, Department of Surgery of Tokyo Medical and Dental University). Taking the fact that pneumothorax can occur (albeit rarely) into account, spontaneous respiration may have needed to be converted to PPV as soon as feasible after closing both the proximal and distal stumps of the esophagus. Having another backup plan to convert spontaneous respiration to PPV on suspicion of pneumothorax may be important for patients undergoing non-thoracic surgery being performed close to the thoracic cavity. We assume that one-lung ventilation rather than spontaneous respiration should be chosen in hospitals with higher incidence of pneumothorax after esophageal bypass surgery.", "nodes": [{"id": "PMC5804616_01_AS1", "label": "Aorta", "type": "AnatomicalSite", "attributes": "match=exact; distance=0"}, {"id": "PMC5804616_01_AS10", "label": "Esophagus", "type": "AnatomicalSite", "attributes": "match=exact; distance=0"}, {"id": "PMC5804616_01_AS2", "label": "Thoracic Cavity", "type": "AnatomicalSite", "attributes": "match=exact; distance=0"}, {"id": "PMC5804616_01_AS3", "label": "Trachea", "type": "AnatomicalSite", "attributes": "match=fuzzy; distance=1"}, {"id": "PMC5804616_01_AS4", "label": "Tissues", "type": "AnatomicalSite", "attributes": "match=fuzzy; distance=1"}, {"id": "PMC5804616_01_AS5", "label": "Hand", "type": "AnatomicalSite", "attributes": "match=exact; distance=0"}, {"id": "PMC5804616_01_AS6", "label": "Membranes", "type": "AnatomicalSite", "attributes": "match=fuzzy; distance=1"}, {"id": "PMC5804616_01_AS7", "label": "Muscles", "type": "AnatomicalSite", "attributes": "match=fuzzy; distance=1"}, {"id": "PMC5804616_01_AS8", "label": "Lung", "type": "AnatomicalSite", "attributes": "match=exact; distance=0"}, {"id": "PMC5804616_01_AS9", "label": "Pleura", "type": "AnatomicalSite", "attributes": "match=exact; distance=0"}, {"id": "PMC5804616_01_D1", "label": "Neoplasms", "type": "Diagnosis", "attributes": "match=exact; distance=0"}, {"id": "PMC5804616_01_D2", "label": "Pleural Effusion", "type": "Diagnosis", "attributes": "match=exact; distance=0"}, {"id": "PMC5804616_01_D3", "label": "Pneumothorax", "type": "Diagnosis", "attributes": "match=exact; distance=0"}, {"id": "PMC5804616_01_E1", "label": "Blood Gas Analysis", "type": "Exam", "attributes": "match=exact; distance=0"}, {"id": "PMC5804616_01_  bronchus at another hospital, resulting in the formation of fistulae.", "5": "Preoperative computed tomography showed two esophagobronchial fistulae, with diameters of 7 and 3 mm, located in the proximal part of the left main bronchus, and also demonstrated pleural effusion in the left thoracic cavity (Fig. 1).", "8": "Because no endoscopic images were available, we confirmed the exact location of the esophagobronchial fistulae at the proximal part of the left main bronchus using bronchoscopy after intravenously administering 35 mg of pethidine.", "9": "Tracheal intubation was performed nasally under bronchoscopic guidance using a long spiral tube with a short cuff (6.0 mm internal diameter, 400 mm length; Phycon, Tokyo, Japan) to a depth of 26 cm.", "10": "The tip of the tracheal tube was confirmed to be above the carina on bronchoscopy.", "12": "We chose respiratory management with spontaneous respiration rather than one-lung ventilation in this case since we believed that further damage to the tissue around the fistulae should be avoided.", "14": "We assumed that the tissue around the fistulae may be very fragile after radiotherapy.", "15": "We also had a jet ventilator and bronchoscope on hand in case hypoxemia developed during one-lung ventilation, so that high-frequency jet ventilation could be performed selectively to the distal part of the left main bronchus beyond the esophagobronchial fistulae.", "17": "After tracheal intubation, anesthesia was induced with 4% sevoflurane and maintained with 1.5-2% sevoflurane.", "20": "Before the abdominal incision was made, 6 ml of 1% lidocaine was injected epidurally, followed by continuous infusion of 0.3% ropivacaine at a rate of 4-6 ml/h to obtain abdominal muscle relaxation.", "29": "After a chest drainage tube was inserted, right pneumothorax was ameliorated, and then SpO2 returned to the baseline (99%) with an FiO2 of 0.4.", "31": "The postoperative course was mostly uneventful, except that 650 ml of pleural effusion in the left thoracic cavity was aspirated on postoperative day (POD) 1.", "35": "Since no bullae were evident on preoperative computed tomography, spontaneous pneumothorax was considered unlikely to have occurred.", "39": "In a patient with a giant fistula at the carina, one-lung ventilation with a small tracheal tube, independent ventilation of each lung with two tracheal tubes, or high-frequency jet ventilation may be useful.", "43": "We assumed that the tissue around the fistulae may be very fragile after radiotherapy.", "48": "The collapse of the right lung may have been facilitated with the occurrence of pneumothorax due to spontaneous respiration, while the atelectasis may have been less severe if the lungs had been ventilated with PPV.", "50": "Although the exact mechanisms underlying the pneumothorax that occurred in this case during esophageal bypass surgery have not been proven, we assume that the parietal pleura was injured while surgical manipulations were being performed close to the thoracic cavity.", "53": "Taking the fact that pneumothorax can occur (albeit rarely) into account, spontaneous respiration may have needed to be converted to PPV as soon as feasible after closing both the proximal and distal stumps of the esophagus.", "54": "Having another backup plan to convert spontaneous respiration to PPV on suspicion of pneumothorax may be important for patients undergoing non-thoracic surgery being performed close to the thoracic cavity.", "55": "We assume that one-lung ventilation rather than spontaneous respiration should be chosen in hospitals with higher incidence of pneumothorax after esophageal bypass surgery."}}, "PMC5833205_01": {"patient": "age=0.0; gender=Male", "text": "A previously healthy 20-month-old boy presented for evaluation of progressive generalized swelling. His parents had first noticed a mild periorbital edema 2 weeks prior, and they reported that the swelling had progressed steadily over time, eventually resulting in worsening abdominal distension and bilateral lower extremity edema. Clinical history obtained in the office revealed that shortly after the edema was noted, the patient began passing up to 5 to 6 loose to watery, grossly nonbloody stools per day. Additional history revealed that the boy routinely drank more than 28 ounces of cow milk per day. Laboratory studies obtained at his pediatrician's office revealed an albumin of 1.8 g/dL, and a urinalysis that was negative for protein. The patient was referred for further evaluation.\r\nLaboratory studies obtained in the emergency department were consistent with a microcytic anemia (hemoglobin of 6.4 mg/dL with mean corpuscular volume of 69 fL), iron deficiency (ferritin of 4.9 ng/L), and hypoproteinemia (albumin of 1.6 g/dL, total protein of 3.0 g/dL). His fecal alpha-1-antitrypsin level was markedly elevated beyond the quantifiable upper limit of our testing (>1.13 mg/g), and his stool tested positive for occult blood. Workup included performance of upper endoscopy and colonoscopy, and these studies revealed grossly normal appearing mucosa lining the upper and lower gastrointestinal tract. Subsequent histologic examination revealed only a mild increase in the number of eosinophils in the gastric antrum and otherwise normal-appearing mucosa without the presence of acute or chronic inflammation in his esophagus, duodenum, colon, and rectum.\r\nThe patient received 1 transfusion (20 mL/kg) of packed red blood cells and was treated with oral iron replacement at a dose of 6 mg/kg of elemental iron/day. Cow milk was empirically eliminated from his diet, and he was instead placed on an amino acid-based formula as an intervention to address the possibility of an unusually late presentation of cow milk protein intolerance. He responded favorably to this combination of therapy. He has had no subsequent episodes of edema and his diarrhea resolved.\r\nHis albumin normalized within 1 week and his edema resolved completely. After 3 months of oral iron therapy, his hemoglobin had risen to 11.8 g/dL and his ferritin was 29.4 ng/L.", "nodes": [{"id": "PMC5833205_01_AS1", "label": "Lower Extremity", "type": "AnatomicalSite", "attributes": "match=exact; distance=0"}, {"id": "PMC5833205_01_AS2", "label": "Milk", "type": "AnatomicalSite", "attributes": "match=exact; distance=0"}, {"id": "PMC5833205_01_AS3", "label": "Lower Gastrointestinal Tract", "type": "AnatomicalSite", "attributes": "match=exact; distance=0"}, {"id": "PMC5833205_01_AS4", "label": "Eosinophils", "type": "AnatomicalSite", "attributes": "match=exact; distance=0"}, {"id": "PMC5833205_01_AS5", "label": "Esophagus", "type": "AnatomicalSite", "attributes": "match=exact; distance=0"}, {"id": "PMC5833205_01_AS6", "label": "Duodenum", "type": "AnatomicalSite", "attributes": "match=exact; distance=0"}, {"id": "PMC5833205_01_AS7", "label": "Colon", "type": "AnatomicalSite", "attributes": "match=exact; distance=0"}, {"id": "PMC5833205_01_AS8", "label": "Rectum", "type": "AnatomicalSite", "attributes": "match=exact; distance=0"}, {"id": "PMC5833205_01_AS9", "label": "Blood Cells", "type": "AnatomicalSite", "attributes": "match=exact; distance=0"}, {"id": "PMC5833205_01_D1", "label": "Anemia", "type": "Diagnosis", "attributes": "match=exact; distance=0"}, {"id": "PMC5833205_01_D2", "label": "Hypoproteinemia", "type": "Diagnosis", "attributes": "match=exact; distance=0"}, {"id": "PMC5833205_01_E1", "label": "Urinalysis", "type": "Exam", "attributes": "match=exact; distance=0"}, {"id": "PMC5833205_01_E2", "label": "Erythrocyte Indices", "type": "Exam", "attributes": "match=exact; distance=0"}, {"id": "PMC5833205_01_E3", "label": "Occult Blood", "type": "Exam", "attributes": "match=exact; distance=0"}, {"id": "PMC5833205_01_E4", "label": "Endoscopy", "type": "Exam", "attributes": "match=exact; distance=0"}, {"id": "PMC5833205_01_E5", "label": "Colonoscopy", "type": "Exam", "attributes": "match=exact; distance=0"}, {"id": "PMC5833205_01_F1", "label": "pro usceptible of surgical correction.", "1": "After 3 weeks, she underwent elective replacement of ascending aorta with 30 mm Hemashield platinum prosthesis and anastomosis of the left internal mammary artery to the descending anterior coronary artery that had a tight stenosis.", "5": "Consequently, the mass visible during echocardiography was referred to a pseudomass due to the tortuous and \"C-shaped\" descending thoracic aorta, which had, at this level, an horizontal trait [Figures 2 and 3]."}}, "PMC6083636_01": {"patient": "age=9.0; gender=Male", "text": "This report complies with all local laws and institutional review boards and with the principles of the Declaration of Helsinki. Informed written consent was obtained from parents. The patient was a healthy Caucasian male, aged 9 years. There was no history of amblyopia, strabismus or other eye disorders in the family and there was no parental consanguinity. As shown in Figure 1, external physical examination did not reveal obvious signs of cutaneous or ocular albinism. Parents reported that glasses were first prescribed at age 4 due to \"poor vision\". Cycloplegic refraction (Cicloplegicedol 10 mg/ml) in the right eye (RE) was plano/-2.50 x 10  and in the left eye (LE) plano/-3.50 x 180 .", "nodes": [{"id": "PMC6083636_01_AS1", "label": "Eye", "type": "AnatomicalSite", "attributes": "match=exact; distance=0"}, {"id": "PMC6083636_01_D1", "label": "Albinism", "type": "Diagnosis", "attributes": "match=exact; distance=0"}, {"id": "PMC6083636_01_E1", "label": "Physical Examination", "type": "Exam", "attributes": "match=exact; distance=0"}, {"id": "PMC6083636_01_H1", "label": "Amblyopia", "type": "History", "attributes": "category=symptom"}, {"id": "PMC6083636_01_H2", "label": "Strabismus", "type": "History", "attributes": "category=diagnosis"}, {"id": "PMC6083636_01_P1", "label": "case PMC6083636_01", "type": "Patient", "attributes": "age=9.0; gender=Male"}], "edges": [{"s": "PMC6083636_01_P1", "t": "PMC6083636_01_H1", "r1": ["HAS_HISTORY"], "r2": ["HAS_HISTORY"], "p": null, "ent": false}, {"s": "PMC6083636_01_P1", "t": "PMC6083636_01_H2", "r1": ["HAS_HISTORY"], "r2": ["HAS_HISTORY"], "p": null, "ent": false}, {"s": "PMC6083636_01_P1", "t": "PMC6083636_01_D1", "r1": ["DIAGNOSED_WITH"], "r2": ["DIAGNOSED_WITH"], "p": null, "ent": false}, {"s": "PMC6083636_01_P1", "t": "PMC6083636_01_E1", "r1": ["UNDERWENT_EXAM"], "r2": ["UNDERWENT_EXAM"], "p": null, "ent": false}, {"s": "PMC6083636_01_E1", "t": "PMC6083636_01_D1", "r1": [], "r2": ["EXCLUDES"], "p": 0.973, "ent": true}], "mentions": {"PMC6083636_01_E1|PMC6083636_01_D1": [[4, 31, 51, 104, 112, "NONE", "EXCLUDES", 0.973]]}, "sentences": {"4": "As shown in Figure 1, external physical examination did not reveal obvious signs of cutaneous or ocular albinism."}}, "PMC6083636_02": {"patient": "age=nan; gender=Unknown", "text": "Slit-lamp examination of the anterior segment was unremarkable, but the fundus examination revealed a blunt foveal reflex. OCT images shown in Figure 2 (patient's images labeled as \"case\"), obtained with a Topcon 3D OCT-2000, confirmed the absence of the foveal pit at the expected location of the anatomical fovea. There was no lateral displacement of the inner retinal layers, particularly of the inner nuclear (INL) and ganglion cell (GCL) layers, which appeared as a continuous band crossing the anatomical fovea. Of interest, there was a variation of thickness of the GCL and the ONL with a gradual increase in thickness from nasal-to-temporal macula and greatest thickness near the location of the anatomical fovea. Our patient showed a significantly thicker macula when compared with an age and gender matched control (Figure 2). In the central ring the retinal thickness of our case was 270 mum and 272 mum for the right and left eye, respectively. The thickness of the control was 227 mum in the right eye and 239 mum in the left. Of note, the overall thickness of the retina in all other rings and sectors seems to be reduced when compared with the control. Biometry, performed with a Sonomed PacScan 300A biometer, revealed and axial length in our case of 23.5 mm in both eyes.\r\nFundus photographs, taken with a Topcon TRC 50DX fundus camera, are shown in Figure 3. The patient's images (Figure 3, top panel) show a poorly defined foveal zone in the left eye as well as vascular branches crossing the location of the anatomic fovea. Only one retina of the case is shown to allow the addition of the control retina (bottom panel of the figure) for comparison nonetheless both eyes of our case have similar morphological properties in images obtained from fundus camera. Four multiple raster cuts through the anatomical position of the foveal centre clearly show evidence of fovea plana (Figure 4).", "nodes": [{"id": "PMC6083636_02_AS1", "label": "Eye", "type": "AnatomicalSite", "attributes": "match=exact; distance=0"}, {"id": "PMC6083636_02_AS2", "label": "Retina", "type": "AnatomicalSite", "attributes": "match=exact; distance=0"}, {"id": "PMC6083636_02_E1", "label": "Reflex", "type": "Exam", "attributes": "match=exact; distance=0"}, {"id": "PMC6083636_02_E2", "label": "Photography", "type": "Exam", "attributes": "match=fuzzy; distance=1"}, {"id": "PMC6083636_02_F1", "label": "terior segment was unremarkable, but the fundus examination", "type": "Finding", "attributes": ""}, {"id": "PMC6083636_02_P1", "label": "case PMC6083636_02", "type": "Patient", "attributes": "age=nan; gender=Unknown"}], "edges": [{"s": "PMC6083636_02_P1", "t": "PMC6083636_02_E1", "r1": ["UNDERWENT_EXAM"], "r2": ["UNDERWENT_EXAM"], "p": null, "ent": false}, {"s": "PMC6083636_02_E1", "t": "PMC6083636_02_F1", "r1": ["REVEALS"], "r2": ["REVEALS"], "p": null, "ent": false}, {"s": "PMC6083636_02_P1", "t": "PMC6083636_02_E2", "r1": ["UNDERWENT_EXAM"], "r2": ["UNDERWENT_EXAM"], "p": null, "ent": false}], "mentions": {}, "sentences": {}}, "PMC6083636_03": {"patient": "age=nan; gender=Unknown", "text": "Best corrected visual acuity was 0.50 logMAR in the RE and 0.40 logMAR in the LE. Colour vision was assessed with Ishihara isochromatic plates and with the Farnsworth Munsell 100-Hue tests. The patient identified correctly 14 out of 15 Ishihara plates with the RE and 15 out of 15 with the LE. The Farnsworth Munsell 100-Hue showed a total error score of 127 for the RE and 106 for the LE, classified as \"probably normal\" colour discrimination for both eyes, although these error scores are expected in less than 20% of the population. Cover-test at near showed an intermittent exotropia that is shown in Figure 1; horizontal nystagmus was manifest only at extreme positions of gaze, likely representing end-gaze physiologic saccades. A good evidence that nystagmus was not present in primary position of gaze is the quality of the OCT and fundus images acquired.", "nodes": [{"id": "PMC6083636_03_D1", "label": "Exotropia", "type": "Diagnosis", "attributes": "match=exact; distance=0"}, {"id": "PMC6083636_03_D2", "label": "Nystagmus, Pathologic", "type": "Diagnosis", "attributes": "match=exact; distance=0"}, {"id": "PMC6083636_03_E1", "label": "Visual Acuity", "type": "Exam", "attributes": "match=exact; distance=0"}, {"id": "PMC6083636_03_P1", "label": "case PMC6083636_03", "type": "Patient", "attributes": "age=nan; gender=Unknown"}], "edges": [{"s": "PMC6083636_03_P1", "t": "PMC6083636_03_E1", "r1": ["UNDERWENT_EXAM"], "r2": ["UNDERWENT_EXAM"], "p": null, "ent": false}, {"s": "PMC6083636_03_P1", "t": "PMC6083636_03_D1", "r1": ["DIAGNOSED_WITH"], "r2": ["DIAGNOSED_WITH"], "p": null, "ent": false}, {"s": "PMC6083636_03_P1", "t": "PMC6083636_03_D2", "r1": ["DIAGNOSED_WITH"], "r2": ["DIAGNOSED_WITH"], "p": null, "ent": false}], "mentions": {}, "sentences": {}}, "PMC6134951_01": {"patient": "age=49.0; gender=Female", "text": "A 49-year-old Hispanic never-smoking female, with a history of asthma and resected atrial myxoma, was found to have a left upper lobe perihilar lung nodule, mediastinal lymphadenopathy, and a large left pleural effusion. Cytology of the pleural effusion was consistent with TTF1-positive pulmonary adenocarcinoma. Further testing revealed EGFR wild type, no ALK rearrangement (by fluorescence in situ hybridization), and no ROS1 fusion. The PD-L1 TPS score was 40%. She was treated initially with four cycles of carboplatin and pemetrexed and subsequently eight cycles of pembrolizumab with the progression of disease. At the same time, EML4-ALK fusion was identified by NGS-based circulating tumor DNA analysis (FoundationACT). It is unclear why the ALK rearrangement was not detected by the FISH test at initial diagnosis. The quality, quantity, and process of tumor specimen may affect the FISH test and occasionally lead to false-negative results. In our case, the initial pleural effusion specimen might not be suitable for the FISH test.\r\nThe patient started on alectinib 600 mg twice a day and had a rapid improvement of her left-sided chest pain. However, 10 days later, she developed a non-pruritic morbilliform rash spreading from trunk to the entire body, including palms, soles, and face with mild lip and eye swelling (Figure 1A). She had recurrent fevers with a maximum temperature of 105 degrees F and was hospitalized. A right arm lesion was punch biopsied, showing spongiotic and interface dermatitis with eosinophils, consistent with drug eruption (delayed type IV hypersensitivity, Figure 1B). She had no hematologic (eosinophilia), hepatic, renal, or pulmonary abnormality to suggest drug reaction with eosinophilia and systemic symptoms. Infectious disease workup was negative for streptococcal pharyngitis, HIV, parvovirus, herpes, syphilis, strongyloidiasis, and bacteremia. Alectinib was the only medication she was taking and was therefore withheld. Oral prednisone was started at 30 mg on day 1 and was tapered to 20 mg on the next day. She then continued at 10 mg daily for the next 5 days with a total course of 7 days. She also received one dose of diphenhydramine 50 mg intravenously prior to oral prednisone and topical triamcinolone cream. No antibiotics were administered. The rash improved rapidly, and the patient's febrile episodes resolved following 1 day of prednisone administration. Desensitization was not instituted because of the perceived potentially serious nature of this delayed hypersensitivity reaction, in light of the presence of eosinophils in the skin biopsy, and high fevers. She was started with brigatinib 1 week after completion of prednisone taper. She tolerated the oral inhibitor well without rash and fever. Eight weeks later, rescanning showed markedly improved pleural effusion and tumor response (Figure 1C).", "nodes": [{"id": "PMC6134951_01_AS1", "label": "Lung", "type": "AnatomicalSite", "attributes": "match=exact; distance=0"}, {"id": "PMC6134951_01_AS2", "label": "Face", "type": "AnatomicalSite", "attributes": "match=exact; distance=0"}, {"id": "PMC6134951_01_AS3", "label": "Lip", "type": "AnatomicalSite", "attributes": "match=exact; distance=0"}, {"id": "PMC6134951_01_AS4", "label": "Eye", "type": "AnatomicalSite", "attributes": "match=exact; distance=0"}, {"id": "PMC6134951_01_AS5", "label": "Arm", "type": "AnatomicalSite", "attributes": "match=exact; distance=0"}, {"id": "PMC6134951_01_AS6", "label": "Eosinophils", "type": "AnatomicalSite", "attributes": "match=exact; distance=0"}, {"id": "PMC6134951_01_AS7", "label": "Skin", "type": "AnatomicalSite", "attributes": "match=exact; distance=0"}, {"id": "PMC6134951_01_D1", "label": "Lymphadenopathy", "type": "Diagnosis", "attributes": "match=exact; distance=0"}, {"id": "PMC6134951_01_D2", "label": "Pleural Effusion", "type": "Diagnosis", "attributes": "match=exact; distance=0"}, {"id": "PMC6134951_01_D3", "label": "Adenocarcinoma", "type": "Diagnosis", "attributes": "match=exact; distance=0"}, {"id": "PMC6134951_01_D4", "label": "Dermatitis", "type": "Diagnosis", "attributes": "match=exact; distance=0"}, {"id": "PMC6134951_01_D5", "label": 51_01_AS5": [[12, 148, 164, 8, 11, "LOCATED_IN", "LOCATED_IN", 0.602]], "PMC6134951_01_D4|PMC6134951_01_AS6": [[12, 72, 82, 88, 99, "LOCATED_IN", "LOCATED_IN", 0.996]], "PMC6134951_01_D5|PMC6134951_01_AS6": [[12, 148, 164, 88, 99, "LOCATED_IN", "LOCATED_IN", 0.904], [21, 103, 119, 158, 169, "LOCATED_IN", "LOCATED_IN", 0.547]], "PMC6134951_01_S1|PMC6134951_01_D7": [[14, 11, 18, 57, 68, "SUPPORTS", "SUPPORTS", 0.876]], "PMC6134951_01_S3|PMC6134951_01_D7": [[14, 127, 137, 57, 68, "SUPPORTS", "NONE", 0.134]], "PMC6134951_01_S1|PMC6134951_01_D8": [[14, 11, 18, 95, 103, "SUPPORTS", "NONE", 0.363]], "PMC6134951_01_S3|PMC6134951_01_D8": [[14, 127, 137, 95, 103, "SUPPORTS", "NONE", 0.216]], "PMC6134951_01_S1|PMC6134951_01_D9": [[14, 11, 18, 105, 121, "SUPPORTS", "NONE", 0.264]], "PMC6134951_01_S3|PMC6134951_01_D9": [[14, 127, 137, 105, 121, "SUPPORTS", "SUPPORTS", 0.679]], "PMC6134951_01_D5|PMC6134951_01_AS7": [[21, 103, 119, 177, 181, "LOCATED_IN", "LOCATED_IN", 0.593]], "PMC6134951_01_E3|PMC6134951_01_AS6": [[21, 182, 188, 158, 169, "PERFORMED_ON", "NONE", 0.072]], "PMC6134951_01_E3|PMC6134951_01_AS7": [[21, 182, 188, 177, 181, "PERFORMED_ON", "PERFORMED_ON", 0.992]]}, "sentences": {"0": "A 49-year-old Hispanic never-smoking female, with a history of asthma and resected atrial myxoma, was found to have a left upper lobe perihilar lung nodule, mediastinal lymphadenopathy, and a large left pleural effusion.", "12": "A right arm lesion was punch biopsied, showing spongiotic and interface dermatitis with eosinophils, consistent with drug eruption (delayed type IV hypersensitivity, Figure 1B).", "14": "Infectious disease workup was negative for streptococcal pharyngitis, HIV, parvovirus, herpes, syphilis, strongyloidiasis, and bacteremia.", "21": "Desensitization was not instituted because of the perceived potentially serious nature of this delayed hypersensitivity reaction, in light of the presence of eosinophils in the skin biopsy, and high fevers."}}, "PMC6343374_01": {"patient": "age=0.0; gender=Male", "text": "A 6-day-old twin male infant weighing 2760 g was born in our institution at gestational age 38 weeks. Echocardiography allowed the diagnosis of TAC 4A, with interrupted aortic arch (IAA) and trivial truncal valve regurgitation. The truncal valve appeared to be more than 75% committed to the right ventricular side of the ventricular septal defect (VSD). It was IAA Type B [Figure 1].\r\nSurgical correction was performed on day 6 through a median sternotomy. Myocardial protection was achieved with antegrade cold blood cardioplegia at a core temperature of 28 C.\r\nRight ventriculotomy was carried out, and VSD was closed with Dacron patch to reroute blood flow from left ventricle to truncal valve. Both right and left PAs separately originated from the posterior side of the main PA and were excised en bloc, and this area was patched with homograft. The ductal tissue was carefully removed, and the subclavian artery and the descending aorta were sewn to the homograft augmented main PA trunk rather than the relatively small ascending aorta to avoid potential bronchial obstruction. Twelve millimeters pulmonic homograft was used as RV-PA conduit. The postoperative course was uneventful. The postoperative echocardiography revealed no pressure gradient at the homograft site. Follow-up echo revealed progressive worsening of pressure gradient across the proximal right PA (peak PG 70 mmHg). He underwent self-expandable stent insertion at the proximal side of the right PA at 2 months after surgery, but this caused progressive narrowing of the left main bronchus. Therefore at 7 months of life, he underwent stent removal and PA repair under cardiopulmonary bypass. The patient's postoperative course was complicated with bronchomalacia, which required prolonged intubation. The patient was discharged from the hospital after 54-day hospital stay. Most recent follow-up echocardiography at 36 months of life showed almost no right PA stenosis, mild truncal valve regurgitation, and mild homograft regurgitation and excellent cardiac function.\r\nTAC with IAA is a very rare cardiac anomaly. The previous study about patients with TAC-IAA showed 12.5% early deaths among 16 patients after surgery. More recent report showed no mortality among 9 such patients.\r\nA number of issues need to be addressed during the repair of TAC-IAA such as aortic arch repair, right ventricular outflow tract reconstruction, and often truncal valve repair. Despite good early results, recurrent arch obstructions still develop in some patients during follow-up. The aortic arch reoperation rate in the congenital heart surgery study was 13.2% (5 of 38), with the arch in most of the patients being initially repaired by direct anastomosis. Another possible major complication from the direct end-to-side aortic arch anastomosis is bronchial compression. TAC-IAA has large main PA truncal segment. If the area, where the both pulmonary arteries were excised, were patched, then this main PA segment becomes a good conduit reaching to the descending aorta. Based on this idea, we used patch augmentation technique rather than direct anastomosis to the ascending aorta to avoid possible bronchial compression. This worked well; however, the patient developed proximal PA stenosis, which was away from the suturing line and required a balloon dilatation without success, followed by stenting. We believed that stent insertion might relief his symptom and self-expandable stent (5 mm x 20 mm) could be a possible better solution because it has high radial force and tends to take the shape of the vessel. It has also been reported to have lower incidence of edge tears, which is related to less thromboembolic events. Follow-up intravascular ultrasound analysis showed that the minimum stent area of the self-expandable stent increased by 33% at 6 months, whereas no change occurred in the balloon expandable stents, This was accompanied by a greater degree of intimal proliferation in the SE stents compared with BE stents. Strut malapposition can be another potential drawback, particularly if it happens in small vessels and small babies. In adult patient with acute ST-segment elevation myocardial infraction, strut malapposition at 3 days is significantly lower in SE stents than in BE stents. Based on these evidences, we chose SE stent in our patient. However, these benefits created a problem in this infant with bronchomalacia. We are not sure if it would not have occured with balloon expandable stent. He developed bronchial compression due to the stent with progressive worsening [Figure 2]. He eventually underwent surgical removal of the stent and PA repair. Postoperatively, we found this patient had bronchomalacia, which required prolonged mechanical ventilation. Bronchial stent might be a solution instead of surgery, but in a circumstance of proximal PA stenosis, surgical treatment would be the choice, particularly if we know the patient has bronchomalacia.\r\nBased on our experience, PA obstruction should be carefully evaluated. Stent insertion may have priority, particularly in a patient with proximal PA stenosis, but surgical repair may be the better choice in a young infant with congenital heart defect.\r\nThe authors certify that they have obtained all appropriate patient consent forms. In the form the patient(s) has/have given his/her/their consent for his/her/their images and other clinical information to be reported in the journal. The patients understand that their names and initials will not be published and due efforts will be made to conceal their identity, but anonymity cannot be guaranteed.\r\nNil.\r\nThere are no conflicts of interest.", "nodes": [{"id": "PMC6343374_01_AS1", "label": "Aorta, Thoracic", "type": "AnatomicalSite", "attributes": "match=exact; distance=0"}, {"id": "PMC6343374_01_AS2", "label": "Blood", "type": "AnatomicalSite", "attributes": "match=exact; distance=0"}, {"id": "PMC6343374_01_AS3", "label": " es": {"1": "Echocardiography allowed the diagnosis of TAC 4A, with interrupted aortic arch (IAA) and trivial truncal valve regurgitation.", "6": "Right ventriculotomy was carried out, and VSD was closed with Dacron patch to reroute blood flow from left ventricle to truncal valve.", "15": "The patient's postoperative course was complicated with bronchomalacia, which required prolonged intubation."}}, "PMC6354154_01": {"patient": "age=30.0; gender=Female", "text": "A 30-year-old nulligravida presented herself in our institution because of the inability to conceive for four years. She was healthy, with no history of previous surgeries. Menarche had occurred at age 14. She had used oral contraceptives for nine years, having stopped taking them four years ago, followed by regular menses. No one in her family had history of infertility or any type of gynecologic cancer.\r\nGeneral examination and body mass index were normal. Analytically she had normal blood count and hormonal assay [FSH, LH, TSH, free T4, testosterone, and dehydroepiandrosterone (DHEA)]. A transvaginal ultrasonography was performed revealing a normed uterus and ovaries slightly enlarged and polycystic with a small echogenic mass in the right ovary of 15 millimeters. The hysterosalpingography was normal.\r\nHer husband was healthy and had no relevant past medical history and his semen analysis was normal.\r\nShe was proposed for a diagnostic laparoscopy and ovarian drilling. In the surgery, both ovaries were polycystic and a yellowish nodular solid and hardened formation of about two centimeters, vascular and friable to touch, was observed in the right ovary. That mass was removed, without rupture, and removed in an endoscopic bag. Tubal patency test confirmed bilateral permeability.\r\nThe removed mass was sent to histological examination. Macroscopically, it was a yellow-colored tumor measuring two centimeters in greatest diameter, with a smooth and well-limited surface. Microscopically, the ovarian parenchyma was almost entirely occupied by a tumor lesion, represented by large polyhedral cells with small nuclei and vacuolated eosinophilic cytoplasm, without mitosis and nuclear atypia. Hemorrhage and necrotic areas were absent (Figure 1). Immunohistochemical study revealed diffuse marking for calretinin, vimentin, and melan-A (Figure 2). These features were consistent with ovarian steroid cell tumor NOS.\r\nIn the postoperative period, the woman is followed up with serial measurements of serum testosterone levels and transvaginal ultrasound. At 24 months, she had no evidence of recurrence and began follow-up in reproductive medicine consultation. She was proposed to in vitro fertilization treatment, but despite gonadotropin therapy (in high doses, 300U) for ovarian stimulation, she had no response. At 36 months postoperatively, she is still not pregnant and no evidence of recurrence too.", "nodes": [{"id": "PMC6354154_01_AS1", "label": "Blood", "type": "AnatomicalSite", "attributes": "match=exact; distance=0"}, {"id": "PMC6354154_01_AS2", "label": "Uterus", "type": "AnatomicalSite", "attributes": "match=exact; distance=0"}, {"id": "PMC6354154_01_AS3", "label": "Ovary", "type": "AnatomicalSite", "attributes": "match=exact; distance=0"}, {"id": "PMC6354154_01_AS4", "label": "Cells", "type": "AnatomicalSite", "attributes": "match=exact; distance=0"}, {"id": "PMC6354154_01_AS5", "label": "Cytoplasm", "type": "AnatomicalSite", "attributes": "match=exact; distance=0"}, {"id": "PMC6354154_01_AS6", "label": "Serum", "type": "AnatomicalSite", "attributes": "match=exact; distance=0"}, {"id": "PMC6354154_01_D1", "label": "Rupture", "type": "Diagnosis", "attributes": "match=exact; distance=0"}, {"id": "PMC6354154_01_E1", "label": "Body Mass Index", "type": "Exam", "attributes": "match=exact; distance=0"}, {"id": "PMC6354154_01_E2", "label": "Ultrasonography", "type": "Exam", "attributes": "match=exact; distance=0"}, {"id": "PMC6354154_01_E3", "label": "Hysterosalpingography",  "TARGETS", "NONE", 0.198]], "PMC6354154_01_T2|PMC6354154_01_AS1": [[6, 101, 123, 28, 33, "TARGETS", "NONE", 0.037]], "PMC6354154_01_E2|PMC6354154_01_AS2": [[7, 15, 30, 64, 70, "PERFORMED_ON", "PERFORMED_ON", 0.556]], "PMC6354154_01_E2|PMC6354154_01_AS3": [[7, 15, 30, 157, 162, "PERFORMED_ON", "NONE", 0.054]], "PMC6354154_01_T1|PMC6354154_01_AS6": [[20, 88, 100, 82, 87, "TARGETS", "TARGETS", 0.994]]}, "sentences": {"6": "Analytically she had normal blood count and hormonal assay [FSH, LH, TSH, free T4, testosterone, and dehydroepiandrosterone (DHEA)].", "7": "A transvaginal ultrasonography was performed revealing a normed uterus and ovaries slightly enlarged and polycystic with a small echogenic mass in the right ovary of 15 millimeters.", "20": "In the postoperative period, the woman is followed up with serial measurements of serum testosterone levels and transvaginal ultrasound."}}, "PMC6949661_01": {"patient": "age=23.0; gender=Male", "text": "A 23-year-old male was brought to the emergency of Hamad General Hospital in Doha, after being found on the floor dizzy and confused, with urinary incontinence although no one witnessed convulsions. The patient denied any fever, headache, chest pain, shortness of breath and palpitations, or cardiac diseases.\r\nOn examination, his pulse was 75 beats per minute, blood pressure 125/78, JVP was not raised, S1 and S2 were normal, and no added sounds on the chest examination. The patient was thought to have had a syncopal attack. His complete blood count and biochemical test were within the normal range. Computed tomography (CT) scan of the head was unremarkable and ECG showed left ventricular hypertrophy and early repolarization. Echocardiography, apart from moderate septal hypertrophy, was otherwise unremarkable.\r\nFurther history revealed that the patient had an episode of a large amount of melena before the syncopal attack, associated with nausea and two episodes of vomiting, but denied history of alcohol consumption, analgesic intake, and history of liver disease. In the course of time, the patient developed tachycardia of 122 bpm but blood pressure remained normal. His abdomen was soft, lax, nontender, and not distended. No masses were appreciated and bowel sounds were normal. Digital Rectal Examination (DRE) showed melanotic stool. Laboratory results showed a drop in hemoglobin from 13.2 to 8.4 and a high urea of 7.4. He was kept on intravenous fluids and proton pump inhibitors and transfused 2 units of packed red blood cells, and his hemoglobin level was monitored.\r\nEsophagogastroduodenoscopy (EGD) showed normal examination up to the third part of the duodenum with no active bleeding or altered blood. Colonoscopy was normal, whereas enteroscopy showed a jejunal diverticulum about 50 cms from the pylorus with fresh bleeding (Figure 1). Patient remained hemodynamically stable with no further drop in hemoglobin or another episode of melena. CT angiography was done in an attempt to identify a source of bleeding and for a trial of coil embolization, but it did not reveal vascular blush into the small bowel but an incidental finding of horseshoe kidney.\r\nThe patient underwent diagnostic laparoscopy that did not show any abnormality in the jejunal loops externally. Endoscopy was carried out to localize the jejunal lesion, but it was difficult to pass the scope beyond the duodenojejunal (DJ) junction. Midline laparotomy was performed to guide the enteroscope to the upper jejunum. A small lesion was seen on the serosal surface of the jejunum 30 cm from the DJ junction which endoscopically appeared as a suspicious diverticulum with whitish mucosal plaques. There was no active bleeding or clots. The enteroscope was then pushed further up to 130 cm in the bowel but no pathology was observed. Wedge resection of the suspicious jejunal lesion was carried out. The patient made smooth recovery from the surgery and did not develop further episodes of bleeding. He was last seen in the clinic after 2 years of surgery without any symptoms.\r\nHistology showed a small jejunal diverticulum with gastric heterotopic tissue. The specimen consists of a false diverticulum of the small bowel (jejunum) showing a focal, cystically dilated gland within the muscularis propria which, on deeper sections, showed gastric-type mucosal tissue. Focal crypt rupture was noted with mild reaction. The mucosa was unremarkable, and the specimen was negative for dysplasia and malignancy (Figures 2 and 3)", "nodes": [{"id": "PMC6949661_01_AS1", "label": "Blood", "type": "AnatomicalSite", "attributes": "match=exact; distance=0"}, {"id": "PMC6949661_01_AS2", "label": "Head", "type": "AnatomicalSite", "attributes": "match=exact; distance=0"}, {"id": "PMC6949661_01_AS3", "label": "Liver", "type": "AnatomicalSite", "attributes": "match=exact; distance=0"}, {"id": "PMC6949661_01_AS4", "label": "Abdomen", "type": "AnatomicalSite", "attributes": "match=exact; distance=0"}, {"id": "PMC6949661_01_AS5", "label": "Blood Cells", "type": "AnatomicalSite", "attributes": "match=exact; distance=0"}, {"id": "PMC6949661_01_AS6", "label": "Duodenum", "type": "AnatomicalSite", "attributes": "match=exact; distance=0"}, {"id": "PMC6949661_01_AS7", "label": "Pylorus", "type": "AnatomicalSite", "attributes": "match=exact; distance=0"}, {"id": "PMC6949661_01_AS8", "label": "Jejunum", "type": "AnatomicalSite", "attributes": "match=exact; distance=0"}, {"id": "PMC6949661_01_AS9", "label": "Tissues", "type": "AnatomicalSite", "attributes": "match=fuzzy; distance=1"}, {"id": "PMC6949661_01_D1", "label": "Fused Kidney", "type": "Diagnosis", "attributes": "match=exact; distance=0"}, {"id": "PMC6949661_01_D2", "label": "Rupture", "type": "Diagnosis", "attributes": "match=exact; distance=0"}, {"id": "PMC6949661_01_E1", "label": "Blood Pressure", "type": "Exam", "attributes": "match=exact; distance=0"}, {"id": "PMC6949661_01_E2", "label": "Tomography", "type": "Exam", "attributes": "match=exact; distance=0"}, {"id": "P _E2|PMC6949661_01_S7": [[5, 9, 19, 91, 102, "REVEALS", "REVEALS", 0.983]], "PMC6949661_01_T2|PMC6949661_01_AS5": [[13, 38, 60, 98, 109, "TARGETS", "NONE", 0.276]], "PMC6949661_01_E5|PMC6949661_01_AS6": [[14, 0, 26, 87, 95, "PERFORMED_ON", "NONE", 0.099]], "PMC6949661_01_E5|PMC6949661_01_AS1": [[14, 0, 26, 131, 136, "PERFORMED_ON", "NONE", 0.063]], "PMC6949661_01_E6|PMC6949661_01_AS7": [[15, 0, 11, 96, 103, "PERFORMED_ON", "NONE", 0.048]], "PMC6949661_01_E6|PMC6949661_01_S12": [[15, 0, 11, 61, 73, "REVEALS", "REVEALS", 0.995]], "PMC6949661_01_E3|PMC6949661_01_S7": [[6, 0, 16, 45, 56, "NONE", "REVEALS", 0.976]], "PMC6949661_01_E1|PMC6949661_01_S11": [[8, 72, 86, 45, 56, "NONE", "REVEALS", 0.533]]}, "sentences": {"5": "Computed tomography (CT) scan of the head was unremarkable and ECG showed left ventricular hypertrophy and early repolarization.", "6": "Echocardiography, apart from moderate septal hypertrophy, was otherwise unremarkable.", "8": "In the course of time, the patient developed tachycardia of 122 bpm but blood pressure remained normal.", "13": "He was kept on intravenous fluids and proton pump inhibitors and transfused 2 units of packed red blood cells, and his hemoglobin level was monitored.", "14": "Esophagogastroduodenoscopy (EGD) showed normal examination up to the third part of the duodenum with no active bleeding or altered blood.", "15": "Colonoscopy was normal, whereas enteroscopy showed a jejunal diverticulum about 50 cms from the pylorus with fresh bleeding (Figure 1)."}}, "PMC7086412_01": {"patient": "age=34.0; gender=Female", "text": "A 34-year-old gravida two, abortus one, para zero presented to the Labor and Delivery Unit at 40 weeks and three days estimated gestational age. She had been diagnosed earlier that day with an intrauterine fetal demise by the certified professional midwife who had been managing her pregnancy. The patient had not been seen by a physician nor a certified nurse midwife throughout the gestation. On review of her records, it was noted that the standard 50-gram one-hour glucose tolerance testing (GTT) had been deferred in favor of one day of monitoring of fasting and postprandial blood glucose levels at approximately 25 weeks gestational age. These values were not available for review but were reportedly normal per the patient. No testing of glycated hemoglobin (hemoglobin A1c) was performed while pregnant, and serial blood glucose monitoring was not repeated after 25 weeks gestational age.\r\nThe patient consented to our institution's standard panel of laboratory testing for patients diagnosed with intrauterine fetal demise. This testing includes a complete blood count, prothrombin time, partial thromboplastin time, fibrinogen level, hemoglobin A1c, thyroid stimulating hormone, urine drug screen, Kleihauer-Betke, rapid plasma reagin, parvovirus B19 antibodies, cytomegalovirus antibodies, lupus anticoagulant antibodies, beta-2 glycoprotein antibodies, anticardiolipin antibodies, factor V Leiden mutation, and prothrombin gene mutation G20210A.\r\nThe only abnormality from this set of laboratory results was a hemoglobin A1c value of 6.6%, diagnostic for diabetes based on criteria developed by the American Diabetes Association. No prepregnancy hemoglobin A1c or random glucose values were available for review.\r\nThe patient underwent an induction of labor with serial doses of misoprostol followed by Pitocin augmentation and artificial rupture of membranes. She met criteria for preeclampsia with severe features during her intrapartum course. She progressed to complete dilation and 0 station after approximately 36 hours. Pushing was initiated shortly thereafter, resulting in expeditious descent of the fetal head to +3 station. No further descent was appreciated over the next hour of pushing. Citing exhaustion, the patient requested assistance via an operative vaginal delivery. Forceps were applied and were successful in delivering the fetal head. The anterior shoulder did not deliver with gentle downward traction.\r\nA shoulder dystocia was identified. McRoberts maneuver with suprapubic pressure did not relieve the dystocia. The Rubin II and Wood's Screw maneuvers were similarly unsuccessful. The posterior arm was successfully delivered, but the shoulder remained impacted. McRoberts maneuver with suprapubic pressure was repeated, followed by the rotational maneuvers again without success.\r\nThese maneuvers were not repeated in the delivery room as the fetal head had partially avulsed from the body. The patient was transported to the operating theater due to the possibility of requiring a fragmented delivery. Uterine relaxation was achieved with 100 micrograms of intravenous nitroglycerin. This allowed the anterior shoulder to be disimpacted with Wood's Screw maneuver resulting in the delivery of an infant weighing 4190 grams (85th percentile for gestational age). The total length of the shoulder dystocia was 30 minutes.", "nodes": [{"id": "PMC7086412_01_AS1", "label": "Blood", "type": "AnatomicalSite", "attributes": "match=exact; distance=0"}, {"id": "PMC7086412_01_AS2", "label": "Urine", "type": "AnatomicalSite", "attributes": "match=exact; distance=0"}, {"id": "PMC7086412_01_AS3", "label": "Plasma", "type": "AnatomicalSite", "attributes": "match=exact; distance=0"}, {"id": "PMC7086412_01_AS4", "label": "Membranes", "type": "AnatomicalSite", "attributes": "match=exact; distance=0"}, {"id": "PMC7086412_01_AS5", "label": "Head", "type": "AnatomicalSite", "attributes": "match=exact; distance=0"}, {"id": "PMC7086412_01_AS6", "label": "Shoulder", "type": "AnatomicalSite", "attributes": "match=exact; distance=0"}, {"id": "PMC7086412_01_AS7", "label": "Wood", "type": "AnatomicalSite", "attributes": "match=exact; distance=0"}, {"id": "PMC7086412_01_AS8", "label": "Arm", "type": "AnatomicalSite", "attributes": "match=exact; distance=0"}, {"id": "PMC7086412_01_D1", "label": "Rupture", "type": "Diagnosis", "attributes": "match=exact; distance=0"}, {"id": "  "The patient underwent an induction of labor with serial doses of misoprostol followed by Pitocin augmentation and artificial rupture of membranes."}}, "PMC7086412_02": {"patient": "age=31.0; gender=Female", "text": "A 31-year-old gravida one, para zero, presented to the Labor and Delivery Unit at 37 weeks and one day estimated gestational age with a complaint of decreased fetal movement. She was found to have an intrauterine fetal demise.\r\nOn review of her records, it was noted that she had undergone a hemoglobin A1c measurement and 50-gram glucose tolerance test at her first obstetric appointment (nine weeks gestational age) per our institutional protocol due to her elevated prepregnancy body mass index of 34. Her hemoglobin A1c was nondiagnostic (5.0%), but her early GTT returned elevated at 160 mg/dL (Table 1). A follow-up three-hour 100-gram GTT was performed with fasting, one-hour, two-hour, and three-hour values of 86, 184, 147, and 135 mg/dL, respectively. No diagnosis of glucose intolerance was made due to having a single elevated value per the Carpenter Coustan criteria. She was advised to undergo a repeat three-hour GTT at 25 weeks gestational age, but deferred testing until 36 weeks gestational age. Her 36-week 100-gram GTT resulted with fasting, one-hour, two-hour, and three-hour values of 89, 216, 153, and 101 mg/dL, respectively. Again, no diagnosis of glucose intolerance was made due to having a single elevated value.\r\nThe patient consented to our institution's standard panel of laboratory testing for patients diagnosed with intrauterine fetal demise as previously described. The only abnormality from this set of laboratory results was a hemoglobin A1c value of 6.6%, diagnostic for diabetes based on criteria developed by the American Diabetes Association.\r\nThe patient underwent an induction of labor with serial doses of misoprostol followed by Pitocin augmentation and artificial rupture of membranes. She met criteria for preeclampsia with severe features during her intrapartum course. She progressed to complete dilation after approximately 24 hours. Pushing was initiated shortly thereafter, resulting in the delivery of the fetal head. However, the anterior shoulder did not deliver with gentle downward traction.\r\nA shoulder dystocia was identified. McRoberts maneuver with suprapubic pressure did not relieve the dystocia. The Rubin II and Wood's Screw maneuvers were similarly unsuccessful. The patient was rotated into the Gaskin position but the shoulder remained impacted. The patient was turned back into McRoberts position where suprapubic pressure was again unsuccessful. The rotational maneuvers were also repeated without success. Delivery of the posterior arm was attempted but could not be accomplished. A posterior axilla sling was placed using a pediatric feeding tube. These devices are available in the delivery rooms of our institution as an adjunct in the treatment of intractable shoulder dystocia. Traction on the sling was not successful in delivering the posterior shoulder. The sling was then used in a rotational manner to assist with a repeat attempt at Wood's Screw maneuver as described by Cluver and Hofmeyr. This was successful in relieving the shoulder dystocia resulting in the delivery of an infant weighing 3590 g (92nd percentile for gestational age). The total length of the shoulder dystocia was 30 minutes.", "nodes": [{"id": "PMC7086412_02_AS1", "label": "Membranes", "type": "AnatomicalSite", "attributes": "match=exact; distance=0"}, {"id": "PMC7086412_02_AS2", "label": "Head", "type": "AnatomicalSite", "attributes": "match=exact; distance=0"}, {"id": "PMC7086412_02_AS3", "label": "Shoulder", "type": "AnatomicalSite", "attributes": "match=exact; distance=0"}, {"id": "PMC7086412_02_AS4", "label": "Wood", "type": "AnatomicalSite", "attributes": "match=exact; distance=0"}, {"id": "PMC7086412_02_AS5", "label": "Back", "type": "AnatomicalSite", "attributes": "match=exact; distance=0"}, {"id": " valve one year prior presented with severe respiratory distress requiring emergent intubation. Initial electrocardiogram (EKG) revealed sinus rhythm with left anterior fascicular block, right bundle branch block, and evidence of left atrial enlargement. Initial troponin was normal at 0.04 ng/mL, but CK-MB and total CK were elevated to 21.2 ng/mL and 308 U/L, respectively. Anticoagulation studies revealed an INR of 1.0, a PTT of 28, and a PT of 10.9. Following transfer to the intensive care unit, the patient was started immediately on heparin infusion for suspicion of acute coronary syndrome (ACS); computed tomography angiogram (CTA) of the chest revealed moderate patchy ground-glass and nodular airspace opacities with interstitial edema and cardiomegaly. Transesophageal echocardiogram (TEE) was performed showing an acute thrombosis of the bioprosthetic mitral valve with severe mitral stenosis and regurgitation exhibiting a mean gradient of 20.1 mmHg and valve area of 0.68 cm2 (Figure 1). Of note, the patient had already completed 6 months of anticoagulation following his bioprosthetic mitral valve replacement and was no longer on anticoagulation. He was also found to have near complete leaflet immobility and subsequently underwent emergent redo mitral valve surgery utilizing a 33 mm St. Jude mechanical prosthesis. The valve was noted to have a massive amount of material on the ventricular side of each cusp (Figures 2 and 3) with pathology findings consistent with thrombosis. Following valve replacement, intraoperative TEE showed that the mitral valve mean gradient had improved to 4 mmHg. The procedure was well-tolerated, and the patient was successfully extubated and transitioned to warfarin for anticoagulation. Hypercoagulable workup was negative, and he was doing well on follow-up.", "nodes": [{"id": "PMC7102447_01_AS1", "label": "Mitral Valve", "type": "AnatomicalSite", "attributes": "match=exact; distance=0"}, {"id": "PMC7102447_01_D1", "label": "Hypertension", rted immediately on heparin infusion for suspicion of acute coronary syndrome (ACS); computed tomography angiogram (CTA) of the chest revealed moderate patchy ground-glass and nodular airspace opacities with interstitial edema and cardiomegaly.", "5": "Transesophageal echocardiogram (TEE) was performed showing an acute thrombosis of the bioprosthetic mitral valve with severe mitral stenosis and regurgitation exhibiting a mean gradient of 20.1 mmHg and valve area of 0.68 cm2 (Figure 1)."}}, "PMC7519975_01": {"patient": "age=33.0; gender=Female", "text": "A 33-year-old Hispanic, blind, and aphasic female with a history of diabetes mellitus on insulin at home, craniotomy for meningioma status post ventriculoperitoneal (VP) shunt placement, presented to the hospital with a one-day history of drowsiness and emesis. Computed tomography (CT) of the abdomen revealed several loops of small bowel in the right side of the abdomen with thickening immediately adjacent to the VP shunt concerning for inflammation of the bowel (Figure 1). CT head revealed areas of acute infarct seen involving the brain stem as well as the cerebellar hemispheres and moderate enlargement of the ventricular system with left-sided intraventricular hemorrhage (Figures 2 and 3). Due to the acute nature of her abdomen and the concern for a seeded VP shunt from this intra-abdominal infection, neurosurgery was consulted. The patient subsequently underwent externalization of her VP shunt at the neck. Concurrently, general surgery was consulted who decided to perform an explorative laparotomy for her acute abdomen. Preoperative records showed that her mean arterial blood pressure was ranging from 60 to 65 mmHg, heart rate was ranging from 70 to 82 normal sinus rhythm, the temperature was 98.4 F, and oxygen saturation was 96-98 on room air. Her preoperative electrocardiogram (ECG) showed normal sinus rhythm with no acute ST-T wave changes (Figure 4). Her preoperative laboratory values were as follows: white blood cell count 5300 per microliter of blood, hemoglobin 8.2 grams/deciliter, platelet 98000 per microliter of blood, prothrombin time 16.1 seconds, international normalized ratio 1.2, serum sodium 148 meq/liter, serum potassium 3.7 meq/liter, chloride 112 meq/liter, BUN 17 mg/deciliter, creatinine 0.4 mg/deciliter, serum glucose 125 mg/deciliter, serum calcium 8.2 mg/deciliter, magnesium 2.4 gm/deciliter, aspartate transaminase 32 units per liter, and alanine transaminase 43 units per liter. The patient was deemed to be at high risk for the major cardiac event after the surgery defined as death, myocardial infarction, or cardiac arrest within 30 days after noncardiac surgery. The Revised Cardiac Risk Index (RCRI) for preoperative risk was 3 points (class IV risk) based on the proposed intraperitoneal surgery, cerebrovascular disease, and preoperative treatment with insulin. Due to the emergent nature of the required surgery, an extensive discussion was done with the patient's next of kin who agreed to proceed with the surgery. The patient was well monitored intraoperatively in the standard manner under the direct supervision of the attending anesthesiologist. Intraoperatively, the patient suddenly started becoming bradycardic and went into asystole. Immediate cardiopulmonary resuscitative (CPR) efforts were initiated as per the standard advanced cardiovascular life support (ACLS) algorithm. High-quality chest compressions and epinephrine injection were administered every 3 minutes. Appropriate rhythm checks in between the chest compression were done. The patient already had an advanced airway in place for surgery. There were appropriate peripheral intravenous lines, triple lumen central venous catheter, and arterial line that was placed preoperatively for access and hemodynamic monitoring. The patient did not have a shockable rhythm throughout the cardiac arrest. After 30 minutes of CPR, the patient did not have any signs of the return of spontaneous circulation (ROSC). Thus, the patient was pronounced dead and all resuscitation efforts were ceased. The abdominal cavity was closed. The patient was disconnected from the ventilator with a plan to move to the mortuary. After 20 minutes of declaring the patient dead, spontaneous circulation and breathing were noted by the operating room (OR) staff. The patient's mean arterial blood pressure was noted to be 60 mmHg without any vasopressor agents and heart rate was 62 bpm, sinus rhythm with spontaneous respiration at a rate of 12 breaths per minute. She had an oxygen saturation of 88-90% on room air with a temperature of 98.2 Fahrenheit. Surgery was immediately resumed, and the patient underwent reexploration. The patient was found to have infarcted distal ileum and right colon secondary to scarred adhesion and inflammatory response involving VP shunt.\r\nSurgery was concluded, and the patient was transferred to the intensive care unit. Postoperatively, the patient was on 3 vasopressors. By postoperative day 2, the patient was off the vasopressor, and by postoperative day 3, the patient was extubated. On postoperative day 4, the patient was transferred to a regular room on the 2 L nasal cannula. Considering the patient's poor prognosis, the patient was provided comfort care and died on postoperative day 7.", "nodes": [{"id": "PMC7519975_01_AS1", "label": "Abdomen", "type": "AnatomicalSite", "attributes": "match=exact; distance=0"}, {"id": "PMC7519975_01_AS2", "label": "Head", "type": "AnatomicalSite", "attributes": "match=exact; distance=0"}, {"id": "PMC7519975_01_AS3", "label": "Brain Stem", "type": "AnatomicalSite", "attributes": "match=exact; distance=0"}, {"id": "PMC7519975_01_AS4", "label": "Neck", "type": "AnatomicalSite", "attributes": "match=exact; distance=0"}, {"id": "PMC7519975_01_AS5", "label": "Blood", "type": "AnatomicalSite", "attributes": "match=exact; distance=0"}, {"id": "PMC7519975_01_AS6", "label": "Serum", "type": "AnatomicalSite", "attributes": "match=exact; di
