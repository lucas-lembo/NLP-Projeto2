<!doctype html>
<html lang="pt-br">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Comparador de Grafos P1 × P2</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/cytoscape/3.28.1/cytoscape.min.js"></script>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; background: #f8fafc; color: #1e293b; }
  header { display: flex; align-items: center; gap: 8px 12px; padding: 10px 16px; background: white; border-bottom: 1px solid #e2e8f0; flex-wrap: wrap; }
  header h1 { font-size: 15px; margin: 0 8px 0 0; color: #475569; font-weight: 600; }
  select, button { padding: 6px 10px; border-radius: 6px; border: 1px solid #cbd5e1; font-size: 13px; background: white; cursor: pointer; color: #1e293b; }
  button:hover, select:hover { border-color: #94a3b8; }
  .group { display: flex; align-items: center; gap: 6px; font-size: 13px; color: #475569; }
  .group input[type=range] { width: 110px; }
  #thr-value { font-variant-numeric: tabular-nums; min-width: 2.6em; }
  #stats { color: #64748b; font-size: 12.5px; margin-left: auto; }
  .layout { display: flex; height: calc(100vh - 55px); }
  .panes { flex: 1; display: flex; min-width: 0; }
  .pane { flex: 1; position: relative; min-width: 0; }
  .pane + .pane { border-left: 1px solid #e2e8f0; }
  .pane .cy { position: absolute; inset: 0; }
  .caption { position: absolute; top: 8px; left: 10px; z-index: 2; font-size: 12px; font-weight: 600; color: #475569; background: rgba(248,250,252,.9); padding: 3px 8px; border-radius: 6px; border: 1px solid #e2e8f0; pointer-events: none; }
  #layout-host { position: absolute; left: -10000px; top: 0; width: 1000px; height: 800px; visibility: hidden; }
  #side { width: 360px; overflow-y: auto; padding: 14px; background: white; border-left: 1px solid #e2e8f0; font-size: 12.5px; line-height: 1.5; }
  #side h2 { font-size: 13px; margin: 18px 0 6px; color: #475569; }
  #side h2:first-child { margin-top: 0; }
  .hint { color: #94a3b8; }
  .muted { color: #64748b; }
  table { border-collapse: collapse; width: 100%; font-variant-numeric: tabular-nums; }
  th, td { padding: 3px 4px; text-align: right; border-bottom: 1px solid #f1f5f9; }
  th:first-child, td:first-child { text-align: left; }
  th { color: #64748b; font-weight: 600; font-size: 11.5px; }
  tr.total td { font-weight: 600; border-top: 1px solid #cbd5e1; }
  .legend-item { display: flex; align-items: center; gap: 6px; margin-bottom: 3px; }
  .swatch { width: 12px; height: 12px; border-radius: 3px; flex-shrink: 0; }
  .line { width: 26px; height: 0; border-top-width: 3px; flex-shrink: 0; }
  .legend-cols { display: grid; grid-template-columns: 1fr 1fr; gap: 0 10px; }
  .pair-title { font-weight: 600; margin-bottom: 6px; }
  .kv { display: grid; grid-template-columns: 34px 1fr; gap: 2px 8px; margin-bottom: 8px; }
  .kv b { color: #475569; }
  .mention { background: #f8fafc; border: 1px solid #e2e8f0; border-radius: 6px; padding: 6px 8px; margin-bottom: 6px; }
  .mention.chosen { border-color: #93c5fd; }
  .mention .tags { color: #64748b; font-size: 11.5px; margin-top: 3px; }
  mark { background: #fef08a; color: inherit; border-radius: 2px; padding: 0 1px; }
  .note { color: #64748b; font-style: italic; margin: 4px 0; }
  #case-text { white-space: pre-wrap; color: #334155; background: #f8fafc; padding: 8px; border-radius: 6px; max-height: 260px; overflow-y: auto; }
</style>
</head>
<body>
<header>
  <h1>Comparador de Grafos — Projeto 1 × Projeto 2</h1>
  <button id="prev-btn" title="Caso anterior">‹</button>
  <select id="case-select" aria-label="Caso"></select>
  <button id="next-btn" title="Próximo caso">›</button>
  <button id="random-btn">🎲 aleatório</button>
  <select id="mode-select" aria-label="Modo">
    <option value="side">Modo: Lado a lado</option>
    <option value="diff">Modo: Diferença</option>
    <option value="p1">Modo: Só P1</option>
    <option value="p2">Modo: Só P2</option>
  </select>
  <select id="layout-select" aria-label="Layout">
    <option value="concentric">Layout: Concêntrico (por tipo)</option>
    <option value="cose">Layout: Forças</option>
  </select>
  <label class="group"><input type="checkbox" id="ent-only" checked> Só relações entre entidades</label>
  <label class="group" id="thr-group">Prob. mín. P2 <input type="range" id="thr" min="0" max="1" step="0.05" value="0"> <span id="thr-value">0.00</span></label>
  <span id="stats"></span>
</header>
<div class="layout">
  <div class="panes">
    <div class="pane" id="pane-a"><div class="caption" id="caption-a"></div><div class="cy" id="cy-a"></div></div>
    <div class="pane" id="pane-b"><div class="caption" id="caption-b"></div><div class="cy" id="cy-b"></div></div>
  </div>
  <div id="side">
    <h2>Seleção</h2>
    <div id="details"><span class="hint">Clique numa aresta para ver as frases e a probabilidade, ou num nó para ver os atributos.</span></div>
    <h2>Comparação neste caso</h2>
    <div id="case-table"></div>
    <h2>Todos os casos</h2>
    <div id="global-table"></div>
    <h2>Legenda</h2>
    <div id="edge-legend"></div>
    <div id="legend" class="legend-cols" style="margin-top:8px"></div>
    <h2>Paciente</h2>
    <div id="patient-info" class="muted"></div>
    <h2>Texto do caso</h2>
    <div id="case-text"></div>
  </div>
</div>

ome (ACS) cannot be excluded, a loading dose of aspirin (300 mg) + clopidogrel (300 mg) was prescribed and coronary angiography (CAG) was suggested but was refused by the patient and her family members. The patient was then admitted to the cardiac care unit (CCU) for suspicion of ACS. Twelve minutes after hospitalization, her chest pain recurred, and monitoring ECG revealed ST-segment elevation in lead II and complete AV-B with HR at 41 beats/min accompanied by hypotension (BP at 96/51 mmHg) (Figures 2A,B). According to the characteristics of the patient's chest pain, ECG (near normal when chest pain was relieved), and biomarker (normal troponin I) obtained in ER, the diagnosis of CAS was highly suspected. With a possible diagnosis of CAS, 5 mg of diltiazem was administered intravenously with prompt relief of chest pain, and complete AV-B was converted back to sinus rhythm (HR at 59 beats/min) (Figure 2C). The patient was on 50 mg of diltiazem hydrochloride intravenously (at 5 mL/h) for maintenance. She received CAG the second day after a repeated suggestion by the physician, which revealed normal left main branch, 20%-30% stenosis at the opening and middle segment of the left anterior descending artery (LAD), 30% stenosis at the first diagonal branch (D1), 30% stenosis at the beginning of the circumflex branch (LCX), and 20% stenosis at the middle of the right coronary artery (RCA) (Figures 2D,E,F, Supplementary Videos S1-S3). Routine lab work during hospitalization revealed that white blood cell count, lipids, liver function, renal function, glycosylated hemoglobin, electrolytes, thyroid function, coagulation function, erythrocyte sedimentation rate, D-dimers, cytokines, and urinalysis were all within normal limits. Based on the patient's symptoms, ECG, and CA findings, a diagnosis of CAS was made. Repeated troponin (0.031 ng/mL) and ECG were normal (Figure 3). The patient was then prescribed diltiazem sustained-release capsules (90 mg, twice per day), an antiplat 47, 66, "SUPPORTS", "SUPPORTS", 0.84]], "PMC10106591_01_D4|PMC10106591_01_T3": [[23, 47, 66, 126, 141, "NONE", "TREATED_BY", 0.962]]}, "sentences": {"3": "Her medical history included hypertension for 7 years and noncompliance with antihypertensives (irbesartan, 150 mg/day).", "7": "Cardiac and pulmonary examination revealed normal heart sounds without murmur and clear lungs to auscultation.", "8": "The abdomen was soft and nontender to palpation, without rebound tenderness.", "10": "The electrocardiogram (ECG) performed at rest showed normal sinus rhythm with no significant ST-T changes (Figure 1A); echocardiography completed in the ER showed a mildly thickened ventricular septum and left ventricular posterior wall, mild tricuspid regurgitation, and slightly reduced left ventricular ejection fraction (LVEF 50%, normal range: 55%-75%) (Figures 1B,C).", "12": "Since acute coronary syndrome (ACS) cannot be excluded, a loading dose of aspirin (300 mg) + clopidogrel (300 mg) was prescribed and coronary angiography (CAG) was suggested but was refused by the patient and her family members.", "14": "Twelve minutes after hospitalization, her chest pain recurred, and monitoring ECG revealed ST-segment elevation in lead II and complete AV-B with HR at 41 beats/min accompanied by hypotension (BP at 96/51 mmHg) (Figures 2A,B).", "16": "With a possible diagnosis of CAS, 5 mg of diltiazem was administered intravenously with prompt relief of chest pain, and complete AV-B was converted back to sinus rhythm (HR at 59 beats/min) (Figure 2C).", "19": "Routine lab work during hospitalization revealed that white blood cell count, lipids, liver function, renal function, glycosylated hemoglobin, electrolytes, thyroid function, coagulation function, erythrocyte sedimentation rate, D-dimers, cytokines, and urinalysis were all within normal limits.", "23": "With other in-patient treatments and improving myocardial ischemia, the patient no longer had chest pain or discomfort during hospitalization."}}, "PMC10405809_01": {"patient": "age=55.0; gender=Female", "text": "A 55-year-old female presented with progressive dysphagia to solids and lost 10 kg weight over two years. She had heartburn and epigastric burning pain during the past 5 years, for which she took over-the-counter acid-suppressive medications. She denied a history of ingesting a caustic substance, radiotherapy, atopy, and other comorbid illnesses. None of her family members had any gastrointestinal disease. She was neither an alcoholic nor a smoker. On examination, she was pale and ill-nourished. She did not have significant lymph node enlargement. Examination of the abdomen, cardiovascular and respiratory systems was unremarkable. Blood investigations showed hemoglobin 8.8 gm/dL, total leukocyte count 6.4 x 109/L, platelet counts 510 x 109/L, and serum ferritin 8.1 microg/L. Peripheral smear showed microcytic and hypochromic red blood cells. Barium swallow showed a 3 cm x 2 cm sized diverticulum from the right lateral wall of the cervical esophagus and a short segment narrowing in the distal esophagus with upstream dilation (Fig. 1). We initially suspected gastroesophageal reflux disease (GERD) with peptic stricture of the esophagus; however, we wanted to rule out underlying malignancy because of profound weight loss and anemia. Hence a computed tomography (CT) scan of the neck and thorax was done, which confirmed KJD and showed a homogenous circumferential wall thickening in the lower esophagus with no significant periesophageal lymph nodes (Fig. 2).\r\nEsophagogastroduodenoscopy revealed KJD at 20 cm from incisors and a tight stricture at the lower esophagus beyond which the endoscope was not negotiable (Fig. 3). The stricture was dilated with a controlled radial expansion (CRE) balloon up to 12 mm (Fig. 3). Biopsies from the stricture site were negative for malignancy. We considered peptic stricture and malignancy of the distal esophagus in the differential diagnosis. Though profound weight loss and anemia raised suspicion of malignancy, the long duration of symptoms, benign CT scan characteristics, and biopsy from the stricture site confirmed peptic stricture in this case. The upper esophageal diverticulum in barium swallow and endoscopy prompted us to consider ZD, KJD, and LD. However, the CT scan confirmed the origin of the diverticulum from the anterolateral wall of the esophagus below the cricopharyngeus muscle. Hence, a final diagnosis of KJD and peptic stricture was made. The patient underwent three CRE balloon dilatation sessions from 12 to 15 mm at 4-weeks intervals. Post dilatation, she was started on capsule omeprazole 20 mg twice daily along with hematinics. After 6 months, she gained 7 kg weight, could take feeds normally, and her repeat hemoglobin was 10.9 gm/dL. She is currently doing well during follow-up.", "nodes": [{"id": "PMC10405809_01_AS1", "label": "Lymph", "type": "AnatomicalSite", "attributes": "match=exact; distance=0"}, {"id": "PMC10405809_01_AS10", "label": "Incisor", "type": "AnatomicalSite", "attributes": "match=fuzzy; distance=1"}, {"id": "PMC10405809_01_AS11", "label": "Esophageal Sphincter, Upper", "type": "AnatomicalSite", "attributes": "match=exact; distance=0"}, {"id": "PMC10405809_01_AS12", "label": "Muscles", "type": "AnatomicalSite", "attributes": "match=fuzzy; distance=1"}, {"id": "PMC10405809_01_AS2", "label": "Abdomen", "type": "AnatomicalSite", "attributes": "match=exact; distance=0"}, {"id": "PMC10405809_01_AS3", "label": "Blood", "type": "AnatomicalSite", "attributes": "match=exact; distance=0"}, {"id": "PMC10405809_01_AS4", "label": "Serum", "type": "AnatomicalSite", "attributes": "match=exact; distance=0"}, {"id": "PMC10405809_01_AS5", "label": "Blood Cells", "type": "AnatomicalSite", "attributes": "match=exact; distance=0"}, {"id": "PMC10405809_01_AS6", "label": "Esophagus", "type": "AnatomicalSite", "attributes": "match=exact; distance=0"}, {"id": "PMC10405809_01_AS7", "label": "Neck", "type": "Anato L.", "10": "Barium swallow showed a 3 cm x 2 cm sized diverticulum from the right lateral wall of the cervical esophagus and a short segment narrowing in the distal esophagus with upstream dilation (Fig. 1).", "11": "We initially suspected gastroesophageal reflux disease (GERD) with peptic stricture of the esophagus; however, we wanted to rule out underlying malignancy because of profound weight loss and anemia.", "12": "Hence a computed tomography (CT) scan of the neck and thorax was done, which confirmed KJD and showed a homogenous circumferential wall thickening in the lower esophagus with no significant periesophageal lymph nodes (Fig. 2).", "13": "Esophagogastroduodenoscopy revealed KJD at 20 cm from incisors and a tight stricture at the lower esophagus beyond which the endoscope was not negotiable (Fig. 3).", "17": "Though profound weight loss and anemia raised suspicion of malignancy, the long duration of symptoms, benign CT scan characteristics, and biopsy from the stricture site confirmed peptic stricture in this case.", "18": "The upper esophageal diverticulum in barium swallow and endoscopy prompted us to consider ZD, KJD, and LD."}}, "PMC10434843_01": {"patient": "age=49.0; gender=Male", "text": "A 49-year-old male presented to our clinic for further diagnostic evaluation of right arm paresis. The patient reported an increasing weakness of the right hand in the preceding months. He could no longer carry objects with his outstretched right arm and had an increasing difficulty in his fine motor skills such as buttoning shirts. The patient initially noticed dysaesthesia of his fingertips in his right hand 2 years ago, which had not bothered him significantly and did not, in contrast to his motor deficits, progress over time. Magnetic resonance imaging (MRI) of the head and cervical spine showed no abnormalities while initial treatments with physiotherapy and oral cortisone had been performed, without any improvement.\r\nThe clinical neurological examination on admission revealed a paresis dominantly of the right distal arm but no atrophy. Specifically, he displayed motor deficits (Medical Research Council grading system) in his wrist flexion [right (r): 4-/5, left (l): 5/5], wrist extension (r: 4/5, l: 5/5), wrist abduction [ulnar: (r: 4/5, l: 5/5), radial: (r: 4+/5, l: 5/5)], finger extension and flexion (r: 4+/5, l: 5/5) in addition to his finger spread (r: 4/5, l: 5/5). His thumb abduction, opposition (r: 4/5, l: 5/5), and extension (r: 4-/5, l: 5/5) showed deficits on the right side. There was a paresis in the external shoulder rotation on both sides (l, r: 4+/5) but no deficits in any other muscles (l/r: 5/5). The patient also presented an isolated hypoesthesia in the fingertips (one third of distal phalanx) of his first three fingers on both sides with an exclusion of the thumb pad and palm without thermdysesthesia and pallhypesthesia. Cramps and fasciculations were not observed. Reflexes were weak but equal on both sides. The neurological exam was otherwise unremarkable.\r\nA diagnostic lumbar puncture and subsequent cerebrospinal fluid (CSF) analysis showed a normal cell count and slightly increased total protein levels (603 mg/l) with a blood-CSF barrier dysfunction as quantified by the albumin quotient, but no intrathecal immunoglobulin synthesis (Figure 1). Flow cytometry analysis revealed an increase of activated HLA-DR expressing CD4+ T cells (33.7%) in the CSF compared to age-matched non-inflammatory controls [Figure 1(b)]. Furthermore, increased proportions of natural killer cells (NK cells) with a CD56bright to CD56dim shift were observed in the blood of the patient compared to both non-inflammatory controls and other inflammatory neuropathy patients. Both blood and CSF displayed higher levels of NKT cells compared to the non-inflammatory controls. Interestingly, we detected antibodies against CASPR2 in the CSF (1:32) and in the serum of the patient (1:320) (Table 1) (indirect immunofluorescence assay). Serum ganglioside antibody determination showed negative Immunoglobulin (Ig)G antibodies and a borderline positive result for IgM antibodies against GM3 and GQ1b in the serum, which, based on the assay guidelines, was considered negative (Table 1) (enzyme immunoassay).\r\nFurther diagnostics showed a motor nerve conduction block at Erb's point-axilla with area reduction of >50% (Table 2) in the right ulnar nerve. Nerve conduction velocity showed normal values in the median and ulnar nerve. F-wave latencies of the ulnar nerves were prolonged and the right median nerve was not measurable. The radial and tibial nerve on both sides showed normal functions. The sensory nerve conduction was normal in all of the above-mentioned nerves suggestive of an isolated motoric axonal and demyelinating neuropathy. The needle electromyography showed chronic neurogenic changes in the abductor pollicis brevis muscle, with no abnormal activity at rest. We diagnosed a MMN as the patient fulfilled the diagnostic criteria.   A peripheral nerve ultrasonography (Figure 2) showed an enlargement of the cross-sectional areas of the right median nerve and discontinuous swelling of individual fascicles of the right median and ulnar nerve in the upper arm supporting the MMN-like phenotype.\r\nA neuropsychiatric consultation showed a normal neurocognitive performance profile with no indication of an autoimmune encephalitis profile. In context with the clinical presentation and his normal brain MRI we thus ruled out an autoimmune encephalitis. Due to the CASPR2 antibodies, which can be associated with malignancy,   we initiated a tumor search with an abdomen and thyroid sonography as well as an urologic consultation and Positron emission tomography-computed tomography (PET-CT) which showed no indication of a tumor.\r\nIn a follow-up visit the patient showed signs of additional deficits on the left side. Specifically, he had motor deficits in his right finger extension (r: 4/5, l: 4+/5), his thumb abduction (r: 4/5, l: 4+/5), as well as thumb extension (r: 4-/5, l: 4/5). We started treatment with IVIG every 4 weeks. Three months later he reported a clinical improvement in his daily activities as he was now able to open drawers again. Objective parameters included an improvement of his finger extension (r: 4/5; l: 5/5) and his wrist extension (r: 5/5; l: 4+/5) and grip strength (Martin-Vigorimeter) (l: 0.6 bar; r: not measurable; 3-month follow-up = l: 0.86 bar, r: 0.36 bar). We also measured an improved electroneurography, with improved conduction velocity and amplitude as well as a decreased area reduction in the conduction block (Table 2) but a new motor nerve conduction block with an area reduction of >50% on the median nerve at the elbow on both sides. In the follow-up, CASPR2 antibodies were confirmed in the serum (1:10) with an indirect immunofluorescence assay but not measured in the CSF, therefore also presenting a treatment response.\r\nFurther differential diagnosis included Lewis-Sumner syndrome and amyotrophic lateral sclerosis as well as other more common causes of CASPR2 antibodies.\r\nWe could not find any signs of the first motor neuron in the clinical examination. While the patient described sensory symptoms in the innervation area of the median nerve bilaterally, they did not extend to the rest of its innervation area (thumb pad, lower arm) and did not progress over time. In addition, we could not find deficits in other sensory qualities or the sensory nerve conduction to objectify these deficits, indicating a Lewis-Sumner syndrome.\r\nHowever, we do acknowledge that the inflammatory neuropathies are most likely an overlapping disease spectrum, which is why we also call it MMN-like disease. Further diagnostics in our case also showed no indication of more common diseases associated with CASPR2 antibodies.", "nodes": [{"id": "PMC10434843_01_AS1", "label": "Arm", "type": "AnatomicalSite", "attributes": "match=exact; distance=0"}, {"id": "PMC10  analysis showed a normal cell count and slightly increased total protein levels (603 mg/l) with a blood-CSF barrier dysfunction as quantified by the albumin quotient, but no intrathecal immunoglobulin synthesis (Figure 1).", "14": "Flow cytometry analysis revealed an increase of activated HLA-DR expressing CD4+ T cells (33.7%) in the CSF compared to age-matched non-inflammatory controls [Figure 1(b)].", "17": "Interestingly, we detected antibodies against CASPR2 in the CSF (1:32) and in the serum of the patient (1:320) (Table 1) (indirect immunofluorescence assay).", "18": "Serum ganglioside antibody determination showed negative Immunoglobulin (Ig)G antibodies and a borderline positive result for IgM antibodies against GM3 and GQ1b in the serum, which, based on the assay guidelines, was considered negative (Table 1) (enzyme immunoassay).", "24": "The needle electromyography showed chronic neurogenic changes in the abductor pollicis brevis muscle, with no abnormal activity at rest.", "26": "A peripheral nerve ultrasonography (Figure 2) showed an enlargement of the cross-sectional areas of the right median nerve and discontinuous swelling of individual fascicles of the right median and ulnar nerve in the upper arm supporting the MMN-like phenotype.", "28": "In context with the clinical presentation and his normal brain MRI we thus ruled out an autoimmune encephalitis.", "29": "Due to the CASPR2 antibodies, which can be associated with malignancy, we initiated a tumor search with an abdomen and thyroid sonography as well as an urologic consultation and Positron emission tomography-computed tomography (PET-CT) which showed no indication of a tumor.", "34": "Objective parameters included an improvement of his finger extension (r: 4/5; l: 5/5) and his wrist extension (r: 5/5; l: 4+/5) and grip strength (Martin-Vigorimeter) (l: 0.6 bar; r: not measurable; 3-month follow-up = l: 0.86 bar, r: 0.36 bar).", "36": "In the follow-up, CASPR2 antibodies were confirmed in the serum (1:10) with an indirect immunofluorescence assay but not measured in the CSF, therefore also presenting a treatment response.", "37": "Further differential diagnosis included Lewis-Sumner syndrome and amyotrophic lateral sclerosis as well as other more common causes of CASPR2 antibodies."}}, "PMC10488652_01": {"patient": "age=22.0; gender=Female", "text": "A 22-year-old female patient with no relevant medical history was admitted to the emergency room of a third-level clinic for clinical symptoms that began 10 days before admission, including intermittent fever up to 39 C, general malaise, headache, myalgia, a mild self-limiting rash episode, diarrhea, and occasional emesis. On physical examination, the patient had mild pallor, icteric sclerae, supraclavicular and cervical adenopathies, synovitis in bilateral metacarpophalangeal joints, and grade II edema in the lower limbs. Paraclinical testing was performed (Table 1), and infectious etiology and hematological neoplasia were ruled out. The classification criteria for SLE were met. The patient was anti-DNA negative, a kidney biopsy was recommended because of the presence of proteinuria, which was consistent with class II mesangial lupus nephritis.  \r\nAutoimmune hemolytic anemia was also confirmed, with laboratory data revealing a cold agglutinin titer Positive dilution 1/128 at 4 C, hemoglobin 6.2 g/dl, hematocrit 18.1% and monospecific direct antiglobulin strongly positive for C3d and negative for IgG, leading to the diagnosis of cold agglutinin syndrome. The patient was transferred to the intensive care unit because of severe hematological involvement, as demonstrated by pancytopenia. Treatment was initiated with dexamethasone at a dose of 40 mg intravenously daily for 4 days and hydroxychloroquine at a dose of 200 mg daily orally, and the three cell lines showed clinical improvement and hematological recovery without the need for blood transfusions. Renal function remained stable and I did not present any other complications. The patient was discharged from the hospital after receiving outpatient treatment with prednisone at a dose of 5 mg daily orally, hydroxychloroquine at a dose of 200 mg daily orally and mycophenolate mofetil at a dose of 500 mg every 12 hours for one week and thereafter at a dose of 500 mg every 8 hours. She made steady progress to her rheumatology follow-up in the outpatient department with no new relapses.\r\nIn this case report, all procedures were performed according to the ethical and bioethical standards of the Scientific Committee of the Clinica de Occidente and the Declaration of Helsinki of 1964 and its later versions. Informed consent was obtained from the study subject prior to her participation and the publication of this study.", "nodes": [{"id": "PMC10488652_01_AS1", "label": "Joints", "type": "AnatomicalSite", "attributes": "match=exact; distance=0"}, {"id": "PMC10488652_01_AS2", "label": "Kidney", "type": "AnatomicalSite", "attributes": "match=exact; distance=0"}, {"id": "PMC10488652_01_AS3", "label": "Blood", "type": "AnatomicalSite", "attributes": "match=exact; distance=0"}, {"id": "PMC10488652_01_D1", "label": "Synovitis", "type": "Diagnosis", "attributes": "match=exact; distance=0"}, {"id": "PMC10488652_01_D2", "label": "Lupus Nephritis", "type": "Diagnosis", "attributes": "match=exact; distance=0"}, {"id": "PMC10488652_01_D3", "label": "Anemia", "type": "Diagnosis", "attributes": "match=exact; distance=0"}, {"id": "PMC10488652_01_D4", "label": "Pancytopenia", "type": "Diagnosis", "attributes": "match=exact; distance=0"}, {"id": "PMC10488652_01_E1", "label": "Physical Examination", "type": "Exam", "attributes": "match=exact; distance=0"}, {"id": "PMC10488652_01_E2", "label": "Biopsy", "type": "Exam", "attributes": "match=exact; distance=0"}, {"id": "PMC10488652_01_E3", "label": "Hematocrit", "type": "Exam", "attributes": "match=exact; distance=0"}, {"id": "PMC10488652_01_E4", "label": "Dexamethasone", "type": "Exam", "attribute "PMC10488652_01_E1|PMC10488652_01_S6": [[1, 3, 23, 178, 183, "NONE", "REVEALS", 0.858]], "PMC10488652_01_E2|PMC10488652_01_S7": [[4, 44, 50, 94, 105, "NONE", "REVEALS", 0.961]], "PMC10488652_01_E2|PMC10488652_01_D2": [[4, 44, 50, 152, 167, "NONE", "CONFIRMS", 0.926]], "PMC10488652_01_E3|PMC10488652_01_D3": [[5, 156, 166, 21, 27, "NONE", "REVEALS", 0.517]], "PMC10488652_01_E3|PMC10488652_01_S8": [[5, 156, 166, 302, 310, "NONE", "EXCLUDES", 0.876]], "PMC10488652_01_D4|PMC10488652_01_T2": [[6, 119, 131, 35, 49, "NONE", "TREATED_BY", 0.735]]}, "sentences": {"1": "On physical examination, the patient had mild pallor, icteric sclerae, supraclavicular and cervical adenopathies, synovitis in bilateral metacarpophalangeal joints, and grade II edema in the lower limbs.", "4": "The patient was anti-DNA negative, a kidney biopsy was recommended because of the presence of proteinuria, which was consistent with class II mesangial lupus nephritis.", "5": "Autoimmune hemolytic anemia was also confirmed, with laboratory data revealing a cold agglutinin titer Positive dilution 1/128 at 4 C, hemoglobin 6.2 g/dl, hematocrit 18.1% and monospecific direct antiglobulin strongly positive for C3d and negative for IgG, leading to the diagnosis of cold agglutinin syndrome.", "6": "The patient was transferred to the intensive care unit because of severe hematological involvement, as demonstrated by pancytopenia.", "7": "Treatment was initiated with dexamethasone at a dose of 40 mg intravenously daily for 4 days and hydroxychloroquine at a dose of 200 mg daily orally, and the three cell lines showed clinical improvement and hematological recovery without the need for blood transfusions."}}, "PMC10521634_01": {"patient": "age=38.0; gender=Male", "text": "A 38-year-old male patient with a history of UC was admitted to the Emergency Department of our institution for increased bowel movements (up to 8 stools/day), dizziness, and rectal bleeding. He was diagnosed two years ago with left-sided UC and managed conservatively with corticosteroids followed by oral mesalamine (5-ASA, 4g/day), for maintenance of remission, with favorable clinical response.\r\nOne year after the initial diagnosis, the patient was readmitted for bloody diarrhea (up to 7 stools/day), fever, and abdominal pain without signs of peritonitis. The colonoscopy showed extensive colitis and was classified as a grade 3 Mayo endoscopic score. Laboratory findings showed a hemoglobin (Hb) level of 11.5g/dl, a platelet count of 800.000/MMC, a CRP level of 5mg/dl, and normal ferritin and albumin levels. An extensive work-up was performed to rule out any infections and VDZ 300 mg iv was initiated. Venous thrombosis prophylaxis was also started with low molecular weight heparin (LMWH). By week 10 of treatment, his FC levels were within normal range, with excellent clinical response (2 stools/day without any bloody discharge). After 14 weeks of VDZ treatment, a routine follow-up showed mild thrombocytosis, and normal Hb, ferritin, CRP, FC, and albumin levels. He was in clinical and histological remission. However, by week 26, the patient is readmitted with massive lower GI bleeding. A colonoscopy is performed showing erythema and a large amount of fresh blood in the lumen without identifying the source (Figure 1).\r\nThe state of the patient progressively worsens and he becomes hemodynamically unstable. He is transferred into de ICU unit for monitoring, and a CT scan is performed showing active diffuse arterial bleeding from multiple sites at the descendent and the sigmoid colon (Figure 2).\r\nUrgent subtotal colectomy and splenectomy with preservation of the rectum and terminal ileostomy are performed. A total of 120 cm of the colon were surgically removed (Figure 3).\r\nThe histopathology report of the resected colon did not identify malignancy or dysplasia, but it showed severe and continuous active disease with diffuse erosions, fissuring ulcers, and focal transmural inflammation in the proximity of deeply ulcerated areas. The postoperative treatment consisted of topic 5-ASA and LMWH (significant post-splenectomy thrombocytosis), but shortly after switched to infliximab biosimilar (IFX-B) 5mg/kg of weight. Seven days of IFX- B, the patient had minor rectal bleeding, but without any hemodynamic repercussions. The clinical outcome was favorable, and the patient was discharged and continued IFX-B therapy with the maintenance of remission. Three months into IFX-B treatment, the patient developed a septic complication, an abdominal abscess. The patient underwent a CT scan and was taken to surgery for drainage of an underlying abscess, with a good surgical outcome. The endoscopy report showed Mayo 2 lesions, confirming active disease with cryptitis and crypt abscesses (Figure 4). The medical team decided to shorten the dosing interval for IFX-B to 4 weeks and add azathioprine (AZA) 2.5mg/kg for a positive and desirable outcome of endoscopic remission. 24 weeks into combo treatment (INF-B+AZA), endoscopic remission was achieved allowing the surgical team to perform a restorative procedure and anastomosis.", "nodes": [{"id": "PMC10521634_01_AS1", "label": "Blood", "type": "AnatomicalSite", "attributes": "match=exact; distance=0"}, {"id": "PMC10521634_01_AS2", "label": "Colon", "type": "AnatomicalSite", "attributes": "match=exact; distance=0"}, {"id": "PMC10521634_01_AS3", "label": "Rectum", "type": "AnatomicalSite", "attributes": "match=exact; distance=0"}, {"id": "PMC10521634_01_D1", "label": "Peritonitis", "type": "Diagnosis", "attributes": "match=exact; distance=0"}, {"id": "PMC10521634_01_D2", "label": "Colitis", "type": "Diagnosis", "attributes": "match=exact; distance=0"}, {"id": "PMC10521634_01_D3", "label": "Infections", "type": "Diagnosis", "attributes": "match=exact; distance=0"}, {"id": "PMC10521634_01_D4", "label": "Venous Thrombosis", "type": "Diagnosis", "attributes": "match=exact; distance=0"}, {"id": "PMC10521634_01_D5", "label": "Thrombocytosis", "typ 10521634_01_D2": [[3, 4, 15, 33, 40, "REVEALS", "REVEALS", 1.0]], "PMC10521634_01_D4|PMC10521634_01_T1": [[6, 0, 17, 73, 80, "TREATED_BY", "TREATED_BY", 0.964]], "PMC10521634_01_E2|PMC10521634_01_AS1": [[11, 2, 13, 72, 77, "PERFORMED_ON", "NONE", 0.372]], "PMC10521634_01_E5|PMC10521634_01_S7": [[22, 4, 13, 62, 69, "REVEALS", "REVEALS", 0.995]], "PMC10521634_01_E2|PMC10521634_01_S5": [[11, 2, 13, 35, 43, "NONE", "REVEALS", 0.99]]}, "sentences": {"2": "One year after the initial diagnosis, the patient was readmitted for bloody diarrhea (up to 7 stools/day), fever, and abdominal pain without signs of peritonitis.", "3": "The colonoscopy showed extensive colitis and was classified as a grade 3 Mayo endoscopic score.", "6": "Venous thrombosis prophylaxis was also started with low molecular weight heparin (LMWH).", "11": "A colonoscopy is performed showing erythema and a large amount of fresh blood in the lumen without identifying the source (Figure 1).", "17": "The postoperative treatment consisted of topic 5-ASA and LMWH (significant post-splenectomy thrombocytosis), but shortly after switched to infliximab biosimilar (IFX-B) 5mg/kg of weight.", "22": "The endoscopy report showed Mayo 2 lesions, confirming active disease with cryptitis and crypt abscesses (Figure 4)."}}, "PMC10710131_01": {"patient": "age=26.0; gender=Female", "text": "Twenty-six cases with one to six teeth missing in the anterior maxilla were included as the clinical information database for digital PBL-CBL method. In fifteen cases, 3D printed titanium meshes were fabricated for guided bone regeneration. Four patients received onlay bone block grafting under the assistance of 3D printed surgical guide. Eighteen patients underwent second bone augmentation simultaneously with dental implant placement at T2. Six patients received connective tissue grafting before soft tissue conditioning. These cases can cover all the techniques and theoretical knowledge in courses of esthetic implant therapy. A case of guided bone regeneration under the guidance of 3D printed titanium mesh was displayed below to show the digital workflow in detail.\r\nThe patient was a 26-year-old female patient who had #23 tooth extracted 5 years ago. A clinical exam revealed good oral hygiene and a normal smile line (Figs. 1A, 1B and 1C). The frontal and occlusal view of the residual ridge displayed a severely collapsed contour and gingival recession at #24 tooth (Figs. 1B and 1C). The preoperative CBCT reveals a severely vertical and horizontal bone defect with a bladed alveolar crest (Fig. 1D).", "nodes": [{"id": "PMC10710131_01_AS1", "label": "Maxilla", "type": "AnatomicalSite", "attributes": "match=exact; distance=0"}, {"id": "PMC10710131_01_AS2", "label": "Connective Tissue", "type": "AnatomicalSite", "attributes": "match=exact; distance=0"}, {"id": "PMC10710131_01_AS3", "label": "Tissues", "type": "AnatomicalSite", "attributes": "match=fuzzy; distance=1"}, {"id": "PMC10710131_01_AS4", "label": "Tooth", "type": "AnatomicalSite", "attributes": "match=exact; distance=0"}, {"id": "PMC10710131_01_D1", "label": "Gingival Recession", "type": "Diagnosis", "attributes": "match=exact; distance=0"}, {"id": "PMC10710131_01_P1", "label": "case PMC10710131_01", "type": "Patient", "attributes": "age=26.0; gender=Female"}, {"id": "PMC10710131_01_T1", "label": "Titanium", "type": "Treatment", "attributes": "match=exact; distance=0"}, {"id": "PMC10710131_01_T2", "label": "Oral Hygiene", "type": "Treatment", "attributes": "match=exact; distance=0"}], "edges": [{"s": "PMC10710131_01_P1", "t": "PMC10710131_01_T1", "r1": ["UNDERWENT_TREATMENT"], "r2": ["UNDERWENT_TREATMENT"], "p": null, "ent": false}, {"s": "PMC10710131_01_P1", "t": "PMC10710131_01_T2", "r1": ["UNDERWENT_TREATMENT"], "r2": ["UNDERWENT_TREATMENT"], "p": null, "ent": false}, {"s": "PMC10710131_01_P1", "t": "PMC10710131_01_D1", "r1": ["DIAGNOSED_WITH"], "r2": ["DIAGNOSED_WITH"], "p": null, "ent": false}, {"s": "PMC10710131_01_D1", "t": "PMC10710131_01_AS4", "r1": ["LOCATED_IN"], "r2": ["LOCATED_IN"], "p": 0.991, "ent": true}], "mentions": {"PMC10710131_01_D1|PMC10710131_01_AS4": [[9, 95, 113, 121, 126, "LOCATED_IN", "LOCATED_IN", 0.991]]}, "sentences": {"9": "The frontal and occlusal view of the residual ridge displayed a severely collapsed contour and gingival recession at #24 tooth (Figs. 1B and 1C)."}}, "PMC11131390_01": {"patient": "age=nan; gender=Male", "text": "A retired male patient - 64 years of age and a heavy smoker - presented in May 2015 with a complaint of weight loss despite good appetite. He was ordered thyroid function tests revealing mild overt hyperthyroidism: TSH = 0.01 microIU/L (Normal 0.27-4.2 microIU/L), free T4 = 3.7 ng/dL (Normal 0.93-1.7 ng/dL), and free T3 = 10.9 (Normal 2.0-4.4 pg/mL). He had no goiter and no evidence of thyroid eye disease. Serological investigations were consistent with a diagnosis of GD: TRAbs = 16.3 IU/L (Normal <1.75 IU/L), TPO antibodies = 268 (Normal <34 IU/mL), and thyroglobulin (Tg) antibodies = 1731 (Normal <115 IU/mL). The patient was counseled about the nature of GD, about the benefits of quitting smoking, and he was offered medical treatment in the form of carbimazole (CBZ) 20 mg/day, given that methimazole is not available in Egypt. The dose of CBZ was then titrated against his laboratory results, to achieve low normal free T4 and free T3, and he maintained euthyroid on a dose of 5 mg/day for a period of 15 months (February 2016-May 2017). In July 2017, CBZ was discontinued after having a TSH result of 22 microIU/L while being on a dose of 2.5 mg/day for 2 months. Celebrating the discontinuation of treatment after more than 2 years of treatment, the patient decided to quit smoking and comply with the repeated advice of quitting smoking that was offered to the patient in almost every follow-up visit. The first follow-up off CBZ in August 2017, the patient was euthyroid with TSH = 3.3 microIU/L, free T4 = 1.17 ng/dL, and TRAbs was 3.3 IU/L. In November 2017, 4 months after stopping CBZ, the patient presented with 4 kg weight gain (67-71 kg) and severe biochemical hypothyroidism, TSH = 73.5 microIU/L and free T4 = 0.35 ng/dL, which was repeatedly confirmed, TSH = 48.9 microIU/L and free T4 = 0.66 ng/dL (Figure 1). Considering the patient age (66 years) and body weight (71 kg), the patient was started on replacement therapy in the form of levothyroxine 75 microg/day (calculated as 1.1 microg/kg/day), and the dose was later titrated to achieve a target TSH of 0.3-3 microIU/L, which was finally achieved using 100 microg/day, and this target was maintained for 45 months (July 2019-April 2023). TRAbs were measured in November 2021, and it was negative at <0.8 IU/L. The coincidence of quitting smoking in July 2017 and the spontaneous development of overt hypothyroidism in November 2017, only 4 months later, urged us to search for a possible link between quitting smoking and new onset hypothyroidism in patients with treated GD.", "nodes": [{"id": "PMC11131390_01_AS1", "label": "Eye", "type": "AnatomicalSite", "attributes": "match=exact; distance=0"}, {"id": "PMC11131390_01_D1", "label": "Hyperthyroidism", "type": "Diagnosis", "attributes": "match=exact; distance=0"}, {"id": "PMC11131390_01_D2", "label": "Goiter", "type": "Diagnosis", "attributes": "match=exact; distance=0"}, {"id": "PMC11131390_01_D3", "label": "Hypothyroidism", "type": "Diagnosis", "attributes": "match=exact; distance=0"}, {"id": "PMC11131390_01_E1", "label": "Thyroid Function Tests", "type": "Exam", "attributes": "match=exact; distance=0"}, {"id": "PMC11131390_01_E2", "label": "Antibodies", "type": "Exam", "attributes": "match=exact; distance=0"}, {"id": "PMC11131390_01_E3", "label": "Carbimazole", "type": "Exam", "attributes": "match=exact; distance=0"}, {"id": "PMC11131390_01_P1", "label": "case PMC11131390_01", "type": "Patient", "attributes": "age=nan; gender=Male"}, {"id": "PMC11131390_01_R1", "label": "34 IU", "type": "ExamResult", "attributes": {"id": "PMC11259348_01_AS2", "label": "Blood", "type": "AnatomicalSite", "attributes": "match=exact; distance=0"}, {"id": "PMC11259348_01_E1", "label": "Mass Screening", "type": "Exam", "attributes": "match=exact; distance=0"}, {"id": "PMC11259348_01_P1", "label": "case PMC11259348_01", "type": "Patient", "attributes": "age=nan; gender=Female"}, {"id": "PMC11259348_01_S1", "label": "Fever", "type": "Symptom", "attributes": "match=exact; distance=0"}, {"id": "PMC11259348_01_S2", "label": "Hemoglobinuria", "type": "Symptom", "attributes": "match=exact; distance=0"}, {"id": "PMC11259348_01_T1", "label": "Blood Transfusion", "type": "Treatment", "attributes": "match=exact; distance=0"}], "edges": [{"s": "PMC11259348_01_P1", "t": "PMC11259348_01_S1", "r1": ["PRESENTS_WITH"], "r2": ["PRESENTS_WITH"], "p": null, "ent": false}, {"s": "PMC11259348_01_P1", "t": "PMC11259348_01_E1", "r1": ["UNDERWENT_EXAM"], "r2": ["UNDERWENT_EXAM"], "p": null, "ent": false}, {"s": "PMC11259348_01_E1", "t": "PMC11259348_01_AS2", "r1": ["PERFORMED_ON"], "r2": [], "p": null, "ent": true}, {"s": "PMC11259348_01_P1", "t": "PMC11259348_01_T1", "r1": ["UNDERWENT_TREATMENT"], "r2": ["UNDERWENT_TREATMENT"], "p": null, "ent": false}, {"s": "PMC11259348_01_P1", "t": "PMC11259348_01_S2", "r1": ["PRESENTS_WITH"], "r2": ["PRESENTS_WITH"], "p": null, "ent": false}], "mentions": {"PMC11259348_01_E1|PMC11259348_01_AS2": [[2, 49, 58, 4, 9, "PERFORMED_ON", "NONE", 0.288]]}, "sentences": {"2": "Her blood group was A Rh D-positive and antibody screening was negative."}}, "PMC11259348_02": {"patient": "age=nan; gender=Unknown", "text": "Transfusion reaction investigations excluded the presence of erythrocyte alloantibodies and ABO incompatibility of the patient with transfused units. Therefore, the exacerbations of hemolysis following blood transfusions were considered as triggered by Donath-Landsteiner antibody present in the patient's serum. P antigen-negative red cell transfusion is an option for such situations to avoid further hemolysis. However, with the absence of specific antisera and molecular typing methods, selecting this type of blood unit was a challenge.\r\nIn Donath-Landsteiner test, Donath-Landsteiner antigen (probably P specificity)-positive red cells are hemolyzed by Donath-Landsteiner antibody in the patient's serum. The hemolysis is detected in the supernatant compared to the color of the patient's serum. I tried to apply the same principle to test the P antigen status of donor red cell packs. When a set of group-specific donor red cell suspensions are mixed in 1:9 ratio with the patient's serum (containing Donath-Landsteiner antibody) and incubated at 0 C followed by 37 C, supernatant of the tubes containing P-positive red cells should appear darker than the patient's serum due to the hemolysis. Necessarily, the tubes without a color change following incubation need to carry P-negative red cells.\r\nIdeally, positive and negative controls should be run in parallel to the test using P-positive and P-negative red cells against the Donath-Landsteiner antibody-positive serum. Since P-negative red cells were not available, only test control was performed as follows. In positive control, P-positive red cells are mixed in 1:9 ratio with the patient's serum expecting hemolysis and a color change of the supernatant following antigen-antibody reaction. In negative control tube, P-positive cells are reacted with fresh serum of a healthy person with the same blood group. Its supernatant color should be similar to the patient's serum. P-positive red cells can be prepared by pooling three randomly selected group-specific blood units.\r\nProcedure was performed as follows.\r\nGroup A-positive ten blood packs were selected, and 50% red cell suspensions were made from each (P1, P2, P3,...)\r\nTen clean test tubes were taken and labeled (T1-T10)\r\nOne volume of P1 cell suspension was added to T1 test tube and followed the same procedure for the rest of cell suspensions (e.g., from P2 to T2, P3 to T3,...)\r\nThen, nine volumes of 37 C separated patient's serum was added to each T1-T10 tubes\r\nPositive control - Nine volumes of 37 C separated patient's serum was added to one volume of 50% cell suspension prepared from pooling three group A blood units\r\nNegative control - Nine volumes of 37 C separated fresh serum of a group A healthy person was added to one volume of 50% cell suspension prepared from pooling three group A blood units\r\nT1-T10 and control tubes were incubated at 0 C in crushed ice for 1 h and then immediately transferred to water bath at 37 C. After 30 min incubation period, all tubes were centrifuged under low spin for 15 s, and the supernatants were inspected compared to the patient's serum color.\r\nThe supernatant color of the positive control was darker compared to the patient's serum, while in the negative control, color was similar to the patient's serum\r\nEnhanced hemolysis was evident in nine out of ten testing samples. Supernatant of the tenth tube did not show color change compared to the patient's serum, indicating the negativity for P antigen in the red cells of that specific donor\r\nWhole test was repeated, and the results were confirmed.", "nodes": [{"id": "PMC11259348_02_AS1", "label": "Erythrocytes", "type": "AnatomicalSite", "attributes": "match=fuzzy; distance=1"}, {"id": "PMC11259348_02_AS2", "label": "Blood", "type": "AnatomicalSite", "attributes": "match=exact; distance=0"}, {"id": "PMC11259348_02_AS3", "label": "Serum", "type": "AnatomicalSite", "attributes": "match=exact; distance=0"}, {"id": "PMC11259348_02_AS4", "label": "Cells", "type": "AnatomicalSite", "attributes": "match=exact; distance=0"}, {"id": "PMC11259348_02_D1", "label": "Transfusion Reaction", "type": "Diagnosis", "attributes": "match=exact; distance=0"}, {"id": "PMC11259348_02_E1", "label": "Molecular Typing", "type": "Exam", "attributes": "match=exact; distance=0"}, {"id": "PMC11259348_02_P1", "label": "case PMC11259348_0 ue to the hemolysis.", "16": "Group A-positive ten blood packs were selected, and 50% red cell suspensions were made from each (P1, P2, P3,...) Ten clean test tubes were taken and labeled (T1-T10) One volume of P1 cell suspension was added to T1 test tube and followed the same procedure for the rest of cell suspensions (e.g., from P2 to T2, P3 to T3,...) Then, nine volumes of 37 C separated patient's serum was added to each T1-T10 tubes Positive control - Nine volumes of 37 C separated patient's serum was added to one volume of 50% cell suspension prepared from pooling three group A blood units Negative control - Nine volumes of 37 C separated fresh serum of a group A healthy person was added to one volume of 50% cell suspension prepared from pooling three group A blood units T1-T10 and control tubes were incubated at 0 C in crushed ice for 1 h and then immediately transferred to water bath at 37 C."}}, "PMC11345641_01": {"patient": "age=48.0; gender=Female", "text": "In December 2021, a 48-year-old woman was admitted to our center for a pelvic mass initially identified seven years earlier by transabdominal ultrasonography, which suggested a leiomyoma. Over the last three years, her menstrual cycles have lengthened, and her flow has increased. She has experienced abdominal pain and noticeable abdominal enlargement over the past five months. Following her hospitalization, a comprehensive preoperative evaluation was conducted. All serum tumor markers, including carbohydrate antigen 12-5 (CA12-5), CA19-9, alpha-fetoprotein (AFP), human epididymis protein 4 (HE4), and carcinoembryonic antigen (CEA), were within normal limits. However, her serum lactate dehydrogenase (LDH) level was elevated to 289U/L. Ultrasonography identified a heterogeneously echogenic mass in the anterior wall of the uterus measuring 12.6x12.0x8.4cm with a regular outline and clear boundaries, consistent with a uterine fibroid. It also revealed endometrial thickening to 15mm. MRI imaging displayed two quasi-circular masses within the uterine muscle wall; the larger was located in the anterior wall, measuring approximately 9.9x12.0x12.6cm, with 80% protruding into the subserosal area. The MRI suggested degeneration of the leiomyomas, possibly indicating a cellular leiomyoma ( Figure 1 ). An endometrial biopsy was performed, which indicated a secretory-responsive endometrium.\r\nOn December 14, 2021, we performed a total laparoscopic hysterectomy and bilateral salpingectomy on a patient. During surgery, the uterus resembled that of a five-month pregnancy in size and was irregularly shaped with multiple fibroids, the largest being 12 cm in diameter on the anterior wall. The uterus was removed transvaginally without protective measures. The general picture is as follows ( Figure 2 ). Microscopic examination post-surgery revealed the mass to be a leiomyoma, with most areas infarcted and some showing bizarre nuclei and rare mitotic figures (0-1/10 HPF) ( Figure 3 ). The patient was advised of the need for close follow-up. A month post-operation, transabdominal ultrasonography showed no abnormalities. However, four months later, she developed abdominal distension. Repeat ultrasonography identified several heterogeneous masses of varying sizes in the right pelvic and abdominal regions, the largest measuring 12.5x11.8x7.8 cm. Further MRI revealed multiple abnormal signal shadows involving the vaginal stump, right lower quadrant, omentum, mesentery, intestinal space, pelvic cavity, and areas near the common iliac vessel bifurcation and rectum. A lesion in the right lower quadrant had penetrated the right transversus abdominis muscle, reaching the subcutaneous fat ( Figure 4 ). Serum CA12-5 and LDH levels were elevated to 46.4 U/mL and 340 U/L, respectively, while other markers remained normal. Physical examination revealed significant abdominal distention with a large, palpable mass extending three fingers above the umbilicus and showing limited mobility. A firm, cystic mass approximately 5 cm in diameter was palpable at the vaginal stump, although the vaginal mucosa was intact.\r\nOn April 29, 2022, we performed an exploratory laparotomy, including resections of pelvic, abdominal, and mesenteric tumors, and a palliative resection of the right colon tumor. During surgery, we identified a 20 cm tumor in the abdominal cavity, covered by the greater omentum and prone to bleeding, with complex, primarily mucous internal tissue. The tumor encased parts of the ascending and transverse colon, as well as the ileum, and extended through the right peritoneum to the right rectus abdominis muscle. Additional tumors up to 3 cm in diameter were found on the small intestine and descending colon, and larger tumors up to 7 cm were present in the pelvis. Enlarged retroperitoneal lymph nodes were noted, the largest measuring 4 cm. The bilateral ovaries were not visible. We advised the patient's family of the challenging intraoperative conditions and the impossibility of complete cytoreductive surgery, recommending a palliative approach instead. They consented to this plan. Microscopic analysis confirmed undifferentiated sarcomas in the abdominal and pelvic masses, with tumor involvement noted in the right colon, part of the ileum, mesentery and its lymph nodes, omentum, and appendix ( Figure 5 ). Postoperatively, the patient experienced pleural effusion, right hydronephrosis, and poor incision healing. After symptomatic treatment, her condition improved. Considering her overall status, we recommended follow-up chemotherapy. However, the patient chose to discontinue treatment for personal reasons and was discharged, resulting in unsuccessful follow-up.", "nodes": [{"id": "PMC11345641_01_AS1", "label": "Serum", "type": "AnatomicalSite", "attributes": "match=exact; distance=0"}, {"id": "PMC11345641_01_AS10", "label": "Subcutaneous Fat", "type": "AnatomicalSite", "attributes": "match=exact; distance=0"}, {"id": "PMC11345641_01_AS11", "label": "Fingers", : [[0, 142, 157, 177, 186, "NONE", "REVEALS", 0.962]]}, "sentences": {"0": "In December 2021, a 48-year-old woman was admitted to our center for a pelvic mass initially identified seven years earlier by transabdominal ultrasonography, which suggested a leiomyoma.", "4": "All serum tumor markers, including carbohydrate antigen 12-5 (CA12-5), CA19-9, alpha-fetoprotein (AFP), human epididymis protein 4 (HE4), and carcinoembryonic antigen (CEA), were within normal limits.", "5": "However, her serum lactate dehydrogenase (LDH) level was elevated to 289U/L.", "6": "Ultrasonography identified a heterogeneously echogenic mass in the anterior wall of the uterus measuring 12.6x12.0x8.4cm with a regular outline and clear boundaries, consistent with a uterine fibroid.", "10": "An endometrial biopsy was performed, which indicated a secretory-responsive endometrium.", "23": "Physical examination revealed significant abdominal distention with a large, palpable mass extending three fingers above the umbilicus and showing limited mobility."}}, "PMC11368112_01": {"patient": "age=35.0; gender=Male", "text": "A 35-year-old male with a 2-day history of chest tightness and fever was admitted to the emergency department on July 13, 2022. His medical history included lower extremity venous thrombosis, pulmonary nodules, cardiac surgery, and hypertension. Two days ago, he experienced significant dyspnea accompanied by intermittent fever and chills. His physical examination revealed a temperature of 38.7 C, with rapid respiration but no other obvious abnormalities. The laboratory results were as follows: WBC, 12.65 x 109/L; neutrophils, 85%; CRP, 65 mg/L; ESR, 55 mm/h; and D-dimer, 26.12 mg/L. Venous ultrasound revealed thrombosis in the common femoral vein, bilateral external iliac veins, and left superficial femoral vein in both lower limbs. ECG indicated sinus tachycardia. Pulmonary CTA indicated embolism in both lower pulmonary artery branches, a new embolus in the right lower pulmonary artery branch, and exudative changes in the lower lobes of both lungs (Figure 1a and b).\r\nThe patient was transferred to the respiratory department with a diagnosis of pulmonary embolism (PE). During the night, his temperature spiked to 39.5 C, accompanied by chills. Despite an empirical escalation of anti-infective therapy with meropenem and linezolid, his fever persisted, reaching a peak of 39.8 C on the fifth day of hospitalization. Blood and sputum cultures were negative. The patient reported experiencing a similar high fever two months earlier following cardiac surgery, which had subsided with anti-infective and antipyretic treatment. Two months earlier, an esophageal echocardiogram had indicated a hyperechoic right atrium with a widened coronary sinus (Figure 2a). On May 13, 2022, he underwent surgery to remove an intracardiac mass. Intraoperative findings revealed a 3 x 3 cm cystic mass containing yellow cloudy fluid in the coronary sinus of the right atrium. Intraoperative cryopathologic analysis indicated inflammatory exudation with necrotic tissue and infiltration of inflammatory cells (Figure 2b). The cardiology department consulted with hematology, infection, and vascular departments before and after the surgery, suspecting tuberculosis and fungal infection; however, a definitive diagnosis was not reached. Physical examination revealed multiple ulcers (0.2-0.8 cm in diameter) on the patient's bilateral lower extremities, groin, and scrotum, along with scattered old rashes. Examination of the oropharynx indicated multiple ulcers on the tongue and labium.\r\nOn the 7th day of hospitalization, the patient underwent a skin biopsy, which revealed epidermal ulceration with lipofuscinosis (Figure 2c). BD was diagnosed after a multidisciplinary discussion involving rheumatology, cardiac microvascular surgery, pathology, dermatology, vascular surgery, and ultrasonography, based on the International Criteria for Behcet's Disease (ICBD). After multidisciplinary consultation, a treatment plan was initiated, including methylprednisolone at 80 mg per day for two weeks, with 60 mg per day for three months (reduced by 5 mg weekly to reach 5 mg daily), cyclosporine at 200 mg per day, and warfarin to maintain a target international normalized ratio of 2.0-3.0. The patient's temperature normalized rapidly after starting treatment, with ESR and CRP levels returning to the normal range. He was discharged 14 days after admission without significant adverse reactions. Two weeks post-treatment, pulmonary artery CTA indicated the disappearance of emboli in the right lower pulmonary branch and a reduction in the size of emboli in the left lower pulmonary branch (Figure 1c and d). The patient remained in remission during nine months of follow-up, with regular adjustments to his medication by rheumatology.", "nodes": [{"id": "PMC11368112_01_AS1", "label": "Lower Extremity", "type": "AnatomicalSite", "attributes": "match=exact; distance=0"}, {"id": "PMC11368112_01_AS10", "label": "Tissues", "type": "AnatomicalSite", "attributes": "match=fuzzy; distance=1"}, {"id": "PMC11368112_01_AS11", "label": "Cells", "type": "AnatomicalSite", "attributes": "match=exact; distance=0"}, {"id": "PMC11368112_01_AS12", "label": "Extremities", "type": "AnatomicalSite", "attributes": "match=exact; distance=0"}, {"id": "PMC11368112_01_AS13", "label": "Groin", "type": "AnatomicalSite", "attributes": "match=exact; distance=0"}, {"id": "PMC11368112_01_AS14", "label": "Scrotum", "type": "AnatomicalSite", "attributes": "match=exact; distance=0"}, {"id": "PMC11368112_01_AS15", "label": "Oropharynx", "type": "AnatomicalSite", "attributes": "match=exact; distance=0"}, {"id": "PMC11368112_01_AS16", "label": "Tongue", "type": "AnatomicalSite", "attributes": "match=exact; distance=0"}, {"id": "PMC11368112_01_AS17", "label": "Skin", "type": "AnatomicalSite", "attributes": "match=exact; distance=0"}, {"id": "PMC11368112_01_AS2", "label": "Neutrophils", "type": "AnatomicalSite -0.8 cm in diameter) on the patient's bilateral lower extremities, groin, and scrotum, along with scattered old rashes.", "20": "On the 7th day of hospitalization, the patient underwent a skin biopsy, which revealed epidermal ulceration with lipofuscinosis (Figure 2c).", "21": "BD was diagnosed after a multidisciplinary discussion involving rheumatology, cardiac microvascular surgery, pathology, dermatology, vascular surgery, and ultrasonography, based on the International Criteria for Behcet's Disease (ICBD)."}}, "PMC11420039_01": {"patient": "age=74.0; gender=Female", "text": "A 74-year-old woman presented with widespread erythematous patches and vesicles on the limbs, which had appeared successively over a period of 2 weeks, and had previously been diagnosed as \"eczema\" at another hospital. Treatment with acyclovir cream was ineffective. Two days before admission, the patient's condition worsened, prompting a visit to our dermatology department. On admission, the patient exhibited erythematous papules, pustules ( Figure 1 ), particularly severe on the buttocks and both lower limbs, which were ulcerated with yellowish crusts. The total area of skin lesions was approximately 1000 cm2, with an exudation area of approximately 200 cm2 ( Figures 2A, B ). The patient had no past medical history, no history of allergies, no history of medication use, and no history of exposure to harmful substances. Laboratory investigations did not reveal any significant abnormalities. For a definitive diagnosis, direct immunofluorescence (DIF) was performed on the skin lesions, showing linear deposits of IgG along the dermoepidermal junction, histological features consistent with HE staining, and significant infiltration of eosinophils ( Figures 3A, B ). Serum anti-bp180 antibody testing was positive, confirming a diagnosis of BP. The patient was treated with methylprednisolone 40 mg orally per day, which was adjusted to methylprednisolone tablets orally after one week, with a dose of 20 mg in the morning and 16 mg in the evening. The patient's overall skin condition significantly improved, and she was discharged after two weeks. The dosage of methylprednisolone tablets was gradually reduced after discharge.\r\nTwo months later, the patient developed a small number of new skin lesions throughout her body, prompting readmission to our dermatology department. The methylprednisolone dosage was adjusted to 16 mg in the morning and 12 mg in the evening, and dupilumab injection was added. Dupilumab was administered subcutaneously, with an initial dose of 600 mg (300 mg injected twice), followed by 300 mg every two weeks. Following treatment, the skin lesions partially crusted over. The patient was discharged after a week of hospitalization and continued to take methylprednisolone tablets orally at the original dosage regimen, with regular subcutaneous injections of dupilumab.\r\nHowever, one month later, the patient developed symptoms of fatigue and dyspnea, leading to admission to our cardiology department. The patient's symptoms worsened gradually, eventually resulting in respiratory failure, necessitating transfer to the intensive care unit. Chest CT revealed patchy changes ( Figure 4 ), while head CT and MRI showed no significant abnormalities ( Figures 5 ). High-throughput pathogenic microorganism sequencing in peripheral blood (Next Generation Sequencing, NGS) suggested the presence of human herpesvirus 3 (VZV), human herpesvirus 5 (CMV), human herpesvirus 1 (HSV1), and human herpesvirus 4 (EBV), with viral sequence counts exceeding 100,000 ( Table 1 ). Therefore, the patient was diagnosed with viral septicemia and treated with acyclovir for antiviral therapy. Since no new skin rash was observed in this instance and considering the severely compromised immune status due to severe infection, the methylprednisolone dosage was reduced to 4 mg, and intravenous immunoglobulin was added to boost immunity after consultation with the dermatology department. However, the patient's autoimmune antibody spectrum indicated positive anti-recombinant RO-52 antibodies, anti-nuclear antibodies, and anti-SSA antibodies ( Table 2 ). Further inquiry into the medical history revealed noticeable symptoms of dry eyes and dry mouth reported by the patient's family over the past two months. To confirm the diagnosis, a Schirmer test showed a positive result. According to diagnostic criteria established by Vitali C, the patient was diagnosed with Secondary Sjogren's Syndrome. Meanwhile, during the course of the illness, the patient gradually developed a decreased level of consciousness. Initial head MRI showed no significant changes. Subsequent lumbar puncture revealed Enterococcus and human herpesvirus 7 in the cerebrospinal fluid. Considering that the patient suffered from severe immunosuppression, with reactivation of several herpesviruses in plasma, before having a microbial CNS infection and succumbing to lung infection. We prescribed broad-spectrum antimicrobial therapy with meropenem, linezolid, and acyclovir. Human immunoglobulin was administered intravenously at a dose of 20 g once daily for 5 consecutive days. Additionally, thymosin alpha-1 was used to boost T cells and the overall immune system, with a daily subcutaneous injection of 1.6 mg for 1 week. During this period, the patient's immune function improved compared to before ( Table 3 ). After active treatment, the patient's condition improved, and she was transferred out of the ICU, but her consciousness level remained incomplete, characterized by the ability to open eyes spontaneously but inability to follow commands. Upon follow-up two months later, the patient succumbed to complications from severe secondary pulmonary infection.", "nodes": [{"id": "PMC11420039_01_AS1", "label": "Buttocks", "type": "AnatomicalSite", "attributes": "match=exact; distance=0"}, {"id": "PMC11420039_01_AS10", "label": "Lung", "type": "AnatomicalSite", "attributes": "match=exact; distanc patient": "age=41.0; gender=Female", "text": "A 41-year-old female with a history of cesarean section presented to the emergency department with continuous abdominal pain for 12 h, localized in the right iliac fossa (RIF). She had no fever or genitourinary symptoms. She was on day 20 of her menstrual cycle, with regular monthly cycles. No dysmenorrhea or cyclical pelvic pain.\r\nPhysical examination revealed abdominal pain in RIF, with localized tenderness in the RIF but no rebound tenderness was found. McBurney's point was positive and the obturator sign was negative.\r\nLaboratory results showed white blood cells at 8800/mm3 (normal range (NR) 3800-10,000/mm3), C-reactive protein (CRP) at 55 mg/L (NR <5 mg/L), erythrocyte sedimentation rate at 29 mm/h (NR 3-20 mm/h), negative chorionic gonadotropin, and other values within normality.\r\nAbdominal and pelvic ultrasound showed only free fluid in the Pouch of Douglas (POD). Abdominal CT with intravenous contrast (Image 1A, Image 1B) revealed an enlarged cecal appendix measuring 8 mm in thickness with inflammatory changes, and an enlarged right ovary measuring 4 cm.\r\nLaparoscopic exploration was decided, which revealed phlegmonous appendicitis without peritonitis, showing the appendix swollen, erythematous and thickened, with purulent material in the lumen and fibrinous exudates on the serial surface; and concurrent inflammatory congestion of the right fallopian tube. A laparoscopic appendectomy was performed successfully, and gynecology was consulted for a right salpingectomy due to the inflammatory process. No suggestive foci of gynecological or abdominal endometriosis were observed.\r\nThe patient had an uneventful postoperative course and was discharged 24 h later.\r\nHistopathology of the appendix describes the presence of ectopic endometrial stroma within the muscularis layer of the appendix, a hallmark of endometriosis; it revealedsigns of recent bleeding that suggests active involvement, consistent with one of the characteristic features of endometriotic tissue, which includes hemorrhage from ectopic endometrial glands and stroma; it also described endometrial stroma within the muscular layer (Image 2, Image 3, Image 4). The fallopian tube histology showed endometrial glands and stroma, negative for malignancy.\r\nAt 6 month follow-up, the patient remains asymptomatic with follow-up in gynecology.", "nodes": [{"id": "PMC11722600_01_AS1", "label": "Ilium", "type": "AnatomicalSite", "attributes": "match=exact; distance=0"}, {"id": "PMC11722600_01_AS2", "label": "Blood Cells", "type": "AnatomicalSite", "attributes": "match=exact; distance=0"}, {"id": "PMC11722600_01_AS3", "label": "Appendix", "type": "AnatomicalSite", "attributes": "match=exact; distance=0"}, {"id": "PMC11722600_01_AS4", "label": "Ovary", "type": "AnatomicalSite", "attributes": "match=exact; distance=0"}, {"id": "PMC11722600_01_AS5", "label": "Exudates and Transudates", "type": "AnatomicalSite", "attributes": "match=exact; distance=0"}, {"id": "PMC11722600_01_AS6", "label": "Tissues", "type": "AnatomicalSite", "attributes": "match=fuzzy; distance=1"}, {"id": "PMC11722600_01_D1", "label": "Appendicitis", "type": "Diagnosis", "attributes": "match=exact; distance=0"}, {"id": "PMC11722600_01_D2", "label": "Peritonitis", "type": "Diagnosis", "attributes": "match=exact; distance=0"}, {"id": "PMC11722600_01_D3", "label": "Endometriosis", "type": "Diagnosis", "attributes": "match=exact; distance=0"}, {"id": "PMC11722600_01_E1", "label": "Physical Examination", "type": "Exam", "attributes": "match=exact; distance=0"}, {"id": "PMC11722600_01_E2", "label": "C-Reactive Protein", "type": "Exam", "attributes": "match=exact; distance=0"}, {"id": "PMC11722600_01_E3", "label": "Blood Sedimentation", "type": "Exam", "attributes": "match=exact; distance=0"}, {"id": "PMC11722600_01_H1", "label": "Abdominal Pain", "type": "History", "attributes": "category=symptom"}, {"id": "PMC11722600_01_P1", "label": "case PMC11722600_01", ich revealed phlegmonous appendicitis without peritonitis, showing the appendix swollen, erythematous and thickened, with purulent material in the lumen and fibrinous exudates on the serial surface; and concurrent inflammatory congestion of the right fallopian tube.", "13": "Histopathology of the appendix describes the presence of ectopic endometrial stroma within the muscularis layer of the appendix, a hallmark of endometriosis; it revealedsigns of recent bleeding that suggests active involvement, consistent with one of the characteristic features of endometriotic tissue, which includes hemorrhage from ectopic endometrial glands and stroma; it also described endometrial stroma within the muscular layer (Image 2, Image 3, Image 4)."}}, "PMC11722600_02": {"patient": "age=44.0; gender=Female", "text": "A 44-year-old female with a history of endometriosis on hormonal treatment, previous surgeries including two cesarean sections and a laparoscopic exploration with resection of pelvic endometriotic foci two years prior, presented with abdominal pain for 72 h, initially in the epigastrium and later localized in RIF, associated with oral intolerance. No fever or urinary symptoms. No dysmenorrhea or chronic cyclical abdominal pain.\r\nPhysical examination showed abdominal pain in RIF, with localized tenderness and positive McBurney's sign. Rebound tenderness was positive in the RIF showing a positive Blumberg sign; obturator sign was negative.\r\nLaboratory tests indicated leukocytosis with 17,200/mm3 white blood cells (NR 3800-10,000/mm3), CRP at 85 mg/L (NR <5 mg/dL). A presumptive diagnosis of acute appendicitis was made, and an abdominal and pelvic CT revealed an enlarged cecal appendix measuring 17 mm in diameter with marked inflammatory process around the cecum and terminal ileum, suggestive of an appendiceal phlegmon.\r\nWith a diagnosis of advanced appendicitis, non-operative treatment with intravenous antibiotics was initially indicated. The evolution was irregular, with fever, increased abdominal pain, tachycardia, and rising acute phase reactants, leading to exploratory laparoscopy which revealed inflammatory process in RIF adhered to the anterior and lateral parietal peritoneum involving the cecum, terminal ileum, and greater omentum. A 75 cc abscess of purulent fluid was drained. No further surgery was performed due to the firmness of the inflammatory process. Two Jackson Pratt (JP) drains were placed in the pelvis and right paracolic space. Bacteriological study of the collection showed no germ growth. The patient improved and was discharged after 7 days of admisison; before this a control CT was performed to ensure complete drainage of the periappendiceal collection, as this case presented an atypical scenario for our team.\r\nAt 6 months, a follow-up CT (Image 5A, Image 5B) showed an enlarged cecal appendix with a coprolite inside, without acute inflammatory process or collections. Although the patient was asymptomatic, a scheduled laparoscopic appendectomy was suggested due to the persistent enlargement of the appendix, coprolite, and the young age of the patient with a risk of future inflammatory episodes. Laparoscopic appendectomy was performed, revealing a cecal appendix with a significant inflammatory component. The base of the appendix had a diameter of approximately 2.5 cm, requiring the use of a 45 mm blue cutting linear stapler. She was discharged on the third postoperative day without complications.\r\nHistopathological examination showed a cecal appendix with a coprolite inside its lumen and chronic inflammatory process, with endometrial glands lined by cylindrical cells without atypia in the muscular and serosal layers, lined by normal columnar epithelial cells, a classic histological feature of endometriosis; these were surrounded by fusocellular stromal cells with a spindle shape that resembles the endometrial stroma found in the uterine lining with foci of recent bleeding, that indicates hemorrhage associated with endometrial activity in ectopic location; no malignant lesions were found (Image 6A, Image 6B, Image 7).\r\nThe patient is currently asymptomatic and under periodic gynecological follow-up.", "nodes": [{"id": "PMC11722600_02_AS1", "label": "Blood Cells", "type": "AnatomicalSite", "attributes": "match=exact; distance=0"}, {"id": "PMC11722600_02_AS10", "label": "Stromal Cells", "type": "AnatomicalSite", "attributes": "match=exact; distance=0"}, {"id": "PMC11722600_02_AS2", "label": "Appendix", "type": "AnatomicalSite", "attributes": "match=exact; distance=0"}, {"id": "PMC11722600_02_AS3", "label": "Cecum", "type": "AnatomicalSite", "attributes": "match=exact; distance=0"}, {"id": "PMC11722600_02_AS4", "label": "Ileum", "type": "AnatomicalSite", "attributes": "match=exact; distance=0"}, {"id": "PMC11722600_02_AS5", "label": "Peritoneum", "type": "AnatomicalSite", "attributes": "match=exact; distance=0"}, {"id": "PMC11722600_02_AS6", "label": "Omentum", "type": "AnatomicalSite", "attributes": "match=exact; distance=0"}, {"id": "PMC11722600_02_AS7", "label": "Pelvis", "type": "AnatomicalSite", "attributes": "match=exact; distance=0"}, {"id": "PMC11722600_02_AS8", "label": "Cells", "type": "AnatomicalSite", "attributes": "match=exact; distance=0"}, {"id": "PMC11722600_02_AS9", "label": "Epithelial Cells", "type": "AnatomicalSite", "attributes": "match=exact; distance=0"}, {"id": "PMC11722600_02_D1", "label": "Appendicitis", "type": "Diagnosis", "attributes": "match=exact; distance=0"}, {"id": "PMC11722600_02_D2", "label": "Endometriosis", "type": "Diagnosis", "attributes": "match=exact; distance=0"}, {"id": "PMC11722600_02_E1", "label": "Physical Examination", "type": "Exam", "attributes": "match=exact; distance=0"}, {"id": "PMC11722600_02_E2", "label": "Laparoscopy", "type": "Exam", "attributes": "match=exact; distance=0"}, {"id": "PMC11722600_02_F1", "label": "inflammatory process in RIF adhered to the anterior and lat", "type": "Finding", "attributes": ""}, n was irregular, with fever, increased abdominal pain, tachycardia, and rising acute phase reactants, leading to exploratory laparoscopy which revealed inflammatory process in RIF adhered to the anterior and lateral parietal peritoneum involving the cecum, terminal ileum, and greater omentum.", "19": "Histopathological examination showed a cecal appendix with a coprolite inside its lumen and chronic inflammatory process, with endometrial glands lined by cylindrical cells without atypia in the muscular and serosal layers, lined by normal columnar epithelial cells, a classic histological feature of endometriosis; these were surrounded by fusocellular stromal cells with a spindle shape that resembles the endometrial stroma found in the uterine lining with foci of recent bleeding, that indicates hemorrhage associated with endometrial activity in ectopic location; no malignant lesions were found (Image 6A, Image 6B, Image 7)."}}, "PMC11723754_01": {"patient": "age=0.0; gender=Male", "text": "Seven-month-old elsewhere operated case of traumatic spinal cord injury (cause: fall from height) with neurogenic bowel and bladder with Grade III pressure injury over sacral region. Sensory level T10, motor level T10, NLI: T10. AIS grade A.\r\nDimensions of Grade III PIs over sacral region: 7cmx3cm. Daily cleaning and dressing of the wounds were done under aseptic conditions. During the course of his hospitalisation, three weeks post admission, the patient developed a fall in blood pressure along with increased respiratory rate. The condition of the patient was assessed and fluid resuscitation was started in the ward itself. There was no improvement in his BP despite fluid resuscitation, due to which inotropic drugs were started to maintain BP and to prevent multiple organ dysfunction syndrome (MODS). Renal function tests showed deranged electrolytes and raised creatinine. The patient was assessed and qSOFA was calculated as two. The patient was transferred to the ICU for further care and was diagnosed with septicaemia with septic shock. He underwent PRBC transfusion in view of low Hb 7g/dl. Patient was treated aggressively with fluid resuscitation, with strict input output monitoring, inotropic Noradrenaline. On day 3, inotrope support was weaned off, his condition improved and he was stable. Appropriate antibiotic medication was administered as per sensitivity reports after calculating creatinine clearance. After stabilisation in ICU, he was then managed in the PMR ward during which renal and liver function tests normalised, total count decreased, blood and urine cultures were sterile. NPD was applied over his sacral PI following which considerable improvement was noted which has been shown in Figure 7. Standing with support in walking frame, strengthening exercises were taught to the patient. Patient was discharged with stable vitals, healthy pressure injuries having granulation tissue and a decreased surface area. Patient was given bilateral hip knee ankle foot orthosis (HKAFO) for therapeutic standing and home-based neurorehabilitation program.", "nodes": [{"id": "PMC11723754_01_AS1", "label": "Spinal Cord", "type": "AnatomicalSite", "attributes": "match=exact; distance=0"}, {"id": "PMC11723754_01_AS2", "label": "Sacrococcygeal Region", "type": "AnatomicalSite", "attributes": "match=exact; distance=0"}, {"id": "PMC11723754_01_AS3", "label": "Blood", "type": "AnatomicalSite", "attributes": "match=exact; distance=0"}, {"id": "PMC11723754_01_AS4", "label": "Urine", "type": "AnatomicalSite", "attributes": "match=exact; distance=0"}, {"id": "PMC11723754_01_AS5", "label": "Granulation Tissue", "type": "AnatomicalSite", "attributes": "match=exact; distance=0"}, {"id": "PMC11723754_01_AS6", "label": "Hip", "type": "AnatomicalSite", "attributes": "match=exact; distance=0"}, {"id": "PMC11723754_01_AS7", "label": "Knee", "type": "AnatomicalSite", "attributes": "match=exact; distance=0"}, {"id": "PMC11723754_01_AS8", "label": "Ankle", "type": "Anatom
