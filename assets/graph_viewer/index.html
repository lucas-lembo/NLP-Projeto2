22, 244, 249, "PERFORMED_ON", "NONE", 0.002], [8, 415, 422, 272, 277, "PERFORMED_ON", "NONE", 0.002], [8, 415, 422, 377, 382, "PERFORMED_ON", "NONE", 0.06], [8, 415, 422, 409, 414, "PERFORMED_ON", "PERFORMED_ON", 0.994]], "PMC7519975_01_E1|PMC7519975_01_S2": [[1, 9, 19, 179, 191, "NONE", "REVEALS", 0.983]]}, "sentences": {"1": "Computed tomography (CT) of the abdomen revealed several loops of small bowel in the right side of the abdomen with thickening immediately adjacent to the VP shunt concerning for inflammation of the bowel (Figure 1).", "8": "Her preoperative laboratory values were as follows: white blood cell count 5300 per microliter of blood, hemoglobin 8.2 grams/deciliter, platelet 98000 per microliter of blood, prothrombin time 16.1 seconds, international normalized ratio 1.2, serum sodium 148 meq/liter, serum potassium 3.7 meq/liter, chloride 112 meq/liter, BUN 17 mg/deciliter, creatinine 0.4 mg/deciliter, serum glucose 125 mg/deciliter, serum calcium 8.2 mg/deciliter, magnesium 2.4 gm/deciliter, aspartate transaminase 32 units per liter, and alanine transaminase 43 units per liter."}}, "PMC7718649_01": {"patient": "age=65.0; gender=Female", "text": "The patient is a 65-year-old woman with well-controlled SLE. Her long-term treatment for SLE is prednisone (10 mg p.o., once daily) and hydroxychloroquine (0.2 g p.o., twice daily). She lived 6 miles away from Huanan Seafood Wholesale Market where was the earliest epidemic focus of COVID-19 in Wuhan. She had neither been to the market nor closely contacted with confirmed or suspected COVID-19 patients.\r\nOn January 22, 2020, the patient presented fever (peak value: 39 C) with chills, rigor, muscular soreness and fatigue. She coughed with small amount of white sputum occasionally. Sometimes, she felt suffocated after movements. The next day, she developed nausea, anorexia, heartburn and diarrhea (liquid stool, three times per day). On January 25, she visited the clinic for the first time and was given oral medicines (oseltamivir 75 mg twice daily, arbidol 0.3 g twice daily, moxifloxacin 0.4 g once daily and Lianhuaqingwen capsules 1.4 g three times daily). The dosage of prednisone and hydroxychloroquine remained the same as her usually used.\r\nAfter taking the aforementioned drugs for 7 days, the patients' symptoms did not improve and returned to the clinic. The outpatient doctor took nasopharyngeal swabs to test SARS-CoV-2 and influenza A virus by real-time reverse transcription polymerase chain reaction (rRT-PCR), both of which were positive. At the same time, her thoracic CT showed bilateral patchy ground-glass opacities (according to the medical records, images not available). Hence, human immunoglobulin was given intravenously (IVIg, 5 g once daily) with the aforementioned oral medicines and increased dose of prednisone (25 mg once daily) for 5 days since February 4. Intravenous immunoglobulin is immunoglobulin G made from healthy human plasma, and low dose of IVIg was used for nonspecific and wide-spectrum antiviral and antibacterial therapies.\r\nOn February 8, the patient' symptoms were relieved partially, but the second thoracic CT showed pulmonary lesions extension (according to the medical records, images not available). Laboratory tests found leucocytosis (11.09 x 109/L), neutrophilic leucocytosis (9.46 x 109/L) and normal lymphocyte count (1.33 x 109/L) (Table 1). Then, the patient was admitted to fever ward of Sino-French New City Branch of Tongji Hospital, a designated hospital for diagnosis and treatment of COVID-19 in Wuhan.\r\nOn admission, the patient presented with mild coughing. Physical examination revealed that the conscious of the patient was clear, temperature was 37.1 C, blood pressure was 136/74 mmHg, pulse rate was 77 beats per minute, respiratory rate was 18 breaths per minute and peripheral oxygen saturation under oxygen inhalation (3 L/min) through nasal catheter was 98%. The results of laboratory examinations were presented in Table 1. White blood cell count, neutrophilic granulocyte count and lymphocyte count were normal. Several inflammatory indicators were high. Mild injuries of kidney, myocardium, liver and coagulation function were observed. M. pneumoniae infection was found by serology (Figure 1). Glycosylated hemoglobin was 7.1%, and postprandial blood sugar was higher than 11.1 mmol/L. Routine tests of stool and urine samples were normal.\r\nThe patient was diagnosed of SLE combined with COVID-19, influenza A, M. pneumoniae infection and diabetes mellitus. Prednisone (25 mg p.o., once daily) and hydroxychloroquine (0.2 g p.o., twice daily) were given to cover the concurrence of SLE and COVID-19. Pantoprazole (40 mg p.o., once daily) was used to prevent gastric mucosal injury caused by prednisone. Levofloxacin (0.5 g p.o., once daily) was given to deal with bacterial and M. pneumoniae infection. Then, acarbose (50 mg before lunch and dinner daily) was applied to control the blood glucose.\r\nOn the 6th day of hospitalization, the symptoms of the patient eased. Thoracic CT (February 14, 2020) showed bilateral ground-glass, patchy and cord-like shadows (Figure 2a), which was better than the second CT (February 8, 2020) before admission (according to the medical records). On the 8th day of hospitalization, some laboratory examinations were retested, and most of which were improved (Table 1). Dosage of prednisone was reduced to 15 mg once daily as pneumonia improved.\r\nOn day 15 of hospitalization, laboratory tests revealed that most of the values were better than previous tests (Table 1). Inflammatory indicators such as serum ferritin, high-sensitivity C-reactive protein (hsCRP), erythrocyte sedimentation rate (ESR) and interleukin-6 were lower. Subgroup typing of lymphocytes represented elevation of CD4+ T cells (1517/muL) and reduction of CD8+ T cell (252/muL). The ratio of helper T cell versus suppressor T cell was elevated (6.01). The thoracic CT (February 23, 2020) showed a modest upturn in the lesions (Figure 2b). The dosage of prednisone was then reduced to 10 mg once daily as pneumonia improved. Nasopharyngeal swabs were collected for rRT-PCR of SARS-CoV-2 on day 16 and 18, both of which were negative. Two days later (day 20), the patient developed wrist pain, and loxoprofen (60 mg p.o., twice daily) was used to alleviate it.\r\nOn day 22 of hospitalization, no symptoms of the patient were observed. Laboratory findings (Table 1) and thoracic CT (Figure 2c) indicated improvement relative to last time. The rRT-PCR of SARS-CoV-2 of the third nasopharyngeal swab was still negative. Serum immunoglobulin M (IgM) and immunoglobulin G (IgG) of SARS-CoV-2 were 33.73 AU/mL (normal range: <=10 AU/mL) and 198.77 AU/mL (normal range: <=10 AU/mL), respectively. Since the patient met the criteria of discharge (temperature came back to normal for over 3 days, respiratory symptoms significantly improved, thoracic radiology showed obvious improvement in acute exudative lesions and negative results of rRT-PCR of SARS-CoV-2 for two nasal pharyngeal swabs over 24 h), she was discharged on March 4, 2020. She has been in good health without any symptoms after discharge.\r\n Ethical statements: This study was approved by the Ethics Committee of Tongji hospital, Huazhong University of Science and Technology. All the materials of the patient were anonymous and written informed consent was waived by the ethics committee.", "nodes": [{"id": "PMC7718649_01_AS1", "label": "Sputum", "type": "AnatomicalSite", "attributes": "match=exact; distance=0"}, {"id": "PMC7718649_01_AS10", "label": "Lymphocytes", "type": "AnatomicalSite", "attributes": "match=exact; distance=0"}, {"id": "PMC7718649_01_AS11", "label": "Cells", "type": "AnatomicalSite", "attributes": "match=exact; distance=0"}, {"id": "PMC7718649_01_AS12", "label": "Wrist", "type": "AnatomicalSite", "attributes": "match=exact; distance=0"}, {"id": "PMC7718649_01_AS13", "label": "Back", "type": "AnatomicalSite", "attributes AU/mL (normal range: <=10 AU/mL), respectively."}}, "PMC8627357_01": {"patient": "age=36.0; gender=Male", "text": "A 36-year-old HIV-negative male with a history of methamphetamine and intravenous heroin use initially presented to an outside facility with left upper extremity cellulitis and dyspnea one week prior to admission. At the outside facility, a computed tomography (CT) of the left upper extremity revealed cellulitic changes with concerns for gas formation. He was transferred due to the need for a higher level of care. Upon arrival, a physical exam revealed the patient in mild distress with bilateral rhonchial breath sounds, extensive edema, and erythema of the left upper extremity without crepitus. Initial laboratory analysis was remarkable for WBC 15.07 k/mm3, a urine drug screen positive for amphetamines and opiates, and methicillin-resistant Staphylococcus aureus growth in the blood cultures. Repeat CT of the left upper extremity revealed soft tissue swelling without gaseous formations. Chest X-ray revealed bilateral diffuse infiltrates. Intravenous vancomycin, clindamycin, and piperacillin-tazobactam were initiated. However, due to increasing respiratory distress and acute hypoxia to 88% via pulse oximetry, the patient was intubated and placed on ventilator support. A CT chest without contrast revealed diffuse consolidative processes, cavitation foci, diffuse mediastinal and axillary lymphadenopathy, pleural effusions, and areas concerning for septic emboli (see Figure 1).\r\nOrthopedic surgery was consulted for debridement of the left upper extremity; however, debridement was delayed due to patient instability. Transthoracic echocardiogram revealed no valvular vegetations. A transesophageal echocardiogram was performed that revealed no valvular abnormalities as well (see Figure 2). Upon culture and sensitivity results, the antibiotics were changed to ceftaroline, gentamicin, and linezolid for presumed IE according to Duke's criteria in the absence of valvular vegetations.\r\nIn the following days, the patient had a secondary spontaneous PTX (see Figure 3) requiring surgical chest tube placement, paralytic usage in addition to renal replacement therapy due to worsening acidosis and uremia. Following the initial placement of the surgical chest tube, a subsequent PTX (see Figure 3) occurred, requiring an additional surgical chest tube to be placed with the resolution of the PTX. Two days following the removal of the first chest tube, the patient spontaneously had the development of large subcutaneous emphysema spreading of the anterior thorax that was improved with increasing the wall suction of the existing chest tube (see Figure 4). After a course of hemodialysis, lung-protective ventilation, neuromuscular blockade, and antibiotic management, a tracheostomy and percutaneous endoscopic gastrostomy were performed, and the patient was downgraded from the intensive care unit to a step-down unit with chest tubes to water seal. The patient was subsequently discharged to a rehabilitation facility.", "nodes": [{"id": "PMC8627357_01_AS1", "label": "Upper Extremity", "type": "AnatomicalSite", "attributes": "match=exact; distance=0"}, {"id": "PMC8627357_01_AS2", "label": "Urine", "type": "AnatomicalSite", "attributes": "match=exact; distance=0"}, {"id": "PMC8627357_01_AS3", "label": "Blood", "type": "AnatomicalSite", "attributes": "match=exact; distance=0"}, {"id": "PMC8627357_01_AS4", "label": "Tissues", "type": "AnatomicalSite", "attributes": "match=fuzzy; distance=1"}, {"id": "PMC8627357_01_AS5", "label": "Thorax", "type": "AnatomicalSite", "attributes": "match=exact; distance=0"}, {"id": "PMC8627357_01_AS6", "label": "Lung", "type": "AnatomicalSite", "attributes": "match=exact; distance=0"}, {"id": "PMC8627357_01_D1", "label": "Lymphadenopathy", "type": "Diagnosis", "attributes": "match=exact; distance=0"}, {"id": "PMC8627357_01_D2", "label": "Acidosis", "type": "Diagnosis", "attributes": "match=exact; distance=0"}, {"id  "PMC8627357_01_T12", "r1": [], "r2": ["TREATED_BY"], "p": 0.83, "ent": true}], "mentions": {"PMC8627357_01_E1|PMC8627357_01_AS1": [[1, 36, 46, 64, 79, "PERFORMED_ON", "PERFORMED_ON", 0.973]], "PMC8627357_01_E1|PMC8627357_01_S1": [[1, 36, 46, 89, 99, "REVEALS", "REVEALS", 0.999]], "PMC8627357_01_T1|PMC8627357_01_AS2": [[4, 97, 109, 66, 71, "TARGETS", "TARGETS", 0.968]], "PMC8627357_01_T2|PMC8627357_01_AS2": [[4, 127, 138, 66, 71, "TARGETS", "TARGETS", 0.92]], "PMC8627357_01_T1|PMC8627357_01_AS3": [[4, 97, 109, 185, 190, "TARGETS", "NONE", 0.084]], "PMC8627357_01_T2|PMC8627357_01_AS3": [[4, 127, 138, 185, 190, "TARGETS", "NONE", 0.336]], "PMC8627357_01_T7|PMC8627357_01_AS1": [[10, 0, 18, 61, 76, "TARGETS", "TARGETS", 0.774]], "PMC8627357_01_T13|PMC8627357_01_AS6": [[17, 18, 30, 32, 36, "TARGETS", "NONE", 0.107]], "PMC8627357_01_T14|PMC8627357_01_AS6": [[17, 114, 126, 32, 36, "TARGETS", "NONE", 0.102]], "PMC8627357_01_T15|PMC8627357_01_AS6": [[17, 223, 237, 32, 36, "TARGETS", "NONE", 0.114]], "PMC8627357_01_E2|PMC8627357_01_S5": [[8, 83, 91, 58, 65, "NONE", "REVEALS", 0.854]], "PMC8627357_01_D2|PMC8627357_01_T12": [[14, 197, 205, 154, 179, "NONE", "TREATED_BY", 0.871]], "PMC8627357_01_D3|PMC8627357_01_T12": [[14, 210, 216, 154, 179, "NONE", "TREATED_BY", 0.83]]}, "sentences": {"1": "At the outside facility, a computed tomography (CT) of the left upper extremity revealed cellulitic changes with concerns for gas formation.", "4": "Initial laboratory analysis was remarkable for WBC 15.07 k/mm3, a urine drug screen positive for amphetamines and opiates, and methicillin-resistant Staphylococcus aureus growth in the blood cultures.", "8": "However, due to increasing respiratory distress and acute hypoxia to 88% via pulse oximetry, the patient was intubated and placed on ventilator support.", "10": "Orthopedic surgery was consulted for debridement of the left upper extremity; however, debridement was delayed due to patient instability.", "14": "In the following days, the patient had a secondary spontaneous PTX (see Figure 3) requiring surgical chest tube placement, paralytic usage in addition to renal replacement therapy due to worsening acidosis and uremia.", "17": "After a course of hemodialysis, lung-protective ventilation, neuromuscular blockade, and antibiotic management, a tracheostomy and percutaneous endoscopic gastrostomy were performed, and the patient was downgraded from the intensive care unit to a step-down unit with chest tubes to water seal."}}, "PMC9387390_01": {"patient": "age=57.0; gender=Male", "text": "A 57-year-old man with no significant past medical or surgical history initially presented with postprandial abdominal fullness and diarrhea. Computed tomography (CT) imaging showed nonspecific mesenteric edema. An upper gastrointestinal (UGI) contrast study and barium enema were unremarkable. Approximately three months later, a repeat CT of the abdomen demonstrated a central mesenteric mass abutting the pancreas, encasing the superior mesenteric vessels, causing extrinsic narrowing of the second portion of the duodenum.\r\nThe patient underwent CT guided biopsy of the mass; this was consistent with invasive moderately to poorly differentiated adenocarcinoma, thought to have arisen from the upper gastrointestinal tract and/or pancreaticobiliary tract. Given his locally advanced disease, he was nonoperable and started on chemotherapy. Approximately 11 months after the initiation of chemotherapy, he presented to the hospital with nausea, emesis, and abdominal distention. His imaging was consistent with gastroduodenal outlet obstruction secondary to the pancreatic mass (Figure 1).\r\nThe patient underwent laparoscopic gastrojejunostomy (GJ) for palliative bypass by an outside surgeon. This was complicated by an anastomotic leak on postoperative day (POD) 7 and he underwent relaparoscopy. Sutures placed at the GJ were noted to be loose; these were reinforced, intra-abdominal abscesses were drained, and a surgical drain was left in place.\r\nAn UGI study performed on POD 11 (4 days after the re-operation) showed no leak; however, no contrast was noted to empty from the GJ. There was slow emptying of contrast into the duodenum and proximal jejunum. A follow-up CT on POD 14 (7 days after the second operation) revealed distension of the stomach and proximal small intestine, with otherwise improved findings. His nasogastric (NG) tube was replaced with subsequent drainage of > 3 liters of fluid. On POD 16, esophagogastroduodenoscopy (EGD) was performed; per report, the GJ was widely patent without evidence of stricture. Bilious fluid was noted in the stomach.\r\nWith his failure of progression, the patient was then referred to our service for further management. Given clinical suspicion of delayed gastric emptying secondary to long-standing malignant obstruction, a gastrojejunal tube was placed by interventional radiology (POD 21) to allow for long term gastric decompression and possible distal jejunal feeds. The jejunal limb was unable to be placed through the surgically created GJ; it was placed post pyloric into the proximal jejunum. The patient was discharged two days post-procedure (POD 23).\r\nThe patient had two subsequent readmissions for high gastrostomy tube output. A UGI study revealed preferential drainage of contrast into the duodenum; no contrast was seen traversing the GJ. Given our concerns about the location of the jejunal extension, we proceeded with endoscopic placement of a nasojejunal (NJ) tube into the efferent limb of the GJ to allow for complete gastric decompression. EGD (Figure 2) demonstrated a widely patient afferent limb; push enteroscopy showed the jejunal limb of the gastrojejunal tube in the proximal jejunum. The efferent limb was subsequently intubated, and a NJ tube was placed. It was noted to be sharply angulated which was thought to be contributing to a functional obstruction and delayed gastric emptying. The patient was discharged with gastric decompression and NJ feeds.\r\nHe required replacement of this NJ tube multiple times, and due to the findings noted on endoscopy, we considered stent placement into the efferent limb in an attempt to encourage preferential drainage. An AXIOS  stent (20 mm x 10 mm, Boston Scientific, Natick, MA) was placed. After initial symptomatic improvement, recurrent symptoms of delayed gastric emptying prompted a repeat UGI study which showed stent migration. We then placed a through the scope uncovered WallFlex  colonic stent (25 mm x 90 mm, Boston Scientific, Natick, MA) (Figure 3). Four days later, a repeat CT showed a small amount of extraluminal air abutting the stent. A repeat UGI study (Figure 4) revealed markedly improved gastric emptying into the efferent limb through the stent. The patient was discharged home, tolerating gastric tube feeds and oral liquids. He was subsequently ultimately transitioned to hospice care.", "nodes": [{"id": "PMC9387390_01_AS1", "label": "Abdomen", "type": "AnatomicalSite", "attributes": "match=exact; distance=0"}, {"id": "PMC9387390_01_AS2", "label": "Pancreas", "type": "AnatomicalSite", "attributes": "match=exact; distance=0"}, {"id": "PMC9387390_01_AS3", "label": "Duodenum", "type": "AnatomicalSite", "attributes": "match=exact; distance=0"}, {"id": "PMC9387390_01_AS4", "label": "Upper Gastrointestinal Tract", "type": "AnatomicalSite", "attributes": "match=exact; distance=0"}, {"id": "PMC9387390_01_AS5", "label": "Jejunum", "type": "AnatomicalSite", "attributes": "match=exact; distance=0"}, {"id": "PMC9387390_01_AS6", "label": "Stomach", "type": "AnatomicalSite", "attributes": "match=exact; distance=0"}, {"id": "PMC9387390_01_AS7", "label": "Intestines", "type": "AnatomicalSite", "attributes": "match=fuzzy; distance=1"}, {"id": "PMC9387390_01_D1", "label": "Adenocarcinoma", "type": "Diagnosis", "attributes": "match=exact; distance=0"}, {"id": "PMC9387390_01_E1", "label": "Tomography", "type": "Exam", "attributes": "match=exact; distance=0"}, {"i ar-old African American female with an 11-year history of stable postpartum cardiomyopathy (baseline ejection fraction of 30-35%) was referred to the rheumatology clinic due to a previous diagnosis of SLE.\r\nHer rheumatic disease history extends two years backward when she developed bilateral finger pain, ulcers, and drainage. The patient was evaluated extensively; a transthoracic echocardiogram did not show evidence of infective endocarditis and an upper extremity angiogram showed scattered microocclusion of the bilateral fingers; flow did not respond to nitroglycerin. The patient developed a left index fingertip abscess for which incision and drainage were performed, followed by amputation.\r\nLaboratory testing was notable for positive Antinuclear Antibody (ANA) by immunofluorescence assay (IFA) 1 : 1280 in a speckled pattern, positive Chromatin, SSA, Smith, and U1-RNP antibodies with elevated IgG levels of 2317 mg/dL. Furthermore, work up showed normal C3 and C4 complements with negative anti-dsDNA and anti-RNA polymerase III. The vasculitis workup was negative for antineutrophil cytoplasmic cntibodies (ANCA), antiproteinase-3 (PR3), antimyeloperoxidase antibodies (MPO), and cryoglobulins. Antiphospholipid antibodies including lupus anticoagulant, anti-beta-2-glycoprotein, and anticardiolipin were negative inflammatory markers were elevated; erythrocyte sedimentation rate (ESR) was 77 mm, and C-reactive protein (CRP) was 6.2 mg/dL. On physical examination, she had no skin thickening or other features of scleroderma.\r\nOverall, our initial impression was of digital vasculitis secondary to systemic lupus erythematosus. The patient was started on hydroxychloroquine 300 mg daily (3.9 mg/kg/day), and she was advised to start mycophenolate mofetil. However, the patient chose to not start this medication, and she was lost to follow-up at our institution without a further discussion about other therapeutic options.\r\nShe represented to our institution one year later with significant weight loss from 227 to 135 bounds (l bs). Her physical examination showed progressive alopecia and a hypopigmented rash across her chest. Evaluation of her outside labs showed a progressive rise in her serum creatinine to 2.14 mg/dL from a baseline of 1.0 mg/dL. Repeated serologies showed low C3 (61 mg/dL), ESR 90 mm, and urine protein/creatinine 0.36. The serum hydroxychloroquine level was 1232.1 ng/ml (in SLE, the target blood hydroxychloroquine level is around 1000 ng/mL). The ophthalmological exam at that time was normal. The patient was referred to nephrology and the hydroxychloroquine dose was dropped to 200 mg daily (3.1 mg/kg/day). Due to progressive kidney injury and a significant serologic profile of the patient, a kidney biopsy was conducted and showed vascular changes consistent with malignant hypertension and chronic thrombotic microangiopathy (TMA). Further testing, including pulmonary function testing, revealed a forced vital capacity (FVC) of 78%, forced expiratory volume 1 (FEV1) of 83%, and FEV1/FVC of 107% of predicted. The diffusing capacity for carbon monoxide (DLCO) was noted to be low, at 37% of the predicted. High-resolution computed tomography (HRCT) scan of the chest did not show evidence of interstitial lung disease (ILD). The course was further complicated by sepsis and acute on chronic kidney injury secondary to enteropathogenic E. coli in the stool. Additional workup showed ADAMTS 13 activity <5%, inhibitors 125%, and NT-ProBNP 995 pg/mL. Mycophenolate mofetil (MMF) was prescribed for systemic lupus with failure to thrive and chronic TMA secondary to the ADAMSTS 13 inhibitor.\r\nFurther workup for possible pulmonary hypertension was completed. A ventilation-perfusion (V/Q) scan showed no abnormalities, transthoracic echocardiography showed severe biventricular hypertrophy, and cardiac magnetic resonance imaging (MRI) showed no evidence of infiltrative cardiomyopathy. Her antihypertensive regimen was adjusted.\r\nSix months later, the patient continued to complain of shortness of breath and dyspnea with exertion. A repeat HRCT of the chest showed no interstitial changes but noted a new, large pericardial effusion for which the patient was admitted. The patient noted missing about 1.5 weeks of mycophenolate mofetil due to a lack of insurance coverage. Electrocardiogram (EKG) showed normal sinus rhythm with QT prolongation, QTc 527 ms, and a transthoracic echocardiogram showed worsening Left ventricular ejection fraction (LVEF) to 10%, pericardiocentesis yielded 860 ml of exudative serous fluid, cultures, and cytology were negative for infectious etiologies and malignancy. C3 was 67 and C4 was 17 mg/dL. Right heart catheterization with endomyocardial biopsy was done; no evidence of pulmonary hypertension was noted. Endomyocardial biopsy showed no features of myocarditis but demonstrated occasional curvilinear bodies with myelin figures and enlarged mitochondria (Figures 1(a) and 1(b)) consistent with hydroxychloroquine-induced cardiomyopathy on electron microscopy. The serum hydroxychloroquine level was 274 ng/ml at the time of biopsy. Hydroxychloroquine was stopped and the patient is currently being maintained on MMF and low-dose prednisone with improvement in her symptoms.", "nodes": [{"id": "PMC9529523_01_AS1", "label": "Fingers", "type": "AnatomicalSite", "attributes": "match=fuzzy; distance=1"}, {"id": "PMC9529523_01_AS10", "label": "Myelin Sheath", "type": "AnatomicalSite", "attributes": "match=exact; distance=0"}, {"id": "PMC9529523_01_AS11", "label": "Mitochondria", "type": "AnatomicalSite", "attributes": "match=exact; distance=0"}, {"id": "PMC9529523_01_AS2", "label": "Upper Extremity", "type": "AnatomicalSite", "attributes": "match=exact; distance=0"}, {"id": "PMC9529523_01_AS3", "label": "Skin", "type": "AnatomicalSite", "attributes": "match=exact; distance=0"}, {"id": "PMC9529523_01_AS4", "label": "Serum", "type": "AnatomicalSite", "attributes": "match=exact; distance=0" lateral fingers; flow did not respond to nitroglycerin.", "6": "The vasculitis workup was negative for antineutrophil cytoplasmic cntibodies (ANCA), antiproteinase-3 (PR3), antimyeloperoxidase antibodies (MPO), and cryoglobulins.", "8": "On physical examination, she had no skin thickening or other features of scleroderma.", "13": "Her physical examination showed progressive alopecia and a hypopigmented rash across her chest.", "14": "Evaluation of her outside labs showed a progressive rise in her serum creatinine to 2.14 mg/dL from a baseline of 1.0 mg/dL.", "15": "Repeated serologies showed low C3 (61 mg/dL), ESR 90 mm, and urine protein/creatinine 0.36.", "16": "The serum hydroxychloroquine level was 1232.1 ng/ml (in SLE, the target blood hydroxychloroquine level is around 1000 ng/mL).", "19": "Due to progressive kidney injury and a significant serologic profile of the patient, a kidney biopsy was conducted and showed vascular changes consistent with malignant hypertension and chronic thrombotic microangiopathy (TMA).", "22": "High-resolution computed tomography (HRCT) scan of the chest did not show evidence of interstitial lung disease (ILD).", "27": "A ventilation-perfusion (V/Q) scan showed no abnormalities, transthoracic echocardiography showed severe biventricular hypertrophy, and cardiac magnetic resonance imaging (MRI) showed no evidence of infiltrative cardiomyopathy.", "34": "Right heart catheterization with endomyocardial biopsy was done; no evidence of pulmonary hypertension was noted.", "35": "Endomyocardial biopsy showed no features of myocarditis but demonstrated occasional curvilinear bodies with myelin figures and enlarged mitochondria (Figures 1(a) and 1(b)) consistent with hydroxychloroquine-induced cardiomyopathy on electron microscopy.", "36": "The serum hydroxychloroquine level was 274 ng/ml at the time of biopsy."}}, "PMC9532611_01": {"patient": "age=12.0; gender=Female", "text": "In the first family, the index patient (patient 1) was a 12-year-old female-phenotype patient who presented with hypokalemic (1.8 mmol/l) weakness that was accompanied by hypertension (138/94 mmHg). She was born after an uneventful pregnancy and was the first child in the family. Her height was 142 cm and her weight was 44 kg. She had Tanner stage 1 breasts, pubic hair, and no axillary hair. Her external genitalia were female type, but with infantilism. She had three younger siblings, all with female external genitalia. All siblings of the index case were asymptomatic and no other family member had a similar history of hypertension and periodic paralysis. But, the third (karyotype 46, XY, patient 2) and fourth (karyotype 46, XX, patient 3) children were twins and had hypertension on examination (Table 1). At the age of 4 years, the proband had undergone surgery at the local hospital for an inguinal hernia on the left side. Regrettably, no pathological analysis of these tissues was performed.", "nodes": [{"id": "PMC9532611_01_AS1", "label": "Hair", "type": "AnatomicalSite", "attributes": "match=exact; distance=0"}, {"id": "PMC9532611_01_AS2", "label": "Genitalia", "type": "AnatomicalSite", "attributes": "match=exact; distance=0"}, {"id": "PMC9532611_01_AS3", "label": "Tissues", "type": "AnatomicalSite", "attributes": "match=exact; distance=0"}, {"id": "PMC9532611_01_D1", "label": "Hypertension", "type": "Diagnosis", "attributes": "match=exact; distance=0"}, {"id": "PMC9532611_01_H1", "label": "Hypertension", "type": "History", "attributes": "category=diagnosis"}, {"id": "PMC9532611_01_H2", "label": "Paralysis", "type": "History", "attributes": "category=symptom"}, {"id": "PMC9532611_01_P1", "label": "case PMC9532611_01", "type": "Patient", "attributes": "age=12.0; gender=Female"}, {"id": "PMC9532611_01_S1", "label": "Hernia", "type": "Symptom", "attributes": "match=exact; distance=0"}], "edges": [{"s": "PMC9532611_01_P1", "t": "PMC9532611_01_D1", "r1": ["DIAGNOSED_WITH"], "r2": ["DIAGNOSED_WITH"], "p": null, "ent": false}, {"s": "PMC9532611_01_P1", "t": "PMC9532611_01_H1", "r1": ["HAS_HISTORY"], "r2": ["HAS_HISTORY"], "p": null, "ent": false}, {"s": "PMC9532611_01_P1", "t": "PMC9532611_01_H2", "r1": ["HAS_HISTORY"], "r2": ["HAS_HISTORY"], "p": null, "ent": false}, {"s": "PMC9532611_01_P1", "t": "PMC9532611_01_S1", "r1": ["PRESENTS_WITH"], "r2": ["PRESENTS_WITH"], "p": null, "ent": false}], "mentions": {}, "sentences": {}}, "PMC9532611_02": {"patient": "age=6.0; gender=Female", "text": "In the second kindred, a 6-year-old child (patient 4) with female phenotype presented for incidentally diagnosed increased blood pressure during a school health check. Her weight and height were 49 kg (3 SDs above the mean) and 136 cm (2 SDs above the mean), respectively. The bone age of patient 4 was approximately 6 years. In kindred 3 (patient 5), the parents noted that the child had with a vulva, but no vagina. However, testicular masses were palpable in the respective inguinal regions. The child underwent surgical exploration, which revealed that a vagina was absent and right and left masses were confirmed to be testes.\r\nBlood tests were performed according to standard methods. Blood hormone, Adrenocorticotropic hormone (ACTH), plasma renin activity (PRA), aldosterone (ALD), 17alpha-hydroxyprogesterone (17OHP) AMH (anti-Mullerian hormone), and inhibin B (INB) were measured by chemiluminescence; cortisol (F) was measured by electrochemiluminescence; dihydrotestosterone (DHT), and androstenedione (AD) were measured by liquid chromatography-mass spectrometry; dehydroepiandrosterone (DHEA), luteinizing hormone (LH), follicle-stimulating hormone (FSH), estradiol (E2), testosterone (T), progesterone (P), and prolactin (PRL) levels were measured by enzyme-linked immunosorbent assay (Table 1).\r\nWith the consent of the patient's parents, we collected the peripheral blood of the patients and their parents in three families. In addition, in family 1, peripheral blood of the proband's sister was collected. Later, DNA was extracted, next-generation sequencing (NGS) sequencing was performed for the probands. The observed variants in the probands were confirmed and the family members were screened for the respective variants by Sanger's method. A minimum of 3 mug DNA was used to prepare indexed Illumina libraries (MyGenostics, Beijing, China), according to the manufacturer's protocol. The exons of genes associated with congenital adrenal hyperplasia (all the genes including ABCD1 AIRE ARMC5 CDKN1C CYP11A1 CYP11B1 CYP11B2 CYP17A1 CYP21A2 DHCR7 GK GK2 GLCCI1 GNAS H6PD HESX1 HSD11B1 HSD3B2 LHX4 MC2R MCM4 MEN1 MKS1 MRAP NNT NR0B1 NR3C1 NR5A1 PCSK1 PDE11A PDE8B POMC POR PRKACA PRKAR1A PROP1 REN RXRA RXRB SOX3 STAR TBX19 TP53 TXNRD2) were targeted via a gene capture strategy, using the GenCap custom enrichment kit (MyGenostics), according to the manufacturer's protocol. The enriched libraries were sequenced on a NextSeq 500 sequencer (Illumina, San Diego, CA, USA) to generate paired-end reads of 150 bp. Single-nucleotide polymorphisms, insertions, and deletions were identified using Genome Analysis Toolkit software.", "nodes": [{"id": "PMC9532611_02_AS1", "label": "Vulva", "type": "AnatomicalSite", "attributes": "match=exact; distance=0"}, {"id": "PMC9532611_02_AS2", "label": "Vagina", "type": "AnatomicalSite", "attributes": "match=exact; distance=0"}, {"id": "PMC9532611_02_AS3", "label": "Blood", "type": "AnatomicalSite", "attributes": "match=exact; distance=0"}, {"id": "PMC9532611_02_AS4", "label": "Plasma", "type": "AnatomicalSite", "attributes": "match=exact; distance=0"}, {"id": "PMC9532611_02_E1", "label": "Blood Pressure", "type": "Exam", "attributes": "match=exact; distance=0"}, {"id": "PMC9532611_02_P1", "label": "case PMC9532611_02", "type": "Patient", "attributes": "age=6.0; gender=Female"}, {"id": "PMC9532611_02_S1", "label": "Hyperplasia", "type": "Symptom", "attributes": "match=exact; distance=0"}, {"id": "PMC9532611_02_T1", "label": "Adrenocorticotropic Hormone", "t {"s": "PMC9532611_02_P1", "t": "PMC9532611_02_S1", "r1": ["PRESENTS_WITH"], "r2": ["PRESENTS_WITH"], "p": null, "ent": false}], "mentions": {"PMC9532611_02_T1|PMC9532611_02_AS3": [[7, 15, 42, 0, 5, "TARGETS", "TARGETS", 0.999]], "PMC9532611_02_T2|PMC9532611_02_AS3": [[7, 58, 63, 0, 5, "TARGETS", "TARGETS", 0.598]], "PMC9532611_02_T3|PMC9532611_02_AS3": [[7, 80, 91, 0, 5, "TARGETS", "NONE", 0.239]], "PMC9532611_02_T4|PMC9532611_02_AS3": [[7, 140, 162, 0, 5, "TARGETS", "NONE", 0.056]], "PMC9532611_02_T1|PMC9532611_02_AS4": [[7, 15, 42, 51, 57, "TARGETS", "TARGETS", 0.985]], "PMC9532611_02_T2|PMC9532611_02_AS4": [[7, 58, 63, 51, 57, "TARGETS", "TARGETS", 0.995]], "PMC9532611_02_T3|PMC9532611_02_AS4": [[7, 80, 91, 51, 57, "TARGETS", "NONE", 0.169]], "PMC9532611_02_T4|PMC9532611_02_AS4": [[7, 140, 162, 51, 57, "TARGETS", "NONE", 0.115]], "PMC9532611_02_T5|PMC9532611_02_AS4": [[7, 276, 295, 51, 57, "TARGETS", "NONE", 0.012]], "PMC9532611_02_T6|PMC9532611_02_AS4": [[7, 307, 322, 51, 57, "TARGETS", "NONE", 0.011]]}, "sentences": {"7": "Blood hormone, Adrenocorticotropic hormone (ACTH), plasma renin activity (PRA), aldosterone (ALD), 17alpha-hydroxyprogesterone (17OHP) AMH (anti-Mullerian hormone), and inhibin B (INB) were measured by chemiluminescence; cortisol (F) was measured by electrochemiluminescence; dihydrotestosterone (DHT), and androstenedione (AD) were measured by liquid chromatography-mass spectrometry; dehydroepiandrosterone (DHEA), luteinizing hormone (LH), follicle-stimulating hormone (FSH), estradiol (E2), testosterone (T), progesterone (P), and prolactin (PRL) levels were measured by enzyme-linked immunosorbent assay (Table 1)."}}, "PMC9650410_01": {"patient": "age=67.0; gender=Female", "text": "Many in organization studies and business ethics will be familiar with the rise and fall of Theranos:a biotech company started by Elizabeth Holmes that hit a 9-billion-dollar valuation just before leadership was indicted on charges of fraud. The story is one that obviously demonstrates several important lessons regarding deception in Silicon Valley, transparency in leadership, and the corrupting power of greed. We believe there is also a story of CH-MI here9. Though there are dozens of individual cases we could explore, the most glaring is that of Ian Gibbons, the late biochemist and chief scientist at Theranos. We argue that Gibbons was a good chemist. In striving to maintain the standards of his practice within a vicious institution, he met his untimely death. As we trace the Theranos story, it is worth noting that we will be primarily using the reporting and narrative of Carreyrou at The Wall Street Journal. Carreyrou published dozens of articles on Theranos between 2014 and 2019, including the original expose that ousted the company. He is also the author of Bad Blood: Secrets and Lies in a Silicon Valley Startup Carreyrou, which presents the entire Theranos story from inception to collapse.\r\nThe idea for Theranos began with CEO and founder, Elizabeth Holmes in 2003. She dropped out of Stanford to pursue the dream of revolutionizing healthcare by using small fingerpricks of blood to run hundreds of diagnostic tests on a portable machine. By 2010, Holmes was able to secure nearly 100 million dollars in venture capital and built an impressive board of directors. She was able to do so because she presented an inspiring mission. Her product would, she claimed, make preventive care affordable and accessible to the masses. Holmes championed Theranos in this way:as an agent for health equity. As she explained in an interview with Bill Clinton,\r\nOur work is in the belief that the access to healthcare information is a basic human right. [...] Health data needs to be accessible to people before they get sick. [...] Our work is in being able to make lab testing accessible in time for therapy to be effected and to do that in a way where every person irrespective of their insurance status, irrespective of where they live, can afford the ability to get a test done (Holmes,).\r\nTheranos supposedly existed for this purpose:to expand access to needed health care. Though this purpose was communicated in interviews and pitches, Theranos was never actually a company that principally sought to expand access to health. In truth, Holmes had a very different mission:to be a billionaire (Carreyrou,, p. 11). This is where the vicious formation of the institution began:at the beginning and with the wrong end. She sought exponential growth over and above actually developing an innovative product in biotechnology that would contribute to human flourishing and the common good.\r\nThis end:becoming a billionaire:colored the way Holmes led and managed everything at Theranos. This is, after all, the usefulness of final ends (Frankfurt,). They inform, guide, and direct our actions, and they do so regardless of whether the appropriate final ends are pursued. Holmes made extraordinary claims about the capabilities and possibilities of the technology that could not be supported by her chemists or engineers. She carefully created silos to ensure that employees did not understand the full scope of the project's development. She held outrageous expectations for her workers, sometimes demanding departments to run 24/7. She treated employees as disposable linchpins, quickly discarding those who did not fall in line. Even worse, she would punish those who challenged the morality of her actions by firing them, demoting them, or ceasing to give them pertinent information. \"She was so laser-focused on achieving her goals that she seemed oblivious to the practical implications of her decisions\" (Carreyrou,, p. 26). Indeed, Holmes would pursue whatever means necessary to make her billionaire vision a reality. Vice was not merely excused. It was expected.\r\nMoreover, Holmes's myopic billionaire vision effectively marginalized the two \"core\" practices vital to the success of her project:biochemistry and engineering. She hired excellent scientists who were trained at Cambridge and Ivy League institutions. However, Holmes did not want them to be excellent scientists. She wanted technocrats to create her product for the sake of maximizing profitability. Holmes insisted that \"the Edison\":the machine that Theranos was working on to conduct the blood tests:had to be portable and had to use only a small droplet of blood. She was uncompromising in these demands because she already promised them to investors. She did this without really understanding whether they were scientifically possible. When the evidence repeatedly showed that more than a droplet of blood was needed to conduct the tests, she barreled forward with more vigor. It was as if she hoped to yield a successful test by sheer force of will. When her teams did not produce the desired answers, she shrouded their results in secrecy. She kept moving things forward:scheduling clinical trials and seeking partnerships with drug stores:though the technology was not ready or working accurately. Holmes settled for the guise of success in the lab, not excellent science.\r\nIt was within this highly vicious structure at Theranos that Ian Gibbons worked as the Director of Chemistry. Carreyrou develops an exceptional character sketch of Gibbons during his time at Theranos, explaining that Gibbons was known for his dedication to and love of his craft (p. 281). \"He was passionate about the science of blood testing and loved to teach it. In the company's early years, he would sometimes hold little lectures to educate the rest of the staff about the fundamentals of biochemistry\" (Carreyrou,, p. 281). Most importantly, Gibbons had high standards of excellence. He was uncompromising in not making concessions or cutting corners that would somehow endanger the veracity of test results and subordinate concern for patients to the product itself. He was tireless in his conviction that things \"must be done right\" (Carreyrou,, p. 202). Gibbons was, in fact, a chemist who pursued excellence in his practice, and he was beloved by his coworkers and his dear wife.\r\nAs a result, many things at Theranos troubled him. He was open about his frustrations with Holmes's management, particularly the intentional silos she created, the secrecy, and the exaggerations about the technology's readiness. He expressed frustration to a co-worker when Theranos moved forward with pursuing a partnership with Walgreens, implementing Theranos clinics at their neighborhood pharmacies. The technology was not ready; it did not work. Gibbons's willingness to vocalize the truth about the science threatened the secrecy Holmes worked hard to maintain. She did not want his expert opinion, even though his job was to do precisely that:to provide his expert opinion. When Holmes caught wind that Gibbons was discussing these realities with coworkers, she attempted to fire him. However, his expertise proved invaluable, and he was offered another role at the company without the same access to information and authority in his craft. He took the demotion, hoping he could continue doing what he loved in some worthwhile capacity.\r\nWhen Gibbons was re-hired and demoted at Theranos, he was effectively silenced and removed from the lab. He started working from home as a mere technical consultant, remaining steadfast in his commitment to excellence. The new Director of Chemistry was much more willing to compromise in places where Gibbons would not relent. However, Gibbons was still committed to the task, arguing for hours over the phone about the importance of accurate testing and how anything less than excellent results would negatively impact patient wellbeing. His unwavering pursuit of standards rendered him a defunct chemist at a company he knew to be deceitful.\r\nThe circumstances were horrible, so why didn't he just leave? At this point, Gibbons was 67 years old, he had recently been diagnosed with cancer, and he was battling undiagnosed depression. As Carreyrou explains, he felt it was unlikely that he would be able to secure another job as a chemist if he left Theranos (p. 204). Things just kept getting worse from here for Gibbons. He was called to a deposition in a case regarding several Theranos patents, and this forced him into a corner. He had two choices: lie and perjure himself about the nature and origin of the patents, or break an NDA with Theranos and face Holmes's wrath. It was a heavy moral and existential predicament, and Gibbons saw no way out. Theranos attorneys kept pressuring him to lie, to push back the deposition, to use his cancer as an excuse to evade court, and so on. But this did not mesh with Gibbons's character. He was not a liar, but if he were to go on, he also needed a job and health insurance. This acute MI at the end of his long chronic struggle at Theranos weighed on Gibbons heavily. Linking this instance to Figure 1, it is worth emphasizing here that this is a case of experiencing CH-MI and A-MI in tandem. In the midst of this painful dilemma, Gibbons tragically took his own life. Theranos leadership barely spoke of it after he had been with the company for 10 years and produced most of the patents that they had secured. Rather than conveying her remorse to his wife, Holmes told her that Gibbons's laptop and corporate documents belonged to Theranos and that she needed to return them to the company promptly.\r\nIn looking at the story of Ian Gibbons and his time at Theranos, it is easy to see the marginalization of practices on display. Holmes vigorously pursued a billion-dollar valuation at the expense of scientific integrity. She hired particularly excellent scientists and demanded that they sacrifice their commitment to excellence for the sake of Theranos and its feigned success. Chemists and engineers at Theranos were expected to betray the standards of the scientific community. In fact, they were expected to not care about them at all. One could argue that Gibbons was so deeply habituated as an excellent chemist that he could not simply betray those standards for Theranos. His virtuous desires could not be deformed by the Weberian manager. Instead, during his last few years at Theranos, Gibbons was forced into a position of silent protest, enduring the stress of significant cognitive dissonance. There is a particular sort of pain when someone like Gibbons:a practitioner committed to excellence in his practice:is pressured to comply with vice as a worker in a poorly formed institution. We describe this pain as CH-MI.\r\nIt is easy look at this case study and draw the conclusion that such circumstances are rare:to hold up the example of Elizabeth Holmes as a fanatical egomaniac. Likewise, it is easy to hold up the example of Theranos as an exceptionally disingenuous start-up. Following MacIntyre's critique, perhaps this isn't so. Perhaps there are more lawyers being thwarted the opportunity to work for justice, doctors being thwarted the opportunity to work for health, and chemists being thwarted the opportunity to uphold the standards of scientific method than we are comfortable knowing. Holmes's persona and the structure she implemented at Theranos were, after all, openly borrowed from Steve Jobs. She captivated Silicon Valley because she was familiar:tenacious, cold, and obsessed with success. The secrecy and results-driven demands that characterized the Theranos culture were easily dismissed and excused because of how closely they mirrored the norm. Thus, we conclude that the setting ripe for CH-MI is common and pervasive.", "nodes": [{"id": "PMC9650410_01_AS1", "label": "Blood", "type": "AnatomicalSite", "attributes": "match=exact; distance=0"}, {"id": "PMC9650410_01_AS2", "label": "Face", "type": "AnatomicalSite", "attributes": "match=exact; distance=0"}, {"id": "PMC9650410_01_AS3", "label": "Back", "type": "AnatomicalSite", "attributes": "match=exact; distance=0"}, {"id": "PMC9650410_01_D1", "label": "Neoplasms", "type": "Diagnosis", "attributes": "match=exact; distance=0"}, {"id": "PMC9650410_01_E1", "label": "Diagnostic Tests, Routine", "type": "Exam", "attributes": "match=exact; distance=0"}, {"id": "PMC9650410_01_P1", "label": "case PMC9650410_01", "type": "Patient", "attributes": "age=67.0; gender=Female"}, {"id": "PMC9650410_01_S1", "label": "Death", "type": "Symptom", "attributes": "match=exact; distance=0"}, {"id": "PMC9650410_01_S2", "label": "Pain", "type": "Symptom", "attributes": "match=exact; distance=0"}, {"id": "PMC9650410_01_T1", "label": "Silicon", "type": "Treatment", "attributes": "match=exact; distance=0"}], "edges": [{"s": "PMC9650410_01_P1", "t": "PMC9650410_01_T1", "r1": ["UNDERWENT_TREATMENT"], "r2": ["UNDERWENT_TREATMENT"], "p": null, "ent": false}, {"s": "PMC9650410_01_P1", "t": "PMC9650410_01_S1", "r1": ["PRESENTS_WITH"], "r2": ["PRESENTS_WITH"], "p": null, "ent": false}, {"s": "PMC9650410_01_T1", "t": "PMC9650410_01_AS1", "r1": ["TARGETS"], "r2": [], "p": null, "ent": true}, {"s": "PMC9650410_01_P1", "t": "PMC9650410_01_E1", "r1": ["UNDERWENT_EXAM"], "r2": ["UNDERWENT_EXAM"], "p": null, "ent": false}, {"s": "PMC9650410_01_E1", "t": "PMC9650410_01_AS1", "r1": ["PERFORMED_ON"], "r2": [], "p": null, "ent": true}, {"s": "PMC9650410_01_P1", "t": "PMC9650410_01_D1", "r1": ["DIAGNOSED_WITH"], "r2": ["DIAGNOSED_WITH"], "p": null, "ent": false}, {"s": "PMC9650410_01_D1", "t": "PMC9650410_01_AS3", "r1": ["LOCATED_IN"], "r2": ["LOCATED_IN"], "p": 0.601, "ent": true}, {"s": "PMC9650410_01_P1", "t": "PMC9650410_01_S2", "r1": ["PRESENTS_WITH"], "r2": ["PRESENTS_WITH"], "p": null, "ent": false}], "mentions": {"PMC9650410_01_T1|PMC9650410_01_AS1": [[8, 58, 65, 29, 34, "TARGETS", "NONE", 0.355]], "PMC9650410_01_E1|PMC9650410_01_AS1": [[10, 134, 150, 109, 114, "PERFORMED_ON", "NONE", 0.418]], "PMC9650410_01_D1|PMC9650410_01_AS3": [[72, 87, 93, 55, 59, "LOCATED_IN", "LOCATED_IN", 0.601]]}, "sentences": {"8": "He is also the author of Bad Blood: Secrets and Lies in a Silicon Valley Startup Carreyrou, which presents the entire Theranos story from inception to collapse.", "10": "She dropped out of Stanford to pursue the dream of revolutionizing healthcare by using small fingerpricks of blood to run hundreds of diagnostic tests on a portable machine.", "72": "Theranos attorneys kept pressuring him to lie, to push back the deposition, to use his cancer as an excuse to evade court, and so on."}}, "PMC9815523_01": {"patient": "age=40.0; gender=Unknown", "text": "A total of 115 patients with pUEDVT were included and divided into three distinct treatment strategies; A conservative treatment group (group 1, N = 35), an invasive treatment group (Group 2, N = 53) and a cross-over group of patients treated surgically after a first period of conservative therapy (Group 3, N = 27). The mean ages among all three groups were between 30 and 40 years old. The side of the affected arm and the percentage of patients with effort induced thrombosis (Paget-Schroetter syndrome) were similar in all groups. The median follow-up was between 36, 26, 22 months for groups 1-3 respectively (Table 1).\r\nTen patients (22.2%) received additional diagnostic imaging (CTv, MRv or angiography) besides duplex scanning to determine the etiology of the thrombosis. Six patients (13.3%) were diagnosed with vTOS, four (8.9%) with idiopathic thrombosis. In the remaining 35 patients (77.8%) no additional imaging of the thoracic outlet was performed and thus no distinction in pUEDVT etiology could be made. However, we ensured that no factors for sUEDVT such as indwelling vascular devices, malignancies or limb immobilization were present in these patients. Forty-four patients (97.8%) were treated with antithrombotics; 25 DOAC, 18 vitamin K antagonist, one antiplatelet therapy. One patient only received physical therapy focused on posture improvement without additional medicinal therapy (Table 1). There was a wide variation in duration of antithrombotic therapy ranging from six weeks to 94 months with a median length of six months (IQR 23.5 months). Sixteen patients (35.6%) were symptom free at last follow-up (median 36 months), the remaining 29 patients had persisting or recurrent symptoms (N = 22) or recurrent thrombosis (N = 7). Ten of these patients were eventually treated surgically and were included as cross-over patients of group 3 for the postoperative follow-up. Three patients suffered bleeding complications under DOAC usage; one patient had frequent but mild epistaxis (Grade 1), one had severe menorrhagia (Grade 2) and ceased anticoagulation therapy, the third patient required a blood transfusion due to severe vaginal blood loss (Grade 3) but continued anticoagulation therapy afterwards. The only patient who required a reintervention was the patient treated with physical therapy. Because of persisting symptoms a TOD and PTA was performed leading to full symptom resolution.\r\nIn group 2, five treatment categories could be distinguished. The majority of patients were treated with surgery; 31 patients (58%) with CDT followed by TOD, 14 patients (26%) with anticoagulant therapy followed by staged TOD, and five patients (9%) with TOD only. Three patients did not primarily undergo surgery but received intravenous stent placement (N = 2; 4%) or CDT only (N = 1; 2%). Additionally, 44 patients (83%) received some form of post procedural anticoagulation therapy for a median duration of six months (IQR 10.5 months); 22 patients with DOACs, 19 with vitamin K antagonists, one with low-molecular weight heparin, and two with antiplatelet therapy.\r\nAfter primary treatment, 24 patients were symptom free and 29 patients had recurrent or persisting symptoms. Seven patients suffered an ipsilateral recurrent thrombosis, the remaining 22 patients were symptomatic without recurrent thrombosis (Table 2). In 14 of these symptomatic patients a total of 23 reinterventions were performed leading to symptom resolution in an additional five patients (Table 3). The majority of reinterventions were PTA's for symptomatic recurrent stenosis (N = 10, 12 PTA's). Three patients underwent a redo TOD; two because of an insufficiently removed first rib and one because of an accidental second rib removal during primary intervention. The patient primarily treated with CDT was relieved of symptoms after TOD. The two primarily stented patients both suffered a stent fracture and were treated with TOD and PTA leading to full symptom resolution. Finally, in three patients with PTA resistant stenosis stents were placed, leading to full symptom resolution in two. The third patient was additionally treated with a pectoralis minor release and finally a subclavian vein bypass, but remained symptomatic. Two patients (4%) suffered postoperative bleeding complications (Grade 2 & 3). Both were surgical explored without finding a clear bleeding focus. Six additional surgery related complications occurred in five patients, none led to long-term morbidity (Table 4).\r\nGroup 3 contained 10 cross-over patients previously mentioned under group 1 and 17 patients with recurrent symptoms who were referred to our hospitals for further analysis of VTOS. All 27 patients were originally treated conservatively with anticoagulants but experienced either persisting or recurrent symptoms. Thirteen patients suffered a recurrent thrombosis, (five while under anticoagulation therapy) and 14 patients had persisting or recurrent symptoms without thrombosis. Twenty-one patients were treated with vitamin K antagonists and six with a DOAC, for a median duration of 13 months prior to surgical intervention. All patients underwent dedicated diagnostic imaging (CTv, MRv or angiography) to confirm VTOS, after which TOD was performed. Eighteen patients received postoperative anticoagulation therapy for a median duration of 2 months (Table 1). Eleven patients remained symptom free after primary surgical intervention, but 16 patients had persisting symptoms (N = 12) or suffered recurrent thrombosis (N = 4) (Table 2). Six of these patients underwent additional reinterventions leading to full symptom resolution in two patients, and 13 symptom free patients in total (48.1%) at last follow-up. Bleeding complications occurred in five patients; One patient had a bleeding complication after CDT (Grade 2) and four patients suffered a haematothorax (three grade 2, one Grade 3) of which three required surgical exploration and one was treated with a chest drain. Finally, one patient developed a pneumonia that required antibiotic treatment (Table 4).", "nodes": [{"id": "PMC9815523_01_AS1", "label": "Arm", "type": "AnatomicalSite", "attributes": "match=exact; distance=0"}, {"id": "PMC9815523_01_AS2", "label": "Blood", "type": "AnatomicalSite", "attributes": "match=exact; distance=0"}, {"id": "PMC9815523_01_AS3", "label": "Pectoralis Muscles", "type": "AnatomicalSite", "attributes": "match=exact; distance=0"}, {"id": "PMC9815523_01_AS4", "label": "Subclavian Vein", "type": "AnatomicalSite", "attributes": "match=exact; distance=0"}, {"id": "PMC9815523_01_D1", "label": "Thrombosis", "type": "Diagnosis", "attributes": "match=exact; distance=0"}, {"id": "PMC9815523_01_D2", "label": "Pneumonia", "type": "Diagnosis", "attributes": "match=exact; distance=0"}, {"id": "PMC9815523_01_E1", "label": "Diagnostic Imaging", "type": "Exam", "attributes": "match=exact; distance=0"}, {"id": "PMC9815523_01_E2", "label": "Angiography", "type": "Exam", "attributes": "match=exact; distance=0"}, {"id": "PMC9815523_01_P1", "label": "case PMC9815523_01", "type": "Patient", "attributes": "age=40.0; gender=Unknown"}, {"id": "PMC9815523_01_S1", "label": "Syndrome", "type": "Symptom", "attributes": "match=exact; distance=0"}, {"id": "PMC9815523_01_S2", "label": "Epistaxis", "type": "Symptom", "attributes": "match=exact; distance=0"}, {"id": "PMC9815523_01_S3", "label": "Menorrhagia", "type": "Symptom", "attributes": "match=exact; distance=0"}, {"id": "PMC9815523_01_T1", "label": "Conserva ces": {"2": "The side of the affected arm and the percentage of patients with effort induced thrombosis (Paget-Schroetter syndrome) were similar in all groups.", "4": "Ten patients (22.2%) received additional diagnostic imaging (CTv, MRv or angiography) besides duplex scanning to determine the etiology of the thrombosis.", "13": "Three patients suffered bleeding complications under DOAC usage; one patient had frequent but mild epistaxis (Grade 1), one had severe menorrhagia (Grade 2) and ceased anticoagulation therapy, the third patient required a blood transfusion due to severe vaginal blood loss (Grade 3) but continued anticoagulation therapy afterwards."}}, "PMC9969157_01": {"patient": "age=7.0; gender=Male", "text": "This baby boy was born at 33 2/7 weeks gestational age to a 36-year-old gravida 3, para 3 mother with negative serologies, except for Group B Streptococcus unknown, whose pregnancy was complicated by medication-controlled gestational diabetes and gestational hypertension, and a family history significant for a sibling with LCHADD. The patient was delivered by cesarean section at an outside facility due to concern for serious maternal morbidity associated with preeclampsia, specifically HELLP syndrome. Neonatal resuscitation was unremarkable and the Appearance, Pulse, Grimace, Activity, and Respiration (APGAR)s were 8 and 9 at 1 and 5 min, respectively. The birth weight was 2.46 kg, length 47.5 cm, and head circumference 32.5 cm, which were all appropriate for gestational age. The patient was admitted to the level III NICU at the birth facility. A peripheral intravenous line was placed and 10% dextrose fluids at 150 ml/kg/day were initiated. At six hours of life, based on the significant family history and the maternal HELLP syndrome frequently seen in mothers with gestations complicated by LCHADD, our patient was transported to our level IV NICU for metabolic consultation and further evaluation and management. On admission, serum acylcarnitine profile was consistent with LCHADD given elevation of C16-OH and C18-OH levels with the ultimate diagnosis based on perinatal and family history in conjunction with biochemical and molecular studies (Table 1). Echocardiogram shortly after arrival showed a small patent ductus arteriosus and patent foramen ovale. Enteral nutrition with donor human milk was initiated at 12 h of life. Triheptanoin was initiated at 14 h of life at a dose of 0.5 g/kg/day and advanced 0.5 g/kg every 5-7 days. As feeds were advanced by unit standard of 20 ml/kg/day, he was limited to 23 ml/kg/day of human milk with the remainder of his enteral diet consisting of Enfaport (Chicago, IL, United States), SolCarb (Westbury, NY, United States), and Similac liquid protein fortifier (Abbott Park, IL, United States) formulas (Table 2). His feeds were fortified to 24 kcal/oz on day of life 6. On day 7 of life, the patient started to have new bradycardia and desaturation episodes with two small emeses but a reassuring abdominal examination. Enteral nutrition was continued. On day 9 of life, he had one episode of emesis and then hematochezia. An abdominal x-ray (Figure 1) demonstrated pneumatosis intestinalis and he was subsequently diagnosed with NEC (modified Bell Stage IIa). He was managed conservatively with bowel rest, ampicillin-sulbactam and gentamicin for 7 days, and bowel decompression for 5 days. He was maintained on total parental nutrition (TPN) with 4 g/kg/day TrophAmine, glucose infusion rate ~15 mg/kg/min, and 2 g/kg/day 20% Intralipid. Diet following re-initiation of enteral nutrition consisted of a combination of skimmed and full fat maternal and donor human milk, Enfaport, MCT oil instead of triheptanoin (per parental request), SolCarb, and Similac liquid protein fortifier (Figure 2). He recovered uneventfully and was discharged home on day 33 of life.", "nodes": [{"id": "PMC9969157_01_AS1", "label": "Head", "type": "AnatomicalSite", "attributes": "match=exact; distance=0"}, {"id": "PMC996     if (view === "p1") {

      k.r2.forEach(r => push(e, r, !colorize ? "plain" : k.common.includes(r) ? "both" : k.changed ? "changed" : "onlyp2", probLabel(e, r)));

    { selector: 'node[type="Patient"]', style: { "width": 50, "height": 50, "font-size": 10, "font-weight": "bold" } },
    { selector: "edge", style: {
        "label": "data(label)", "font-size": 7, "color": "#64748b", "curve-style": "bezier", "target-arrow-shape": "triangle", "arrow-scale": 0.9,
        "width": 1.4, "line-color": "#cbd5e1", "target-arrow-color": "#cbd5e1",
        "text-rotation": "autorotate", "text-background-color": "#f8fafc", "text-background-opacity": 0.85, "text-background-padding": 1 } },
    { selector: "edge[prob]", style: { "width": e => 1 + 4 * e.data("prob") } },
    ...["struct", "plain", "both", "onlyp1", "onlyp2", "changed"].map(cls => ({
      selector: `edge.${cls}`, style: { "line-color": DIFF[cls], "target-arrow-color": DIFF[cls] } })),
    { selector: "edge.struct", style: { "color": "#94a3b8" } },
    { selector: "edge.onlyp1", style: { "line-style": "dashed", "line-dash-pattern": [6, 3] } },
    { selector: ".faded", style: { "opacity": 0.12 } },
    { selector: "edge.hl", style: { "underlay-color": "#facc15", "underlay-opacity": 0.45, "underlay-padding": 3, "z-index": 10, "font-size": 9, "color": "#1e293b" } },
    { selector: "node.hl", style: { "underlay-color": "#facc15", "underlay-opacity": 0.45, "underlay-padding": 5 } },
  ];
}

// ---------- montagem dos painéis ----------
const VIEWS = {
  side: [["p1", "Projeto 1 · regras", true], ["p2", `Projeto 2 · classificador (${MODEL})`, true]],
  diff: [["diff", "Diferença P1 × P2", true]],
  p1: [["p1", "Projeto 1 · regras", false]],
  p2: [["p2", `Projeto 2 · classificador (${MODEL})`, false]],
};

function render() {
  const c = DATA[state.caseId];
  const pos = positions(c);
  panes.forEach(p => p.cy.destroy());
  panes = [];
  const views = VIEWS[state.mode];
  $("pane-b").style.display = views.length > 1 ? "" : "none";
  views.forEach(([view, caption, colorize], i) => {
    const suffix = i === 0 ? "a" : "b";
    $(`caption-${suffix}`).textContent = caption;
    const cy = cytoscape({
      container: $(`cy-${suffix}`),
      elements: { nodes: nodeElements(c), edges: edgeElements(c, view, colorize) },
      style: baseStyle(),
      layout: { name: "preset", positions: n => pos[n.id()], fit: true, padding: 30 },
    });
    panes.push({ cy, view, colorize });
    cy.on("tap", "edge", ev => select({ pair: ev.target.data("pair") }));
    cy.on("tap", "node", ev => select({ node: ev.target.id() }));
    cy.on("tap", ev => { if (ev.target === cy) select(null); });
  });
  syncViewports();
  updateSide();
}

// pan/zoom sincronizados entre os dois painéis
function syncViewports() {
  if (panes.length < 2) return;
  // só copia quando o outro painel está diferente: evita um painel reemitir para o outro sem fim
  const close = (a, b) => Math.abs(a - b) < 1e-6;
  panes.forEach((p, i) => p.cy.on("viewport", () => {
    const other = panes[1 - i].cy;
    const z = p.cy.zoom(), pan = p.cy.pan(), op = other.pan();
    if (close(z, other.zoom()) && close(pan.x, op.x) && close(pan.y, op.y)) return;
    other.viewport({ zoom: z, pan: { x: pan.x, y: pan.y } });
  }));
  panes[1].cy.viewport({ zoom: panes[0].cy.zoom(), pan: { ...panes[0].cy.pan() } });
}

// troca só as arestas (limiar), sem mexer no layout nem no zoom
function refreshEdges() {
  const c = DATA[state.caseId];
  panes.forEach(p => {
    p.cy.edges().remove();
    p.cy.add(edgeElements(c, p.view, p.colorize));
  });
  if (current) applyHighlight();
  updateSide();
}

// ---------- seleção e destaque ----------
let current = null;
function select(sel) {
  current = sel;
  applyHighlight();
  showDetails();
}
function applyHighlight() {
  panes.forEach(({ cy }) => {
    cy.elements().removeClass("hl faded");
    if (!current) return;
    let focus;
    if (current.pair) {
      const edges = cy.edges().filter(e => e.data("pair") === current.pair);
      const [s, t] = current.pair.split("|");
      focus = edges.union(cy.$id(s)).union(cy.$id(t));
      edges.addClass("hl");
    } else {
      const node = cy.$id(current.node);
      focus = node.closedNeighborhood();
      node.addClass("hl");
    }
    if (focus.length) cy.elements().not(focus).addClass("faded");
  });
}

function nodeById(id) { return DATA[state.caseId].nodes.find(n => n.id === id); }
function nodeName(n) { return `${esc(n.type)} · <b>${esc(n.label)}</b>`; }

function highlightSentence(text, spans) {
  const sorted = [...spans].sort((a, b) => a[0] - b[0]);
  let html = "", last = 0;
  for (const [a, b] of sorted) {
    if (a < last) continue;
    html += esc(text.slice(last, a)) + "<mark>" + esc(text.slice(a, b)) + "</mark>";
    last = b;
  }
  return html + esc(text.slice(last));
}

function showDetails() {
  const box = $("details");
  const c = DATA[state.caseId];
  if (!current) { box.innerHTML = '<span class="hint">Clique numa aresta para ver as frases e a probabilidade, ou num nó para ver os atributos.</span>'; return; }

  if (current.node) {
    const n = nodeById(current.node);
    const deg = g => c.edges.filter(e => e.ent && (e.s === n.id || e.t === n.id) && (g === 1 ? e.r1 : p2Visible(e)).length).length;
    box.innerHTML = `<div class="pair-title">${nodeName(n)}</div>
      <div class="muted">${esc(n.attributes || "(sem atributos)")}</div>
      <div class="muted">id: ${esc(n.id)}</div>
      <div style="margin-top:6px">Relações entre entidades: P1 <b>${deg(1)}</b> · P2 <b>${deg(2)}</b></div>`;
    return;
  }

  const [s, t] = current.pair.split("|");
  const e = c.edges.find(x => x.s === s && x.t === t);
  const a = nodeById(s), b = nodeById(t);
  const k = compare(e);
  let html = `<div class="pair-title">${nodeName(a)} → ${nodeName(b)}</div>`;
  if (!e.ent) {
    html += `<div class="kv"><b>P1</b><span>${e.r1.join(", ") || "—"}</span><b>P2</b><span>${e.r2.join(", ") || "—"}</span></div>
      <div class="note">Aresta estrutural: o P2 mantém as arestas do P1 que não ligam duas entidades.</div>`;
    box.innerHTML = html;
    return;
  }
  let p2txt;
  if (e.r2.length && k.r2.length) p2txt = `${e.r2.join(", ")} <span class="muted">(prob ${fmt(e.p)})</span>`;
  else if (e.r2.length) p2txt = `<span class="muted">${e.r2.join(", ")} (prob ${fmt(e.p)}) — abaixo do limiar ${fmt(state.thr)}</span>`;
  else p2txt = "— <span class=\"muted\">(sem aresta)</span>";
  html += `<div class="kv"><b>P1</b><span>${e.r1.join(", ") || "— <span class=\"muted\">(sem aresta)</span>"}</span><b>P2</b><span>${p2txt}</span></div>`;

  const pmiKey = [`${a.type}:${a.label}`, `${b.type}:${b.label}`].sort().join("|");
  const pmi = PMI[pmiKey];
  html += `<div class="muted">${pmi ? `PMI no corpus: <b>${pmi[0]}</b> (juntos em ${pmi[1]} casos)` : "Sem associação PMI no corpus para este par."}</div>`;

  const ms = c.mentions[current.pair] || [];
  if (!ms.length) {
    html += `<div class="note">Sem frase candidata: o P2 não avaliou este par (entidades em frases diferentes ou com mais de 30 tokens entre elas).</div>`;
    if (e.r1.includes("TREATED_BY")) html += `<div class="note">No P1, TREATED_BY liga o tratamento ao último diagnóstico visto, mesmo em outra frase.</div>`;
  } else {
    if (e.r1.includes("TREATED_BY") && !ms.some(m => m[5] === "TREATED_BY"))
      html += `<div class="note">O P1 criou TREATED_BY pela regra do último diagnóstico visto, não por estas frases.</div>`;
    const chosen = e.r2.length ? ms.filter(m => m[6] !== "NONE").reduce((best, m) => (!best || m[7] > best[7]) ? m : best, null) : null;
    html += `<div style="margin:8px 0 4px" class="muted">Frases com o par (${ms.length}):</div>`;
    for (const m of ms) {
      const [si, a0, a1, b0, b1, p1l, pred, score] = m;
      const text = c.sentences[String(si)] || "";
      html += `<div class="mention${m === chosen ? " chosen" : ""}">${highlightSentence(text, [[a0, a1], [b0, b1]])}
        <div class="tags">frase ${si} · P1: ${esc(p1l)} · P2: ${esc(pred)} (prob ${fmt(score)})${m === chosen ? " · usada no grafo do P2" : ""}</div></div>`;
    }
  }
  box.innerHTML = html;
}

// ---------- tabelas e painel ----------
function counts(edges) {
  const rows = Object.fromEntries(RELATIONS.map(r => [r, { p1: 0, p2: 0, both: 0 }]));
  for (const e of edges) {
    if (!e.ent) continue;
    const k = compare(e);
    e.r1.forEach(r => rows[r] && rows[r].p1++);
    k.r2.forEach(r => rows[r] && rows[r].p2++);
    k.common.forEach(r => rows[r] && rows[r].both++);
  }
  return rows;
}
function tableHtml(rows) {
  const tot = { p1: 0, p2: 0, both: 0 };
  let body = "";
  for (const r of RELATIONS) {
    const x = rows[r];
    if (!x.p1 && !x.p2) continue;
    tot.p1 += x.p1; tot.p2 += x.p2; tot.both += x.both;
    body += `<tr><td>${r}</td><td>${x.p1}</td><td>${x.p2}</td><td>${x.both}</td><td>${x.p1 - x.both}</td><td>${x.p2 - x.both}</td></tr>`;
  }
  if (!body) return '<span class="hint">Nenhuma relação entre entidades.</span>';
  return `<table><tr><th>relação</th><th>P1</th><th>P2</th><th>ambos</th><th>só P1</th><th>só P2</th></tr>${body}
    <tr class="total"><td>Total</td><td>${tot.p1}</td><td>${tot.p2}</td><td>${tot.both}</td><td>${tot.p1 - tot.both}</td><td>${tot.p2 - tot.both}</td></tr></table>`;
}

function updateSide() {
  const c = DATA[state.caseId];
  $("case-table").innerHTML = tableHtml(counts(c.edges));
  $("global-table").innerHTML = tableHtml(counts(caseIds.flatMap(id => DATA[id].edges))) +
    `<div class="muted" style="margin-top:4px">${caseIds.length} casos${state.thr > 0 ? ` · P2 com prob ≥ ${fmt(state.thr)}` : ""}</div>`;
  const n1 = c.edges.filter(e => e.ent).reduce((n, e) => n + e.r1.length, 0);
  const n2 = c.edges.filter(e => e.ent).reduce((n, e) => n + compare(e).r2.length, 0);
  $("stats").textContent = `${panes[0].cy.nodes().length} nós · relações entre entidades: P1 ${n1}, P2 ${n2}`;
  $("thr-group").style.display = state.mode === "p1" ? "none" : "";
  renderEdgeLegend();
  if (current) showDetails();
}

function renderEdgeLegend() {
  const line = (color, style, text) => `<div class="legend-item"><span class="line" style="border-top-color:${color};border-top-style:${style}"></span>${text}</div>`;
  let html = "";
  if (state.mode === "side" || state.mode === "diff") {
    html += line(DIFF.both, "solid", "nos dois grafos");
    html += line(DIFF.onlyp1, "dashed", "só no P1");
    html += line(DIFF.onlyp2, "solid", "só no P2");
    html += line(DIFF.changed, "solid", "mesmo par, relação diferente");
  }
  if (!state.entOnly) html += line(DIFF.struct, "solid", "estrutural (igual nos dois)");
  if (state.mode !== "p1") html += '<div class="muted" style="margin-top:4px">Espessura da aresta do P2 = probabilidade (1 − P(NONE)).</div>';
  $("edge-legend").innerHTML = html;
}

function setCase(id) {
  state.caseId = id;
  current = null;
  if (location.hash.slice(1) !== id) history.replaceState(null, "", "#" + id);
  $("case-select").value = id;
  const c = DATA[id];
  $("patient-info").textContent = c.patient || "(sem info)";
  $("case-text").textContent = c.text || "";
  render();
  showDetails();
}

// ---------- controles ----------
for (const id of caseIds) {
  const opt = document.createElement("option");
  opt.value = id; opt.textContent = id;
  $("case-select").appendChild(opt);
}
for (const [type, [fill, stroke]] of Object.entries(COLORS)) {
  const div = document.createElement("div");
  div.className = "legend-item";
  div.innerHTML = `<span class="swatch" style="background:${fill};border:1.5px solid ${stroke}"></span>${type}`;
  $("legend").appendChild(div);
}
const step = d => setCase(caseIds[(caseIds.indexOf(state.caseId) + d + caseIds.length) % caseIds.length]);
$("case-select").addEventListener("change", ev => setCase(ev.target.value));
$("prev-btn").addEventListener("click", () => step(-1));
$("next-btn").addEventListener("click", () => step(1));
$("random-btn").addEventListener("click", () => setCase(caseIds[Math.floor(Math.random() * caseIds.length)]));
$("mode-select").addEventListener("change", ev => { state.mode = ev.target.value; render(); applyHighlight(); });
$("layout-select").addEventListener("change", ev => { state.layout = ev.target.value; render(); applyHighlight(); });
$("ent-only").addEventListener("change", ev => { state.entOnly = ev.target.checked; current = null; render(); showDetails(); });
$("thr").addEventListener("input", ev => { state.thr = parseFloat(ev.target.value); $("thr-value").textContent = fmt(state.thr); refreshEdges(); });
window.addEventListener("hashchange", () => { const id = location.hash.slice(1); if (DATA[id] && id !== state.caseId) setCase(id); });

const fromHash = location.hash.slice(1);
setCase(DATA[fromHash] ? fromHash : caseIds[Math.floor(Math.random() * caseIds.length)]);
</script>
</body>
</html>
