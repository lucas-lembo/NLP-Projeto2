S1": [[0, 103, 119, 53, 64, "LOCATED_IN", "LOCATED_IN", 0.503]], "PMC11723754_01_D1|PMC11723754_01_AS2": [[0, 103, 119, 168, 181, "LOCATED_IN", "LOCATED_IN", 0.591]], "PMC11723754_01_E3|PMC11723754_01_AS3": [[15, 87, 107, 143, 148, "PERFORMED_ON", "NONE", 0.053]], "PMC11723754_01_E3|PMC11723754_01_AS4": [[15, 87, 107, 153, 158, "PERFORMED_ON", "NONE", 0.011]], "PMC11723754_01_D2|PMC11723754_01_AS5": [[18, 60, 68, 76, 94, "LOCATED_IN", "LOCATED_IN", 0.997]]}, "sentences": {"0": "Seven-month-old elsewhere operated case of traumatic spinal cord injury (cause: fall from height) with neurogenic bowel and bladder with Grade III pressure injury over sacral region.", "15": "After stabilisation in ICU, he was then managed in the PMR ward during which renal and liver function tests normalised, total count decreased, blood and urine cultures were sterile.", "18": "Patient was discharged with stable vitals, healthy pressure injuries having granulation tissue and a decreased surface area."}}, "PMC11783470_01": {"patient": "age=22.0; gender=Female", "text": "We are presenting a 22-year-old woman with IDA. Patient denied menorrhagia or family history of gastrointestinal malignancy. She denied dysphagia, odynophagia, heartburn, nausea, vomiting, abdominal pain, altered bowel habits, melena, hematochezia, and unintentional weight loss. Vitals signs were normal. Physical examination was unrevealing with the exception of mild conjunctival pallor. Laboratory data: hemoglobin 11.5 g/dL, transferrin saturation 12.8%, ferritin 200 ng/mL, and iron 76 mcg/dL.\r\nDespite the normal ferritin level, the low transferrin saturation <20% was in favor of iron deficiency and the patient underwent esophagogastroduodenoscopy (EGD) and colonoscopy at a different institution for evaluation of IDA. A 7-mm fundic lesion was identified during EGD; the lesion was biopsied and 2 hemostatic clips were placed due to oozing at the biopsy site (Image 1). Biopsy of the gastric lesion demonstrated well-circumscribed proliferation of chief cells arranged in small, tight tubules, consistent with an OGA. Of note, duodenal biopsies did not show features of celiac disease, and ileocolonoscopy did not identify any bleeding source. Following the identification of the OGA, the patient was referred for endoscopic removal. Patient underwent repeat EGD and endoscopic resection was performed successfully. The excised specimen was consistent with the known diagnosis of OGA (Image 2). Given the absence of menorrhagia and negative bidirectional endoscopy, the patient was advised to follow up at the gastroenterology clinic and discuss video capsule endoscopy to exclude small intestinal causes of anemia. Patient underwent repeat EGD after 3 months, and no evidence of recurrence of the OGA was found.", "nodes": [{"id": "PMC11783470_01_AS1", "label": "Conjunctiva", "type": "AnatomicalSite", "attributes": "match=fuzzy; distance=1"}, {"id": "PMC11783470_01_AS2", "label": "Cells", "type": "AnatomicalSite", "attributes": "match=exact; distance=0"}, {"id": "PMC11783470_01_D1", "label": "Celiac Disease", "type": "Diagnosis", "attributes": "match=exact; distance=0"}, {"id": "PMC11783470_01_D2", "label": "Anemia", "type": "Diagnosis", "attributes": "match=exact; distance=0"}, {"id": "PMC11783470_01_E1", "label": "Physical Examination", "type": "Exam", "attributes": "match=exact; distance=0"}, {"id": "PMC11783470_01_E2", "label": "Iron", "type": "Exam", "attributes": "match=exact; distance=0"}, {"id": "PMC11783470_01_E3", "label": "Endoscopy, Digestive System", "type": "Exam", "attributes": "match=exact; distance=0"}, {"id": "PMC11783470_01_E4", "label": "Colonoscopy", "type": "Exam", "attributes": "match=exact; distance=0"}, {"id": "PMC11783470_01_E5", "label": "Biopsy", "type": "Exam", "attributes": "match=exact; distance=0"}, {"id": "PMC11783470_01_E6", "label": "Endoscopy", "type": "Exam", "attributes": "match=exact; distance=0"}, {"id": "PMC11783470_01_E7", "label": "Capsule Endoscopy", "type": "  "t": "PMC11783470_01_D2", "r1": [], "r2": ["REVEALS"], "p": 0.985, "ent": true}], "mentions": {"PMC11783470_01_E1|PMC11783470_01_AS1": [[4, 0, 20, 64, 76, "PERFORMED_ON", "NONE", 0.333]], "PMC11783470_01_E5|PMC11783470_01_AS2": [[8, 0, 6, 84, 89, "PERFORMED_ON", "NONE", 0.371]], "PMC11783470_01_S1|PMC11783470_01_D2": [[13, 21, 32, 213, 219, "SUPPORTS", "SUPPORTS", 0.547]], "PMC11783470_01_E1|PMC11783470_01_S10": [[4, 0, 20, 77, 83, "NONE", "REVEALS", 0.984]], "PMC11783470_01_E6|PMC11783470_01_S1": [[13, 60, 69, 21, 32, "NONE", "EXCLUDES", 0.971]], "PMC11783470_01_E6|PMC11783470_01_D2": [[13, 60, 69, 213, 219, "NONE", "REVEALS", 0.905]], "PMC11783470_01_E7|PMC11783470_01_D2": [[13, 157, 174, 213, 219, "NONE", "REVEALS", 0.985]]}, "sentences": {"4": "Physical examination was unrevealing with the exception of mild conjunctival pallor.", "8": "Biopsy of the gastric lesion demonstrated well-circumscribed proliferation of chief cells arranged in small, tight tubules, consistent with an OGA.", "13": "Given the absence of menorrhagia and negative bidirectional endoscopy, the patient was advised to follow up at the gastroenterology clinic and discuss video capsule endoscopy to exclude small intestinal causes of anemia."}}, "PMC12215201_01": {"patient": "age=56.0; gender=Male", "text": "A 56-year-old Puerto Rican male with no past medical history originally presented to the emergency department with complaints of 2 months of fatigue, swollen abdomen, decreased appetite, and weight loss. He also endorsed pain in his abdomen, which prompted him to seek medical attention. The patient never sought any medical care before this and had no prior similar episodes. His social history was negative for alcohol consumption, smoking tobacco, or use of any intravenous recreational drugs. He used to work as a landscaper at a construction company. His family history was noncontributory.\r\nOn initial assessment, the patient was afebrile, hemodynamically stable, and in no acute distress. Physical examination revealed a diffusely tender and distended abdomen with shifting dullness indicative of ascites. Laboratory results showed hemoglobin 6.1 g/dL, platelet count 63 x 103/mm3, total bilirubin 3.2 mg/dL, alkaline phosphatase 315 IU/L, AST 305 IU/L, ALT 209 IU/L, and albumin 2.6 g/dL. An abdominal ultrasound performed showed multiple solid masses in the liver, the most extensive one measuring 2.5 x 2.7 x 2.1 cm. The spleen was enlarged and infiltrated with various masses, with very little healthy tissue and at least one discrete mass measuring 4.1 x 3.8 x 4.6 cm. He also underwent CT of the abdomen and pelvis with intravenous contrast, which exhibited multiple hypodense lesions in the liver and spleen with the peripheral enhancement of the contrast (Fig. 1) suggestive of metastatic lesions. There was also evidence of involvement of the lung, bilateral kidney, and bones with massive abdominopelvic ascites extending into the presacral region and bilateral pleural effusions.\r\nThe patient received packed red blood cells and platelets for worsening anemia and thrombocytopenia, respectively, during his hospital stay. The patient underwent paracentesis twice with removal of 5.2 L and 6.1 L bloody ascitic fluid. The ascitic fluid protein was 1 g/dL and 2 g/dL with serum ascitic albumin gradient (SAAG) of 1 g/dL and 1.1 g/dL, respectively, indicating exudative ascites. The fluid analysis showed a PMN count >250 with cytology negative for malignant cells. To find the possible primary, a colonoscopy was performed, which was normal. Esophagogastroduodenoscopy demonstrated multiple erythematous nodular lesions in the gastric body (Fig. 2) and duodenum (Fig. 3). However, biopsies from the lesions were inconclusive. Video capsule endoscopy showed numerous metastatic lesions seen throughout the stomach and small bowel. The patient received more platelet transfusions for worsening thrombocytopenia. The patient underwent liver biopsy, which showed small aggregates of anastomosing vascular channels with highly atypical cells suggestive of angiosarcoma (Fig. 4). Tumor cells were positive for CD-34 (Fig. 5) and focally positive for factor VIII (Fig. 6). The patient underwent Pleurx catheter placement for palliative support. He continued to have worsening sanguineous drainage from the catheter. Unfortunately, the patient developed disseminated intravascular coagulation as a complication and suffered a cardiac arrest 2 weeks later following which he could not be revived.", "nodes": [{"id": "PMC12215201_01_AS1", "label": "Abdomen", "type": "AnatomicalSite", "attributes": "match=exact; distance=0"}, {"id": "PMC12215201_01_AS10", "label": "Ascitic Fluid", "type": "AnatomicalSite", "attributes": "match=exact; distance=0"}, {"id": "PMC12215201_01_AS11", "label": "Serum", "type": "AnatomicalSite", "attributes": "match=exact; distance=0"}, {"id": "PMC12215201_01_AS12", "label": "Cells", "type": "AnatomicalSite", "attributes": "match=exact; distance=0"}, {"id": "PMC12215201_01_AS13", "label": "Duodenum", "type": "AnatomicalSite", "attributes": "match=exact; distance=0"}, {"id": "PMC12215201_01_AS14", "label": "Stomach", "type": "AnatomicalSite", "attributes": "match=exact; distance=0"}, {"id": "PMC12215201_01_AS2", "label": "Liver", "type": "AnatomicalSite", "attributes": "match=exact; distance=0"}, {"id": "PMC12215201_01_AS3", "label": "Spleen", "type": "AnatomicalSite", "attributes": "match=exact; distance=0"}, {"id": "PMC12215201_01_AS4", "label": "Tissues", "type": "AnatomicalSite", "attributes": "match=fuzzy; distance=1"}, {"id": "PMC12215201_01_AS5", "label": "Pelvis", "type": "AnatomicalSite", "attributes": "match=exact; distance=0"}, {"id": "PMC12215201_01_AS6", "label": "Lung", "type": "AnatomicalSite", "attributes": "match=exact; distance=0"}, {"id": "PMC12215201_01_AS7", "label": "Kidney", "type": "AnatomicalSite", "attributes": "match=exact; distance=0"}, {"id": "PMC12215201_01_AS8", "label": "Bone and Bones", "type": "AnatomicalSi GETS", "NONE", 0.22]], "PMC12215201_01_E5|PMC12215201_01_AS10": [[14, 22, 34, 80, 93, "PERFORMED_ON", "NONE", 0.184]], "PMC12215201_01_E7|PMC12215201_01_AS13": [[18, 0, 26, 111, 119, "PERFORMED_ON", "NONE", 0.024]], "PMC12215201_01_E8|PMC12215201_01_AS14": [[20, 6, 23, 79, 86, "PERFORMED_ON", "NONE", 0.446]], "PMC12215201_01_E9|PMC12215201_01_AS2": [[22, 28, 34, 22, 27, "PERFORMED_ON", "PERFORMED_ON", 0.996]], "PMC12215201_01_E9|PMC12215201_01_AS12": [[22, 28, 34, 121, 126, "PERFORMED_ON", "NONE", 0.033]], "PMC12215201_01_T3|PMC12215201_01_AS12": [[23, 70, 81, 6, 11, "TARGETS", "TARGETS", 0.877]], "PMC12215201_01_E1|PMC12215201_01_S4": [[7, 0, 20, 108, 115, "NONE", "REVEALS", 0.941]]}, "sentences": {"7": "Physical examination revealed a diffusely tender and distended abdomen with shifting dullness indicative of ascites.", "13": "The patient received packed red blood cells and platelets for worsening anemia and thrombocytopenia, respectively, during his hospital stay.", "14": "The patient underwent paracentesis twice with removal of 5.2 L and 6.1 L bloody ascitic fluid.", "18": "Esophagogastroduodenoscopy demonstrated multiple erythematous nodular lesions in the gastric body (Fig. 2) and duodenum (Fig. 3).", "20": "Video capsule endoscopy showed numerous metastatic lesions seen throughout the stomach and small bowel.", "22": "The patient underwent liver biopsy, which showed small aggregates of anastomosing vascular channels with highly atypical cells suggestive of angiosarcoma (Fig. 4).", "23": "Tumor cells were positive for CD-34 (Fig. 5) and focally positive for factor VIII (Fig. 6)."}}, "PMC12832199_01": {"patient": "age=57.0; gender=Female", "text": "A 57-year-old female with obesity presented to our emergency department with upper abdominal pain and vomiting. She had experienced multiple episodes of vomiting over the preceding 2 days and was unable to maintain adequate oral intake.\r\nShe had a significant medical history of Buerger's disease, which resulted in bilateral below-knee amputations, central adrenal insufficiency managed with corticosteroids, and multiple abdominal surgeries. Three years earlier, she underwent a left hemicolectomy with transverse colostomy for ischemic colitis. Since then, she experienced recurrent stoma prolapse, which required colonic resections and stoma revisions at 1 year and 3 months prior to presentation (Fig. 1).\r\nOn arrival, the abdomen around the stoma was distended with mild tenderness. She was dehydrated and hypoxemic because of aspiration pneumonia. Laboratory investigations revealed leukocytosis (white blood cell count, 26000/muL), anemia (hemoglobin, 9.6 g/dL), hypoalbuminemia (2.8 g/dL), and acute kidney injury (creatinine, 2.2 mg/dL). CT revealed marked gastric distention secondary to incarceration within the parastomal hernial sac, with evidence of gastric outlet obstruction (Fig. 2). The hernial orifice measured 6.5 cm in the craniocaudal direction and 5.5 cm transversely. In addition, pulmonary consolidation consistent with aspiration pneumonia was observed.\r\nAfter stabilization of the patient's general condition with intravenous fluids, nasogastric decompression was achieved via gastric tube placement, and she was started on antibiotic therapy and a proton pump inhibitor. The tube initially drained a large amount of fluid, but the output decreased to a small volume of non-bloody, normal gastric fluid immediately. Her abdominal pain and distension improved, and no peritoneal signs were observed. Laboratory data showed no progression of anemia and improvement in inflammatory markers. Based on these clinical and laboratory findings, we judged that the risk of gastric perforation or ischemic necrosis was low. Therefore, after confirming clinical stability, elective parastomal hernia repair was planned.\r\nGiven her history of multiple colonic resections for stoma prolapse, further colonic resection and relocation of the stoma to the right side would have risked excessive shortening of the colon, potentially leading to a high-output stoma. In addition, we were concerned about the possibility of recurrent stoma prolapse due to sagging of the remaining colon. Considering these factors, the laparoscopic Sugarbaker technique was deemed the most appropriate option to prevent both recurrent parastomal herniation and stoma prolapse. The patient subsequently underwent laparoscopic Sugarbaker repair 18 days after admission.\r\nIntraoperatively, the stomach was drawn into the parastomal hernial sac through traction of the gastrocolic ligament (Fig. 3). Reduction of the incarcerated stomach was challenging; therefore, the left gastrocolic ligament adjacent to the stoma was divided to facilitate reduction. Subsequently, the gastrocolic ligament was further divided, and the stomach was dissected from the mesocolon to maintain a safe distance from the stoma and prevent further traction by the colon. The hernial defect was located on the cranial and medial side of the stoma. The defect was closed using a running barbed suture to eliminate potential space between the abdominal wall and the elevated bowel and mesentery, while avoiding excessive tension to preserve mesenteric perfusion. The closure was performed from the point farthest from the stoma toward the bowel side to allow fine adjustment of tension. Following defect closure, laparoscopic Sugarbaker repair was performed using an intraperitoneal mesh tailored to achieve 5 cm of overlap beyond the suture line and the stoma opening. The mesh also covered the proximal colon, and the portion in contact with the stoma and proximal colon was folded so that the visceral (intraperitoneal) surface faced inward (Fig. 4). Operative time was 191 min with minimal blood loss. Postoperative course was uneventful, and the patient was discharged on POD 12.\r\nEndoscopy performed on day 27 revealed chronic gastritis and linear duodenal ulceration, likely ischemic in origin, and severe esophagitis secondary to reflux. The gastric body and antrum also showed impaired distension, which may be related to the effects of incarceration (Fig. 5). On the CT obtained 2 months postoperatively, no gastric herniation was observed (Fig. 6). Only the elevated colon and its mesentery were seen protruding through the abdominal wall as the stoma, and no recurrence of the parastomal hernia was identified. Although the mesh itself was not clearly visualized, the proximal colon ran along the abdominal wall, which likely represents the appearance of abdominal wall-anchoring achieved by the Sugarbaker technique. No hernia recurrence was observed at 10 months of follow-up.", "nodes": [{"id": "PMC12832199_01_AS1", "label": "Knee", "type": "AnatomicalSite", "attributes": "match=exact; distance=0"}, {"id": "PMC12832199_01_AS10", "label": "Blood", "type": "AnatomicalSite", "attributes": "match=exact; distance=0"}, {"id": "PMC12832199_01_AS2", "label": "Abdomen", "type": "AnatomicalSite", "attributes": "match=exact; distance=0"}, {"id": "PMC12832199_01_AS3", "label": "Colon", "type": "AnatomicalSite", "attributes": "match=exact; distance=0"}, {"id": "PMC12832199_01_AS4", "label": "Stomach", "type": "AnatomicalSite", "attributes": "match=exact; distance=0"}, {"id": "PMC12832199_01_AS5", "label": "Ligaments", "type": "AnatomicalSite", "attributes": "match=fuzzy; distance=1"}, {"id": "PMC12832199_01_AS6", "label": "Mesocolon", "type": "AnatomicalSite", "attributes": "match=exact; distance=0"}, {"id": "PMC12832199_01_AS7", "label": "Abdominal Wall", "type": "AnatomicalSite", "attributes": "match=exact; distance=0"}, {"id": "PMC12832199_01_AS8", "label": "Mesentery", "type": "AnatomicalSite", "attributes": "match=exact; distance=0"}, {"id": "PMC12832199_01_AS9", "label": "Viscera", "type": "AnatomicalSite", "attributes": "match=fuzzy; distance=1"}, {"id": "PMC12832199_01_D1", "label": "Colitis", "type": "Diagnosis", "attributes": "match=exact; distance=0"}, {"id": "PMC12832199_01_D2", "label": "Pneumonia", "t r-old male was admitted to intensive care unit through accident/emergency after a road traffic accident and having sustained multiple injuries.", "3": "He had fracture 3 and 4 cervical vertebra complete transaction of spinal cord at C4 level (quadriplegic); fracture 4, 5, 6 ribs on the right side; and bilateral pneumothorax (bilateral chest tubes inserted); rupture spleen and liver.", "4": "He was taken to the operating room and spleenectomy and hepatic repair were done; and keeping in mind the seriousness of injuries and anticipating long recovery time, the elective surgical tracheostomy was done in operating room.", "10": "Chest radiograph showed opacities in the right lower lung region and large endotracheal cuff shadow [Figure 1].", "11": "Bronchoscopy revealed the fistula and demonstrated the passage of secretions and air.", "13": "Water dye was given through mouth, which was traced into the trachea."}}, "PMC2817501_01": {"patient": "age=53.0; gender=Male", "text": "A-53-year old man admitted to our institution with exertional dyspnea and angina. He had had aortic valve replacement with Starr-Edwards 2320 model caged ball mechanical valve prosthesis in 1974 and suffered a thromboembolic serebrovascular accident two years ago. His physical examination revealed left hemiparesis with blood pressure 120/80 mmHg, heart rate 92 beats/min and regular. Cardiac auscultation revealed a 4/6 systolic murmur and rales were heard at the base of the lungs. Transesophageal echocardiography showed a functioning Starr-Edwards caged ball mechanical prosthesis with 30 mmHg gradient and rheumatic mitral valve disease with peak transmitral gradient of 20 mmHg and valve area 1.8 cm2 and 3-4 degree mitral insufficiency with a left ventricular ejection fraction of 30% with peak pulmonary artery pressure of 68 mmHg, besides there was a pannus formation in the surrounding valvular tissue. Coronary arteriography showed a 90% stenosis at proximal portion of LAD and well functioning caged ball prosthesis (Figure 1). The patient underwent a reoperation of double valve replacement and one vessel coronary artery bypass grafting through a median sternotomy by the help of cardiopulmonary bypass at mild hypothermia. Macroscopic inspection of the excised Starr-Edwards caged ball significant cloth wear and dislodgement were observed inside the struts, showing bare cage metal (Figure 2).\r\nAt reoperation the mitral valve was replaced with a bileaflet prosthesis, St. Jude Medical 29 mm, and an aortotomy was applied because of the previous serebrovascular accident and to examine the pannus formation in the surrounding tissue. After aortotomy we saw that the cloth surrounding the outside was detached from struts and loosened and the Starr-Edwards caged-ball prosthesis was replaced with St. Jude Medical 21 mm bileaflet valve prosthesis to achieve a better hemodynamic performance and a lower INR ratio in the follow-up period. The postoperative course was uneventful. Echocardiogram before discharge confirmed that the prosthetic valves were functioning normally.", "nodes": [{"id": "PMC2817501_01_AS1", "label": "Aortic Valve", "type": "AnatomicalSite", "attributes": "match=exact; distance=0"}, {"id": "PMC2817501_01_AS2", "label": "Mitral Valve", "type": "AnatomicalSite", "attributes": "match=exact; distance=0"}, {"id": "PMC2817501_01_AS3", "label": "Pulmonary Artery", "type": "AnatomicalSite", "attributes": "match=exact; distance=0"}, {"id": "PMC2817501_01_AS4", "label": "Tissues", "type": "AnatomicalSite", "attributes": "match=fuzzy; distance=1"}, {"id": "PMC2817501_01_E1", "label": "Physical Examination", "type": "Exam", "attributes": "match=exact; distance=0"}, {"id": "PMC2817501_01_E2", "label": "Blood Pressure", "type": "Exam", "attributes": "match=exact; distance=0"}, {"id": "PMC2817501_01_E3", "label": "Heart Rate", "type": "Exam", "attributes": "match=exact; distance=0"}, {"id": "PMC2817501_01_E4", "label": "Auscultation", "type": "Exam", "attributes": "match  diagnosis.\r\nUnder general anesthesia, the subcutaneous abscess was incised and drained, and splenectomy was performed simultaneously. The spleen was found to be enlarged, fibrotic, and adherent to the lower chest wall. There was an abscess cavity within the spleen communicating with the subcutaneous abscess through a small tract in the lower chest wall below the insertion of the diaphragm. The abscesses contained thick pus and necrotic material. Histopathology of the spleen revealed the characteristic tuberculoid granuloma with epithelioid cells, Langhans' multinucleated giant cells, and caseation necrosis (Figure 3). Acid fast bacilli staining, tuberculous and bacterial cultures were all negative.\r\nThe patient was started on Isoniazid (INH) 300 mg OD, Rifampin 600 mg OD, Ethambutol 600 mg OD and Pyrazinamide 500 mg OD for 5 weeks, then maintained on the former two drugs. The patient's condition improved on anti-tuberculous medications and showed good clinical progress at one-year follow-up.", "nodes": [{"id": "PMC3437073_01_AS1", "label": "Abdomen", "type": "AnatomicalSite", "attributes": "match=exact; distance=0"}, {"id": "PMC3437073_01_AS2", "label": "Skin", "type": "AnatomicalSite", "attributes": "match=exact; distance=0"}, {"id": "PMC3437073_01_AS3", "label": "Spleen", "type": "AnatomicalSite", "attributes": "match=exact; distance=0"}, {"id": "PMC3437073_01_AS4", "label": "Rib Cage", "type": "AnatomicalSite", "attributes": "match=exact; distance=0"}, {"id": "PMC3437073_01_AS5", "label": "Lung", "type": "AnatomicalSite", "attributes": "match=exact; distance=0"}, {"id": "PMC3437073_01_AS6", "label": "Diaphragm", "type": "AnatomicalSite", "attributes": "match=exact; distance=0"}, {"id": "PMC3437073_01_AS7", "label": "Epithelioid Cells", "type": "AnatomicalSite", "attributes": "match=exact; distance=0"}, {"id": "PMC3437073_01_AS8", "label": "Giant Cells", "type": "AnatomicalSite", "attributes": "match=exact; distance=0"}, {"id": "PMC3437073_01_D1", "label": "T , "r2": ["HAS_UNIT"], "p": null, "ent": false}], "mentions": {"PMC3437073_01_D1|PMC3437073_01_AS5": [[5, 103, 115, 67, 71, "LOCATED_IN", "LOCATED_IN", 0.976]]}, "sentences": {"5": "Chest X-rays showed a calcified lesion near the hilum of the right lung suggestive of an old pulmonary tuberculosis."}}, "PMC3557982_01": {"patient": "age=1.0; gender=Female", "text": "Results for PCR of nasopharyngeal and tracheal aspiration samples were negative for influenza. Results were also negative for urinary antigen detection for pneumococcus and Legionella spp., hantavirus IgM, and tracheal and blood cultures. Gram staining of the respiratory specimen was notable for its abundance of leukocytes and absence of bacteria. Respiratory viral cultures revealed a cytopathic effect after 6 days of incubation, and adenovirus was confirmed by indirect immunofluorescence (Light Diagnostics Respiratory Panel I Viral Screening and Identification IFA; Millipore, Billerica, MA, USA). \r\nGiven the severity of this case, the virus isolate from the patient was sent to the National Microbiology Laboratory in Winnipeg, Manitoba, Canada, to determine its serotype by partial hexon gene sequencing, as described; the infecting strain was found to be HAdV-14. Postmortem examination of the patient revealed dark purple, heavy lungs with marked consolidation and patchy hemorrhagic foci; the right lung weighed 1,593 g and the left 1,268 g (reference range 350-450 g). Examination by microscopy showed diffuse alveolar damage, fibrinohemorrhagic changes, areas of necrosis, and cellular debris (Figure 1). Immunohistochemistry (Anti-Adenovirus Antibody, clone 20/11 | MAB8052; Millipore) for adenovirus showed few epithelial cells which had cytoplasmic granular and nuclear positivity.\r\nOnce HAdV-14 had been isolated, we conducted a retrospective study of all adenovirus-positive viral cultures performed at the Provincial Laboratory for Viral Illnesses, Centre hospitalier universitaire Dr-Georges-L.-Dumont (Moncton, New Brunswick, Canada), to search for other HAdV-14 cases that might have occurred during March 21, 2011-August 31, 2011. All 14 single-patient, adenovirus-positive isolates found during the survey were submitted for partial hexon gene sequencing; HAdV-14 was found in 2 of the isolates. Of the 12 non-HAdV-14 isolates, 1 was HAdV serotype 1, 8 were HAdV serotype 2, and 3 were HAdV serotype 3. The clinical data for the 2 HAdV-14 cases was limited. The first was a case of upper respiratory tract infection and acute bilateral otitis media in a 1-year-old boy who was hospitalized in July 2011. The second was a case of severe pneumonia in a 45-year-old man who was hospitalized in August 2011. Both patients survived.\r\nThe 3 cases of HAdV-14 infection were severe, requiring hospitalization of the patients. Pneumonia developed in 2 of the patients, 1 of whom died. The cases occurred within a brief 43-day period, and the young boy and man lived within a 35-km radius of the female patient who died. The clinical outcome for these cases is consistent with previously reported clinical data on HAdV-14 infection and the apparently enhanced virulence of this strain.\r\nWe performed nucleotide sequencing of the E1A, fiber, and hexon genes of the HAdV-14 isolates from Canada and compared the sequences with those for published adenovirus subspecies B2 (type 11, 14, 34, and 35) (Figure 2). We found no differences in the nucleic acid sequences of the 3 isolates from Canada, which were also identical to HAdV-14p1 strains from the United States and Ireland. The fiber gene sequence of the isolates from Canada contained the 6-nt deletion identified in HAdV-14p1 strain from the United States and Ireland. Phylogenetic analysis of the E1A, fiber, and hexon genes revealed that isolates from Canada, the United States, and Ireland clustered together. Restriction enzyme analysis was not performed on the 3 isolates from Canada; however, phylogenetic analysis and the presence of the 6-nt deletion suggested that these isolates corresponded to the genomic variant HAdV-14p1.", "nodes": [{"id": "PMC3557982_01_AS1", "label": "Trachea", "type": "AnatomicalSite", "attributes": "match=fuzzy; distance=1"}, {"id": "PMC3557982_01_AS2", "label": "Blood", "type": "AnatomicalSite", "attributes": "match=exact; distance=0"}, {"id": "PMC3557982_01_AS3", "label": "Leukocytes", "type": "AnatomicalSite", "attributes": "match=exact; distance=0"}, {"id": "PMC3557982_01_AS4", "label": "Lung", "type": "AnatomicalSite", "attributes": "match=exact; distance=0"}, {"id": "PMC3557982_01_AS5", "label": "Epithelial Cells", "type": "AnatomicalSite", "attributes": "match=exact; distance=0"}, {"id": "PMC3557982_01_AS6", "label": "Radius", "type": "AnatomicalSite", "attributes": "match=exact; distance=0"}, {"id": "PMC3557982_01_D1", "label": "Otitis Media", "type": "Diagnosis", "attributes": "match=exact; distance=0"}, {"id": "PMC3557982_01_D2", "label": "Pneumonia", "type": "Diagnosis", "attributes": "match=exact; distance=0"}, {"id": "PMC3557982_01_D3", "label": "Sprains and Strains", "type": "Diagnosis", "attributes": "match=exact; distance=0"}, {"id": "PMC3557982_01_E1", "label": "Staining and Labeling", "type": "Exam", "attributes": "match=exact; distance=0"}, {"id": "PMC3557982_01_E2", "label": "Fluorescent Antibody Technique, Indirect", "type": "Exam", "attributes": "match=exact; distance=0"}, {"id": "PMC3557982_01_E3", "label": "Mass Screening", "type": "Exam", "attributes": "match=exact; distance=0"}, {"id": "PMC3557982_01_E4", "label": "Microscopy", "type": "Exam", "attributes": "match=exact; distance=0"}, {"id": "PMC3557982_01_E5", "label": "Immunohistochemistry", "type": "Exam", "attributes": "match=exact; distance=0"}, {"id": "PMC3557982_01_F1", "label": "athic effect after 6 days of incubation, and adenovirus was", "type": "Finding", "attributes": ""}, {"id": "PMC3557982_01_F2", "label": "diffuse alveolar damage, fibrinohemorrhagic changes, areas", "type": "Finding", "attribu ic antigen (CEA), and cancer antigen 19-9 (CA 19-9) were within normal values.\r\nContrast-enhanced computed tomography (CT) scan showed a 9.2 x 9.5 x 11.5 cm, huge, and well-defined left suprarenal mass arising either from adrenal gland, pancreas, or retroperitoneum. The mass demonstrated mild heterogeneous enhancement with central cystic/necrotic area. No evidence of lymphadenopathy or regional/distant metastasis was identified (Figures 1(a) and 1(b)).\r\nAt laparoscopy, the mass was noticed to originate from pancreatic tail. Patient underwent surgical resection of pancreatic tail, splenectomy, and celiac lymph node dissections. Macroscopic and microscopic examination of spleen and celiac lymph node dissections revealed unremarkable pathological findings and were negative for malignant components.\r\nMacroscopically, the distal pancreatic mass measured 7.1 x 6.2 cm. A cut section showed solid and yellow mass with a central cystic area. Microscopically, the distal pancreatic mass was composed of monomorphic spindle-shaped Schwann cells with poorly defined eosinophilic cytoplasm and pointed basophilic nuclei set in a collagenous stroma. Focal nuclear palisading was noted (Figure 2(a)). Areas characteristic of Antoni B composed of Schwann cells with inconspicuous cytoplasm and nuclei suspended in myxoid matrix were identified. Scattered degenerated nuclei in a hyalinized stroma suggestive of ancient schwannoma were present. No mitosis or necrosis was noted (Figure 2(b)). Immunohistochemically, tumor cells stained diffusely and strongly positive for S100 protein (Figure 3). Conversely, tumor cells stained negative for CD34, CD117, CK, and ALK-1. A final diagnosis of primary ancient schwannoma of pancreatic tail was established.\r\nPatient had an uneventful postoperative course following surgery. Postoperatively, patient received no adjuvant therapy. At a postoperative 6-month followup, patient was completely asymptomatic and CT scan imaging showed no evidence of tumor recurrence.", "nodes": [{"id": "PMC3859158_01_AS1", "label": "Abdomen", "type": "AnatomicalSite", "attributes": "match=exact; distance=0"}, {"id": "PMC3859158_01_AS2", "label": "Blood", "type": "AnatomicalSite", "attributes": "match=exact; distance=0"}, {"id": "PMC3859158_01_AS3", "label": "Pancreas", "type": "AnatomicalSite", "attributes": "match=exact; distance=0"}, {"id": "PMC3859158_01_AS4", "label": "Tail", "type": "AnatomicalSite", "attributes": "match=exact; distance=0"}, {"id": "PMC3859158_01_AS5", "label": "Lymph", "type": "AnatomicalSite", "attributes": "match=exact; distance=0"}, {"id": "PMC3859158_01_AS6", "label": "Spleen", "type": "AnatomicalSite", "attributes": "match=exact; distance=0"}, {"id": "PMC3859158_01_AS7", "label": "Schwann Cells", "type": "AnatomicalSite", "attributes": "match=exact; distance=0"}, {"id": "PMC3859158_01_AS8", "label": "Cytoplasm", "type": "AnatomicalSite", "attributes": "match=exact; distance=0"}, {"id": "PMC3859158_01_AS9", "label": "Cells", "type": "AnatomicalSite", "attributes": "match=exact; distance=0"}, {"id": "PMC3859158_01_D1", "label": "Pancreatitis", "type": "Diagnosis", "attributes": "match=exact; distance=0"}, {"id": "PMC3859158_01_D2", "label": "Neoplasms", "type": "Diagnosis", "attributes": "match=exact; distance=0"}, {"id": "PMC3859158_01_D3", "label": "Lymphadenopathy", "type": "Diagnosis", "attributes": "match=exact; distance=0"}, {"id": "PMC3859158_01_E1", "label": "Physical Examination", "type": "Exam", "attributes": "match=exact; distance=0"}, {"id": "PMC3859158_01_E2", "label": "Palpation", "type": "Exam", "attributes": "match=exact; distance=0"}, {"id": "PMC3859158_01_E3", "label": "Tomography", "type": "Exam", "attributes": "match=exact; distance=0"}, {"id": "PMC3859158_01_E4", "label": "Laparoscopy", "type": "Exam", "attributes": "match=exact; distance=0"}, {"id": "PMC3859158_01_E5", "label": "Dissection", "type": "Exam", "attributes": "match=fuzzy; distance=1"}, {"id": "PMC3859158_01_F1", "label": " 8, 108, 114, 40, 45, "TARGETS", "NONE", 0.206]], "PMC3859158_01_T2|PMC3859158_01_AS2": [[8, 116, 123, 40, 45, "TARGETS", "NONE", 0.243]], "PMC3859158_01_T3|PMC3859158_01_AS2": [[8, 145, 169, 40, 45, "TARGETS", "NONE", 0.021]], "PMC3859158_01_E3|PMC3859158_01_AS3": [[9, 27, 37, 157, 165, "PERFORMED_ON", "NONE", 0.026]], "PMC3859158_01_E4|PMC3859158_01_AS4": [[12, 3, 14, 66, 70, "PERFORMED_ON", "NONE", 0.154]], "PMC3859158_01_E5|PMC3859158_01_AS4": [[13, 92, 103, 51, 55, "PERFORMED_ON", "NONE", 0.194]], "PMC3859158_01_E5|PMC3859158_01_AS5": [[13, 92, 103, 81, 86, "PERFORMED_ON", "PERFORMED_ON", 0.999], [14, 72, 83, 61, 66, "PERFORMED_ON", "PERFORMED_ON", 0.999]], "PMC3859158_01_E5|PMC3859158_01_AS6": [[14, 72, 83, 43, 49, "PERFORMED_ON", "NONE", 0.396]], "PMC3859158_01_D2|PMC3859158_01_T3": [[8, 181, 187, 145, 169, "NONE", "TREATED_BY", 0.911]]}, "sentences": {"2": "Patient denied any history of physical trauma, gastroesophageal reflux disease, gastritis, peptic ulcer disease, pancreatitis, or hepatobiliary disease.", "8": "All laboratory tests including complete blood count, hepatic, coagulation renal and bone profiles, amylase, lipase, lactate dehydrogenase (LDH), carcinoembryonic antigen (CEA), and cancer antigen 19-9 (CA 19-9) were within normal values.", "9": "Contrast-enhanced computed tomography (CT) scan showed a 9.2 x 9.5 x 11.5 cm, huge, and well-defined left suprarenal mass arising either from adrenal gland, pancreas, or retroperitoneum.", "12": "At laparoscopy, the mass was noticed to originate from pancreatic tail.", "13": "Patient underwent surgical resection of pancreatic tail, splenectomy, and celiac lymph node dissections.", "14": "Macroscopic and microscopic examination of spleen and celiac lymph node dissections revealed unremarkable pathological findings and were negative for malignant components."}}, "PMC3897989_01": {"patient": "age=65.0; gender=Male", "text": "A 65-year-old male was admitted to our hospital complaining of jaundice, pruritus, mild right upper abdominal pain and darkening urine. Past medical history revealed atrial fibrillation and the patient was on intermittent aspirin therapy. And the family history was negative. Physical examination revealed icteric sclera and skin, mild upper abdominal tenderness, arythmia, irregular heart sound and pulse deficit.\r\nThe laboratory test data at admission showed that the serum levels of alanine transaminase (ALT), aspartate transaminase (AST), alkaline phosphatase (ALP), gamma-glutamyltransferase (gamma-GT), total bilirubin (TBil) and direct bilirubin (DBil) were elevated to 79 U/L (5-45 U/L), 51 U/L (5-35 U/L), 540 U/L (30-110 U/L), 197 U/L (7-50 U/L), 408 mumol/L(0-20.5 mumol/L) and 283.7 mumol/L (0-6.8 mumol/L), respectively. Serum IgG and IgM were 3,180 mg/dL (694-1620 mg/dL) and 344 mg/dL (60-263 mg/dL), respectively. The titer of antinuclear antibody (ANA) was 1:320. Screening for antoimmune diseases revealed that the patient was positive for antimitochondrial antibody (AMA), anti-AMA-M2 and anti-Ro antibody. Common tumor markers and viral markers were all negative.\r\nBoth computed tomography (CT) and magnetic resonance image (MRI) revealed diffusive enlargement of the pancreas, capsuled by an armorlike low-density rim and enhanced homogenously (Figure 1). Other abnormalities included significant dilation of intra- and extra-hepatic bile duct, diffusive thickening of the gallbladder wall and atrophy of the right kidney. Endoscopic retrograde cholangio-pancreatography (ERCP) was conducted, revealing similar findings with CT and MRI. No sign of malignancy was observed. Test of tumor markers from the bile showed CEA of 66.89 ng/mL (0-5 ng/mL) and CA199 larger than 4000 U/mL (<37.0 U/mL), but examinations of exfoliated cells proved negative for three consecutive times. The biliary culture was positive for ESBL-producing Klebsiella pneumoniae. Infection was suspected and meropenem (0.5 g per 8 hours) was administered.\r\nBased on the biochemical evidence of cholestasis from the elevation of ALP, gamma-GT and TBil, and the presence of AMA, the patient was clinically diagnosed with PBC and UDCA (250 mg, three times per day) was initiated immediately after nasobiliary drainage, which partially improved the patient's liver function (Figure 2). Since the patient was also suspected of suffering from AIP, the following examinations were conducted. IgG4 was measured and turned out to be 44.36 g/L (0.03-2 g/L). CT-guided pancreatic biopsy was performed, and histopathological evaluation showed dense lymphoplasmacytic infiltration and fibrosis. IgG4+ plasma cell was stained and counted to be as high as 95 per high-power field (HPF) (Figure 3). ECT of salivary gland was normal. So the diagnosis of type I AIP was confirmed in accordance with the diagnostic criteria.\r\nSteroid therapy with intravenous methylprednisolone (MEP) (40 mg per day) was administered promptly. Serum ALP, gamma-GP, TBil and DBil just before steroid therapy were 376 U/L, 38 U/L, 404.9 mumol/L and 289.2 mumol/L, respectively, and one week later were 243 U/L, 47 U/L, 47 U/L, 206.1 mumol/L and 167.1 mumol/L, respectively. Then we stepped down the steroid therapy with oral MEP 32 mg daily, yet the serum liver enzymes and bilirubin bounced up. So we increased the dose to 32 mg in the morning and 16 mg in the afternoon. And then the laboratory values improved. A repeat MRI showed remarkable reduction of the pancreas. 40 days after treatment, the IgG and IgM returned back into the normal range. The serum levels of ALP, gamma-GP, TBil and DBil were 135 U/L, 134 U/L, 82.8 mumol/L and 54.9 mumol/L, respectively. The patient was discharged and followed up at the clinic with MEP tapered off weekly by 5 mg. The clinical course is depicted in Figure 2.\r\nAbout 40 days after discharge, the patient developed red maculopapules on his right chest with prickling-like pain, worsened with erosion and blisters. The patient was diagnosed with herpes zoster and treated with acyclovir (500 mg twice a day) for 9 days. Unfortunately for the patient, a chest X-ray later showed multiple nodules in the right lung. Chest CT displayed multiple patchy shadows with cavity. CT-guided lung biopsy showed neutrophil aggregation and fibrous effusion within the alveoli. The patient was diagnosed with pulmonary abscess and was treated effectively with moxifloxacin (Figure 1). Given the immunosuppressed status of the patient, thymosin was injected twice a week to restore the immune function. The liver function and immunological indices of the patient were normal during the subsequent one-year follow-up period.", "nodes": [{"id": "PMC3897989_01_AS1", "label": "Urine", "type": "AnatomicalSite", "attributes": "match=exact; distance=0"}, {"id": "PMC3897989_01_AS10", "label": "Cells", "type": "AnatomicalSite", "attributes": "match=exact; distance=0"}, {"id": "PMC3897989_01_AS11", "label": "Liver", "type": "AnatomicalSite", "attributes": "match=exact; distance=0"}, {"id": "PMC3897989_01_AS12", "label": "Plasma", "type": "AnatomicalSite", "attributes": "match=exact; distance=0"}, {"id": "PMC3897989_01_AS13", "label": "Back", "type": "AnatomicalSite", "attributes": "match=exact; distance=0"}, {"id": "PMC3897989_01_AS14", "label": "Lung", "type": "AnatomicalSite", "attributes": "match=exact; distance=0"}, {"id": "PMC3897989_01_AS15", "label": "Neutrophils", "type": "AnatomicalSite", "attributes": "match=fuzzy; distance=1"}, {"id": "PMC3897989_01_AS2", "label": "Sclera", "type": "AnatomicalSite", "attributes": "match=exact; distance=0"}, {"id": "PMC3897989_01_AS3", "label": "Skin", "type": "AnatomicalSite", "attributes": "match=exact; distance=0"}, {"id": "PMC3897989_01_AS4", "label": "Heart", "type": "AnatomicalSite", "attributes": "match=exact; distance=0"}, {"id": "PMC3897989_01_AS5", "label": "Serum", "type": "AnatomicalSite", "attributes": "match=exact; distance=0"}, {"id": "PMC3897989_01_AS6", "label": "Pancreas", "type": "AnatomicalSite", "attributes": "mat C3897989_01_E6|PMC3897989_01_AS15": [[36, 15, 21, 29, 39, "PERFORMED_ON", "PERFORMED_ON", 0.999]], "PMC3897989_01_E2|PMC3897989_01_S5": [[7, 0, 9, 25, 33, "NONE", "EXCLUDES", 0.997]]}, "sentences": {"3": "Physical examination revealed icteric sclera and skin, mild upper abdominal tenderness, arythmia, irregular heart sound and pulse deficit.", "4": "The laboratory test data at admission showed that the serum levels of alanine transaminase (ALT), aspartate transaminase (AST), alkaline phosphatase (ALP), gamma-glutamyltransferase (gamma-GT), total bilirubin (TBil) and direct bilirubin (DBil) were elevated to 79 U/L (5-45 U/L), 51 U/L (5-35 U/L), 540 U/L (30-110 U/L), 197 U/L (7-50 U/L), 408 mumol/L(0-20.5 mumol/L) and 283.7 mumol/L (0-6.8 mumol/L), respectively.", "7": "Screening for antoimmune diseases revealed that the patient was positive for antimitochondrial antibody (AMA), anti-AMA-M2 and anti-Ro antibody.", "9": "Both computed tomography (CT) and magnetic resonance image (MRI) revealed diffusive enlargement of the pancreas, capsuled by an armorlike low-density rim and enhanced homogenously (Figure 1).", "16": "Based on the biochemical evidence of cholestasis from the elevation of ALP, gamma-GT and TBil, and the presence of AMA, the patient was clinically diagnosed with PBC and UDCA (250 mg, three times per day) was initiated immediately after nasobiliary drainage, which partially improved the patient's liver function (Figure 2).", "19": "CT-guided pancreatic biopsy was performed, and histopathological evaluation showed dense lymphoplasmacytic infiltration and fibrosis.", "20": "IgG4+ plasma cell was stained and counted to be as high as 95 per high-power field (HPF) (Figure 3).", "25": "Then we stepped down the steroid therapy with oral MEP 32 mg daily, yet the serum liver enzymes and bilirubin bounced up.", "33": "The patient was diagnosed with herpes zoster and treated with acyclovir (500 mg twice a day) for 9 days.", "36": "CT-guided lung biopsy showed neutrophil aggregation and fibrous effusion within the alveoli."}}, "PMC3917415_01": {"patient": "age=47.0; gender=Female", "text": "A 47-year-old Japanese woman with 23 years' history of SLE had sudden onset of severe headache and was referred to our hospital. She had been treated as an out-patient with a daily prednisolone dose of 7.5mg and cyclophosphamide of 50mg/day before the onset. Her glomerular filtration rate (GFR) was 5.6mL/minute /1.73m2 and the stage was classified as G5 (end stage) of chronic kidney disease (CKD) on admission. Laboratory examinations revealed hypocomplementemia (complement C3: 66mg/dL, C4: 14mg/dL). Her anti-double-stranded deoxyribonucleic acid (DNA) antibody (IgG) was 6.5IU/mL (normal range <20). Computed tomography (CT) demonstrated SAH in her right Sylvian fissure (Figure 1a). Considering that she had SLE and had developed chronic renal failure without renal dialysis, MRA was used to identify her ruptured aneurysm. MRA was performed using a 1.5T magnetic resonance system (Signa HDxt, GE, USA). Contrast material was not used. The volume rendering (VR) method with three-dimensional time-of-flight (TOF) MRA was performed (Figure 1c,d) in addition to the usual maximum intensity projection (MIP) image (Figure 1b). MRA revealed a fenestration at the M1 portion of her right MCA and a small saccular aneurysm at the proximal end of the fenestration (Figure 1c,d). This was consistent with a ruptured aneurysm. A left frontotemporal craniotomy was performed to clip the neck of her aneurysm on the same day. The fenestration and ruptured aneurysm were confirmed under surgical microscopy, and the aneurysm was successfully occluded (Figure 2a,b). Intraoperative indocyanine green videoangiography confirmed this result (Figure 2c). The present patient was carefully managed avoiding cerebral vasospasm and general complications during the perioperative period and renal dialysis was initiated after the acute phase and had a favorable outcome. Postoperatively, she developed normal pressure hydrocephalus, requiring placement of a ventriculoperitoneal shunt. She was ultimately discharged home in good condition.", "nodes": [{"id": "PMC3917415_01_AS1", "label": "Kidney", "type": "AnatomicalSite", "attributes": "match=exact; distance=0"}, {"id": "PMC3917415_01_AS2", "label": "Neck", "type": "AnatomicalSite", "attributes": "match=exact; distance=0"}, {"id": "PMC3917415_01_D1", "label": "Aneurysm", "type": "Diagnosis", "attributes": "match=exact; distance=0"}, {"id": "PMC3917415_01_D2", "label": "Vasospasm, Intracranial", "type": "Diagnosis", "attributes": "match=exact; distance=0"}, {"id": "PMC3917415_01_D3", "label": "Hydrocephalus", "type": "Diagnosis", "attributes": "match=exact; distance=0"}, {"id": "PMC3917415_01_E1", "label": "Prednisolone", "type": "Exam", "attributes": "match=exact; distance=0"}, {"id": "PMC3917415_01_E2", "label": "Cyclophosphamide", "type": "Exam", "attributes": "match=exact; distance=0"}, {"id": "PMC3917415_01_E3", "label": "Glomerular Filtration Rate", "type": "Exam", "attributes": "match=exact; distance=0"}, {"id": "PMC3917415_01_E4", "label": "Complement C3", "type": "Exam", "attributes": "match=exact; distance=0"}, {"id": "PMC3917415_01_E5", "label": "Tomography", "type": "Exam", "attributes": "match=exact; distance=0"}, {"id": "PMC3917415_01_E6", "label": "Microscopy", "type": "Exam", "attributes": "match=exact; distance=0"}, {"id": "PMC3917415_01_F1", "label": "SAH in her right Sylvian fissure (Figure 1a)", "type": "Finding", "attributes": ""}, {"id": "PMC3917415_01_H1", "label": "Headache", "type": "History", "attributes": "category=symptom"}, {"id": "PMC3917415_01_P1", "label": "case PMC3917415_01", "type": "Patient", "attributes": "age=47.0; gender=Female"}, {"id": "PMC3917415_01_R1", "label": "7.5 mg", "type": "ExamResult", "attributes": "value=7.5"}, {"id": "PMC3917415_01_R2", "label": "50 mg", "type": "ExamResult", "attributes": "value=50"}, {"id": "PMC3917415_01_R3", "label": "5.6 mL", a huge craniofacial tumor was scheduled for elective tracheostomy due to airway compromization. The tumor invaded the hypo and oropharynx causing displacement of the eyes, nasal obstruction with limited mouth opening and neck extension [Figure 1]. The patient had obstructive sleep apnea, shortness of breath, visual impairment and dysphagia for which gastrostomy was inserted for enteral feeding. The patient had a recurrence of the tumor after surgical intervention and multiple courses of chemo and radiotherapy. The patient absolutely refused any trial to insert an intravenous (IV) cannula as she had a low threshold for pain and on examination, her veins were apparently exhausted and sclerosed from chemotherapy and no vein could not be chosen to apply, EMLA cream. The patient was categorized as impossible to both intubate and ventilate due to severely distorted airway anatomy in uncooperative patient. Communication with the patient was challenging due to dysphonia. With the help of her mother, she reported that her daughter is absolutely refusing IV cannulation and she expressed her fear of pain perception during the tracheostomy procedure. Consent was taken from the patient to take a photo for her. In the high dependency unit, 2 h before surgery, sedation was initiated under full monitoring with baseline non-invasive blood pressure (BP) 111/74 mmHg, heart rate (HR) 92/min, oxygen hemoglobin saturation 98% and respiratory rate (RR) 17/min.\r\nKetamine (Tekam, Hikma, Jordan) with a dose of 120 mg (3 mg/kg) diluted in 10 ml normal saline was administered through the gastrostomy tube. That was followed by administration of 80 mcg (2 mcg/kg) dexmedetomidine (Precedex; Hospira, Inc., Lake Forest, IL, USA) diluted in 10 ml normal saline. EMLA 5 g cream 5% (Astra Pharma, Inc., Mississauga, Ontario, Canada) was applied over the planned tracheostomy site about 10 cm2 and covered by transparent film dressing (Tegaderm Film, 3M Health-Care, USA).\r\nIn OR, the patient was sedated yet awake with eye opening to verbal commands. Non-invasive monitoring was applied for the patient (BP, electrocardiogram, pulse oximetry). BP was 105/70 mmHg, HR: 89/min, RR: 16/min and O2 Sat: 98%. A 24G IV cannula was inserted in the left antecubital vein guided by ultrasound without complaint. 5 ml lidocaine 1% + adrenaline 1/200,000 were infiltrated over tracheostomy site by the surgeon after IV was secured with full cooperation by the patient. Cuffed tracheostomy tube size 6.0 mm tube was easily inserted. No changes in vital signs were observed during the procedure. On the following day, the cuffed tracheostomy tube was replaced by a fenestrated one; to allow the patient to speak. The mother informed the team that her daughter was highly satisfied and had no recall of the procedure.", "nodes": [{"id": "PMC3950436_01_AS1", "label": "Oropharynx", "type": "AnatomicalSite", "attributes": "match=exact; distance=0"}, {"id": "PMC3950436_01_AS2", "label": "Mouth", "type": "AnatomicalSite", "attributes": "match=exact; distance=0"}, {"id": "PMC3950436_01_AS3", "label": "Neck", "type": "AnatomicalSite", "attributes": "match=exact; distance=0"}, {"id": "PMC3950436_01_AS4", "label": "Veins", "type": "AnatomicalSite", "attributes": "match=exact; distance=0"}, {"id": "PMC3950436_01_AS5", "label": "Eye", "type": "AnatomicalSite", "attributes": "match=exact; distance=0"}, {"id": "PMC3950436_01_D1", "label": "Nasal Obstruction", "type": "Diagnosis", "attributes": "match=exact; distance=0"}, {"id": "PMC3950436_01_E1", "label": "Blood Pressure", "type": "Exam", "attributes": "match=exact; distance=0"}, {"id": "PMC3950436_01_E2", "label": "Heart Rate", "type": "Exam", "attributes": "match=exact; distance=0"}, {"id": "PMC3950436_01_E3", "label": "Respiratory Rate", "type": "Exam", "attributes": "match=exact; distance=0"}, {"id": "PMC3950436_01_E4", "label": "Electrocardiography", "type": "Exam", "attributes": "match=exact; distance=0"}, {"id": "PMC3950436_01_E5", "label": "Oximet examination, her veins were apparently exhausted and sclerosed from chemotherapy and no vein could not be chosen to apply, EMLA cream."}}, "PMC4073451_01": {"patient": "age=14.0; gender=Female", "text": "In April of 2008, a 14-year-old girl was referred to department of Surgery and Oral Pathology to investigate a multilocular radiolucent lesion involving body and ramus of right mandible that was discovered, incidentally, in orthodontic documentation [Figure 1a]. The extraoral view showed slight swelling in region of right mandible and the intraoral examination showed no alterations in oral mucosa. In addition, computerized tomography (CT) with axial and 3-dimensional (3D) reconstruction was performed to define the extension of lesion and the views showed hypodense expansive lesion with buccal and lingual cortical expansion that pushed the mandibular canal to the base. Incisional biopsy was performed under local anesthesia revealing a cystic lesion, it was then marsupialized. The histological examination of the specimen diagnosed a keratocystic odontogenic tumor.\r\nIn June of 2009, 14 months after decompression was performed, the cyst was enucleated through an intraoral approach under general anesthesia. The patient was lost to follow-up returning in October of 2011, during which an oblique mandibular radiograph was done, revealing a small radiolucent lesion with radiopaque borders in same region of the keratocystic odontogenic tumor [Figure 1b]. It was confirmed on panoramic radiograph [Figure 1c]. A CT scan was done and it revealed a hypodense lesion that caused the expansion of cortical bone suggesting bone repair. Moreover, two parallel hyperdense lines in posterior region of right body of mandible were seen, compatible with bifid mandibular canal [Figure 1d]. In addition, a multislice CT scan was performed which revealed an ascendant bifurcation of the mandibular canal from nearly the angle to the superior border of mandible, surrounding the bone repair, simulating sclerotic margins of a possible recurrence [Figure 2].", "nodes": [{"id": "PMC4073451_01_AS1", "label": "Mandible", "type": "AnatomicalSite", "attributes": "match=exact; distance=0"}, {"id": "PMC4073451_01_AS2", "label": "Mandibular Canal", "type": "AnatomicalSite", "attributes": "match=exact; distance=0"}, {"id": "PMC4073451_01_AS3", "label": "Cortical Bone", "type": "AnatomicalSite", "attributes": "match=exact; distance=0"}, {"id": "PMC4073451_01_E1", "label": "Tomography", "type": "Exam", "attributes": "match=exact; distance=0"}, {"id": "PMC4073451_01_E2", "label": "Biopsy", "type": "Exam", "attributes": "match=exact; distance=0"}, {"id": "PMC4073451_01_E3", "label": "Radiography", "type": "Exam", "attributes": "match=fuzzy; distance=1"}, {"id": "PMC4073451_01_F1", "label": "It was", "type": "Finding", "attributes": ""}, {"id": "PMC4073451_01_P1", "label": "case PMC4073451_01", "type": "Patient", "attributes": "age=14.0; gender=Female"}, {"id": "PMC4073451_01_S1", "label": "Recurrence", "type": "Symptom", "attributes": "match=exact; distance=0"}, {"id": "PMC4073451_01_T1", "label": "Decompression", "type": "Treatment", "attributes": "match=exact; distance=0"}], "edges": [{"s": "PMC4073451_01_P1", "t": "PMC4073451_01_E1", "r1": ["UNDERWENT_EXAM"], "r2": ["UNDERWENT_EXAM"], "p": null, "ent": false}, {"s": "PMC4073451_01_E1", "t": "PMC4073451_01_AS2", "r1": ["PERFORMED_ON"], "r2": [], "p": null, "ent": true}, {"s": "PMC4073451_01_P1", "t": "PMC4073451_01_E2", "r1": ["UNDERWENT_EXAM"], "r2": ["UNDERWENT_EXAM"], "p": null, "ent": false}, {"s": "PMC4073451_01_P1", "t": "PMC4073451_01_T1", "r1": ["UNDERWENT_TREATMENT"], "r2": ["UNDERWENT_TREATMENT"], "p": null, "ent": false}, {"s": "PMC4073451_01_P1", "t": "PMC4073451_01_E3", "r1": ["UNDERWENT_EXAM"], "r2": ["UNDERWENT_EXAM"], "p": null, "ent": false}, {"s": "PMC4073451_01_E3", "t": "PMC4073451_01_F1", "r1": ["CONFIRMS"], "r2": ["CONFIRMS"], "p": null, "ent": false}, {"s": "PMC4073451_01_P1", "t": "PMC4073451_01_S1", "r1": ["PRESENTS_WITH"], "r2": ["PRESENTS_WITH"], "p": null, "ent": false}], "mentions": {}, "sentences": {}}, "PMC4310058_01": {"patient": "age=16.0; gender=Male", "text": "A 16-year-old male presented for evaluation of an indentation of his right parietal skull. The patient had first noted the indentation 2 weeks prior with no recent change in size. He had been involved in a 4-wheeler accident 2 years before and was evaluated for a possible concussion during a football game about one and a half years prior to presentation. The patient described having occasional headaches, but had no local tenderness or other neurological symptoms.\r\nOn examination, the patient was noted to have a palpable defect and indentation of the right parietal bone. The overlying scalp was unremarkable and he was neurologically intact.\r\nThe patient's previous imaging was reviewed. The first study, from 2 years prior, showed a skull defect in the right parietal bone [Figure 1a]. The second and third computed tomography (CT) scans showed progressive erosion of the skull [Figure 1b and c]. The defect did not appear to involve the dura or scalp. A magnetic resonance imaging (MRI) was obtained and confirmed the localization of the lesion to the skull [Figure 1e-f].\r\nExcision of the skull defect and right parietal cranioplasty with titanium plate was performed. The overlying tissue was grossly abnormal, measuring approximately 5 cm in diameter, and was removed en bloc. The underlying bone was thin and eggshell like with a trabeculated pattern, especially in the center. Peripherally, the bone was thickened with a sponge-like appearance. The abnormal tissue portion could be seen replacing the diploic space while leaving the inner and outer table intact at the periphery. The dura was not involved and was stripped from the bone and left intact. The abnormal bone was then removed and a mesh titanium plate was used to replace the cranial defect [Figures 1d and 3].\r\nThe patient tolerated the operation well and had no immediate operative or perioperative complications. The right parietal indentation was corrected and the patient was discharged on postoperative day 2.\r\nOn gross examination, the soft tissue lesion appeared rubbery, yellow, and avascular. The tissue consisted predominantly of dense fibrous tissue with a few foci of woven bone at the periphery adjacent to the eroded bone. Angulated spicules of bone were rare, some of which lacked osteoblastic rimming while others were rimmed. There was minimal inflammation. The final diagnosis was that of a benign fibro-osseous lesion most in keeping with a DF. The case was reviewed at the Mayo Clinic where it was felt to be an atypical FD. Conflicting pathology interpretations of these lesions is not uncommon.", "nodes": [{"id": "PMC4310058_01_AS1", "label": "Skull", "type": "AnatomicalSite", "attributes": "match=exact; distance=0"}, {"id": "PMC4310058_01_AS2", "label": "Parietal Bone", "type": "AnatomicalSite", "attributes": "match=exact; distance=0"}, {"id": "PMC4310058_01_AS3", "label": "Scalp", "type": "AnatomicalSite", "attributes": "match=exact; distance=0"}, {"id": "PMC4310058_01_AS4", "label": "Tissues", "type": "AnatomicalSite", "attributes": "match=fuzzy; distance=1"}, {"id": "PMC4310058_01_AS5", "label": "Egg Shell", "type": "AnatomicalSite", "attributes": "match=fuzzy; distance=1"}, {"id": "PMC4310058_01_E1", "label": "Tomography", "type": "Exam", "attributes": "match=exact; distance=0"}, {"id": "PMC4310058_01_E2", "label": "Magnetic Resonance Imaging", "type": "Exam", "attributes": "match=exact; distance=0"}, {"id": "PMC4310058_01_F1", "label": "progressive erosion of the skull [Figure 1b and c]", "type": "Finding", "attributes": ""}, {"id": "PMC4310058_01_F2", "label": "the localization of the lesion to the skull [Figure 1e-f]", "type": "Finding", "attributes": ""}, {"id": "PMC4310058_01_P1", "label": "case PMC4310058_01", "type": "Patient", "attributes": "age=16.0; gender=Male"}, {"id": "PMC MC4310058_01_T1|PMC4310058_01_AS1": [[11, 66, 74, 16, 21, "TARGETS", "TARGETS", 0.635]]}, "sentences": {"8": "The second and third computed tomography (CT) scans showed progressive erosion of the skull [Figure 1b and c].", "10": "A magnetic resonance imaging (MRI) was obtained and confirmed the localization of the lesion to the skull [Figure 1e-f].", "11": "Excision of the skull defect and right parietal cranioplasty with titanium plate was performed."}}, "PMC4630775_01": {"patient": "age=39.0; gender=Female", "text": "A 7-lb, 39-week-old newborn was born to a 45-year-old G14P8238 woman by cesarean delivery for prolonged rupture of membranes. The patient presented with desquamation of the palm and a leathery appearance of the skin to the right dorsal hand and circumferential forearm with frank ischemia to the thumb.\r\nWhat are the causes of neonatal compartment syndrome?\r\nWhat factors (maternal or neonatal) correlate with neonatal compartment syndrome?\r\nWhat are the signs and symptoms of neonatal compartment syndrome?\r\nWhat options are available for the treatment of neonatal compartment syndrome?", "nodes": [{"id": "PMC4630775_01_AS1", "label": "Membranes", "type": "AnatomicalSite", "attributes": "match=exact; distance=0"}, {"id": "PMC4630775_01_AS2", "label": "Skin", "type": "AnatomicalSite", "attributes": "match=exact; distance=0"}, {"id": "PMC4630775_01_AS3", "label": "Hand", "type": "AnatomicalSite", "attributes": "match=exact; distance=0"}, {"id": "PMC4630775_01_AS4", "label": "Forearm", "type": "AnatomicalSite", "attributes": "match=exact; distance=0"}, {"id": "PMC4630775_01_AS5", "label": "Thumb", "type": "AnatomicalSite", "attributes": "match=exact; distance=0"}, {"id": "PMC4630775_01_D1", "label": "Rupture", "type": "Diagnosis", "attributes": "match=exact; distance=0"}, {"id": "PMC4630775_01_P1", "label": "case PMC4630775_01", "type": "Patient", "attributes": "age=39.0; gender=Female"}, {"id": "PMC4630775_01_S1", "label": "Ischemia", "type": "Symptom The procedure was successful with no residual shunt, intraoperative or postoperative complications.\r\nTen days later, the patient developed a persistent fever of up to 40 C which failed to respond to a 1-week course of co-amoxyclav. The patient was admitted to the pediatric ward for additional investigation. The temperature was 39 C, heart rate was 140/m, respiratory rate was 30/min, and blood pressure was 100/60 mm Hg on admission. A new systolic murmur (3/6) was detected in the lower left sternal border with no organomegaly, no splinter hemorrhages or Roth's spots detected. Laboratory investigations showed an elevated erythrocyte sedimentation rate of 120 mm/h, C-reactive protein of 91 mg/dl, a white blood cell count of 28,000/mm3 and normal platelet count as well as hemoglobin of 6 g% for which she received blood transfusion. Three sets of blood cultures were taken, and all grew Pseudomonas aeuroginosa.\r\nEchocardiography revealed vegetation of 5 mm x 6 mm attached to the tricuspid valve, a flail tricuspid valve, and severe tricuspid regurgitation. It also showed moderate to severe dilatation of the right ventricle, but no pulmonary hypertension. The VSD was completely closed by the coil with no residual shunt. The patient was diagnosed with infective endocarditis and started empirically on the sensitivity results showed resistance to ceftazidime and sensitive to ciprofloxacin. Vancomycin was continued due to the high incidence of methicillin-resistant Staphylococcus aureus in the unit. She showed no improvement for 3 weeks and continued to develop intermittent fever; blood tests showed persistent leucocytosis, a high sedimentation rate, and high C-reactive protein.\r\nThe patient then underwent surgical intervention on cardiopulmonary bypass. Opening the right atrium revealed a destroyed tricuspid valve with vegetations and necrotic tissues around the coil [Figure 1]. The coil was removed, and the VSD was closed by an autologous pericardial patch using a continuous prolene suture [Figure 2]. The tricuspid valve could not be repaired and was replaced with a size 31 tissue valve [Figure 3]. The bypass and cross clamp time were 35 and 12 min, respectively. The patient developed heart block immediately and was paced, however, she continued to deteriorate with heart failure and ongoing sepsis. She required high doses of inotropes (adrenaline, dopamine, and dobutamine) and was continued on antibiotics. Cultures obtained from surgical specimens were negative. She died 2 days after surgery.", "nodes": [{"id": "PMC4782471_01_AS1", "label": "Ductus Arteriosus", "type": "AnatomicalSite", "attributes": "match=exact; distance=0"}, {"id": "PMC4782471_01_AS2", "label": "Blood", "type": "AnatomicalSite", "attributes": "match=exact; distance=0"}, {"id": "PMC4782471_01_AS3", "label": "Tricuspid Valve", "type": "AnatomicalSite", "attributes": "match=exact; distance=0"}, {"id": "PMC4782471_01_AS4", "label": "Heart Ventricles", "type": "AnatomicalSite", "attributes": "match=exact; distance=0"}, {"id": "PMC4782471_01_AS5", "label": "Heart Atria", "type": "AnatomicalSite", "attributes": "match=exact; distance=0"}, {"id": "PMC4782471_01_AS6", "label": "Tissues", "type": "AnatomicalSite", "attributes": "match=exact; distance=0"}, {"id": "PMC4782471_01_D1", "label": "Hypertension", "type": "Diagnosis", "attributes": "match=exact; distance=0"}, {"id": "PMC4782471_01_D2", "label": "Endocarditis", "type": "Diagnosis", "attributes": "match=exact; distance=0"}, {"id": "PMC4782471_01_D3", "label": "Heart Failure", "type": "Diagnosis", "attributes": "match=exact; distance=0"}, {"id": "PMC4782471_01_E1", "label": "Heart Rate", "type": "Exam", "attributes": "match=exact; distance=0"}, {"id": "PMC4782471_01_E2", "label": "Respiratory Rate", "type": "Exam", "attributes": "match=exact; distance=0"}, {"id": "PMC4782471_01_E3", "label": "Blood Pressure", "type": "Exam", "attributes": "match=exact; distance=0"}, {"id": "PMC4782471_01_E4", "label": "Blood Sedime ation of 5 mm x 6 mm attached to the tricuspid valve, a flail tricuspid valve, and severe tricuspid regurgitation.", "14": "It also showed moderate to severe dilatation of the right ventricle, but no pulmonary hypertension.", "16": "The patient was diagnosed with infective endocarditis and started empirically on the sensitivity results showed resistance to ceftazidime and sensitive to ciprofloxacin.", "18": "She showed no improvement for 3 weeks and continued to develop intermittent fever; blood tests showed persistent leucocytosis, a high sedimentation rate, and high C-reactive protein.", "24": "The patient developed heart block immediately and was paced, however, she continued to deteriorate with heart failure and ongoing sepsis."}}, "PMC4828947_01": {"patient": "age=61.0; gender=Male", "text": "A 61-year-old man presented with chronic drug-resistant seizures since the age of four. After video-electroencephalogram (EEG) analysis, he was found to have complex partial seizures arising from the left temporal lobe. The seizures started with an unforced, nonversive head turning to the left, followed by a dystonic posturing of the right hand. Impairment of consciousness and apprehension together with dysphasia occurred. Postictally, the dysphasia continued and frequently there was nose wiping with the left hand. When he was considered a candidate for surgery, the patient had 1-2 seizures per month with a duration of 1 min. The seizures were treated with oxcarbazepine 1200 mg/day and valproic acid 1500 mg/day. The medical history was negative for epilepsy-associated risk factors such as febrile seizures, meningitis, and head trauma. The family history was negative with regard to epilepsy. Neurological examination demonstrated no abnormalities. A 3-Tesla magnetic resonance imaging (MRI) scan showed a cortical lesion in the medial and superior temporal gyrus of the anterior left temporal lobe, which appeared partially cystic and partially solid.\r\nThe solid part and the cyst wall enhanced after gadolinium administration. Signs of calcification or hemosiderin products were seen in the cyst wall [Figures 1 and 2]. Ictal and interictal EEG showed an epileptiform focus in the left temporal lobe, congruent with the clinical semiology and the lesion on MRI. The surgical treatment consisted of an awake craniotomy (Penfield procedure) with a maximal left-sided temporal lobectomy plus amygdalohippocampectomy and gross-total lesionectomy. The histological diagnosis was a mixed ganglioglioma-DNET, WHO Grade I. One part of the lesion [Figure 3] had a nodular myxoid, mucinous aspect with axonal bundles surrounded by oligodendrocyte-like cells. Between these bundles, an eosinophil matrix with neurons was found. The lesion stained positive with synaptophysin and S100, but was negative for glial fibrillary acidic protein (GFAP). A Ki-67-staining showed no elevated proliferative activity. This part of the lesion matched the diagnosis of a DNET, WHO Grade I. The other part of the lesion [Figure 4] had a clear neuronal and glial component and showed large and polymorph ganglion cells in a fibrillary matrix with glial cells and perivascular lymphocytic infiltrates. The neuronal part stained positive with synaptophysin and some ganglion cells were CD34 positive. Glial cells stained positive with GFAP, and Ki-67-staining was negative. Hence, this part of the lesion was compatible with a ganglioglioma.\r\nIn the first two postoperative weeks, the patient had mixed speech disturbances most probably due to manipulation-induced edema. Three weeks after operation, these disturbances had disappeared completely. Until now (60 months after operation), the patient is seizure-free.", "nodes": [{"id": "PMC4828947_01_AS1", "label": "Temporal Lobe", "type": "AnatomicalSite", "attributes": "match=exact; distance=0"}, {"id": "PMC4828947_01_AS2", "label": "Head", "type": "AnatomicalSite", "attributes": "match=exact; distance=0"}, {"id": "PMC4828947_01_AS3", "label": "Ha t temporal lobe, which appeared partially cystic and partially solid.", "22": "The neuronal part stained positive with synaptophysin and some ganglion cells were CD34 positive.", "23": "Glial cells stained positive with GFAP, and Ki-67-staining was negative."}}, "PMC4835621_01": {"patient": "age=81.0; gender=Female", "text": "An 81-year-old female was admitted to an internal medicine (IM) department with a two-week history of petechial rash over her upper and lower extremities. The patient complained of recurrent headaches on a daily basis and profound fatigue and malaise during the past month. The patient denied having fever, any recent change in her regular medications, the use of herbal or over-the-counter medications, dietary changes, or recent travel. The patient also denied recent loss of weight, night sweats, hematuria, diarrhea, nausea, or vomiting. The patient had not noticed tarry stool and denied epistaxis. The patient's past medical history was significant for hypertension and osteoporosis. The patient's regular medications were a calcium channel blocker and hydrochlorothiazide and vitamin D with calcium supplementation. None of the patient's medications were changed in the past few years.\r\n Physical Examination and Laboratory Workup. The patient's vital signs were normal, without fever. The patient was not in distress and did not have jaundice. Upon physical examination scattered petechiae were observed over the upper extremities. The rest of the patient's physical examination was within normal limits including heart, lungs, and abdomen. No hepato- or splenomegaly was noted and no melena or hematochezia was found in rectal exam. Initial neurological evaluation was within normal limits; however, during the patient's stay in the emergency room, new transient central facial nerve palsy appeared. Noncontrast enhanced head CT was negative for intracranial bleeding. Laboratory diagnostic tests revealed a white blood cell count of 6100 per microliter with 73% neutrophils, hemoglobin of 11.3 g/dL with a mean corpuscular volume (MVC) 94 femtoliters, and a reticulocyte count of 2.4%. Thrombocytes levels were 30,000 x 109/liter. Schistocytes and spherocytes were identified in the peripheral blood smear. Coagulation functions and fibrinogen were all within normal limits. Blood chemistry revealed normal creatinine and liver function tests. Lactate dehydrogenase (LDH) levels were elevated at 405 IU/L. Serum haptoglobin was decreased (15.30 mg/dL). Workup for autoantibodies and the Coombs test were negative. ADAMTS13 activity test was less than 10% with positive ADAMTS13 antibodies. Bone marrow biopsy demonstrated slightly hypercellular marrow for the patient's age, with no other significant changes.\r\n Clinical Course. A diagnosis of TTP was made and the patient was started on plasmapheresis via a femoral catheter. Steroid treatment was initiated. In order to rule out underling malignancy a computed tomography (CT) scan of the chest and abdomen was performed and showed an intraluminal thickening of 3.5 cm size in the stomach (Figure 1). Further PET CT supported the findings demonstrating an unusual thickening of the gastric cardia with hypermetabolic activity in the distal third of the esophagus, suggesting a process with an increased metabolic activity.\r\nAt this stage rituximab treatment was initiated with only mild elevation in platelets count but no clinical significant improvement. During hospitalization the patient developed a deep vein thrombosis and treatment with low molecular weight heparin (LMWH) was initiated. Further investigation with gastroduodenoscopy demonstrated normal esophagus with a few erosions in the antrum of the stomach and was consistent with gastritis. Gastric biopsy found moderate active chronic gastritis and was positive for H. pylori and negative for dysplasia. Colonoscopy showed no significant findings. The patient was treated for 10 days with a triple-therapy regime consisting of omeprazole, amoxicillin, and clarithromycin. Soon after completion of antibiotics therapy TTP regressed and platelets count returned to normal (Figure 2). Similarly, both reticulocytes count and LDH levels were decreased after triple-therapy completion 2.5% versus 0.7% and 302 IU/L versus 182 IU/L for pretreatment versus posttreatment analysis accordingly. In addition, haptoglobin levels rose after eradication therapy from 31.2 mg/dL to 99.3 mg/dL. In the last follow-up one year later, the patient was well, without any complaints. Blood count and platelets remained within normal limits and the patient was free of symptoms.", "nodes": [{"id": "PMC4835621_01_AS1", "label": "Extremities", "type": "AnatomicalSite", "attributes": "match=exact; distance=0"}, {"id": "PMC4835621_01_AS10", "label": "Bone Marrow", "type": "AnatomicalSite", "attributes": "match=exact; distance=0"}, {"id": "PMC4835621_01_AS11", "label": "Stomach", "type": "AnatomicalSite", "attributes": "match=exact; distance=0"}, {"id": "PMC4835621_01_AS12", "label": "Cardia", "type": "AnatomicalSite", "attributes": "match=exact; distance=0"}, {"id": "PMC4835621_01_AS13", "label": "Esophagus", "type": "AnatomicalSite", "attributes": "match=exact; distance=0"}, {"id": "PMC4835621_01_AS14", "label": "Reticulocytes", "type": "AnatomicalSite", "attributes": "match=exact; distance=0"}, {"id": "PMC4835621_01_AS2", "label": "Heart", "type": "AnatomicalSite", "attributes": "match=exact; distance=0"}, {"id": "PMC4835621_01_AS3", "label": "Abdomen", "type": "AnatomicalSite", "attributes": "match=exact; distance=0"}, {"id": "PMC4835621_01_AS4", "label": "Facial Nerve", "type": "AnatomicalSite", "attributes": "match=exact; distance=0"}, {"id": "PMC4835621_01_AS5", "label": "Head", "type": "AnatomicalSite", "attributes": "match=exact; distance=0"}, {"id": "PMC4835621_01_AS6", "label": "Neutrophils", "type": "AnatomicalSite", "attributes": "match=exact; distance=0"}, {"id": "PMC4835621_01_AS7", "label": "Spherocytes", "type": "Anatomic
